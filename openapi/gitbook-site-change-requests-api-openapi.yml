            type: string
            description: ID of the revision produced in the space's main content when this member was merged. Only present once the change request has been merged.
        required:
        - space
        - baseRevisionId
        - headRevisionId
    SpaceEditMode:
      type: string
      description: 'Determines how a Space can be edited.

        * `live`: Users can directly edit the space

        * `locked`: All edits are locked for this space.

        '
      enum:
      - live
      - locked
    SiteSocialAccountHandle:
      description: A handle on a social platform, without prefixes like the @ symbol.
      type: string
      minLength: 1
      maxLength: 128
    DocumentInlineLink:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - link
        key:
          type: string
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentText'
            - $ref: '#/components/schemas/DocumentInlineImage'
            - $ref: '#/components/schemas/DocumentInlineMath'
            - $ref: '#/components/schemas/DocumentInlineExpression'
            - $ref: '#/components/schemas/DocumentInlineMention'
        data:
          type: object
          properties:
