    SiteChangeRequest:
      type: object
      description: A change request reviewing a site as a whole. It groups every proposed change — the site's structure and its content — into one review, one lifecycle and one merge decision.
      properties:
        object:
          type: string
          enum:
          - site-change-request
        id:
          type: string
          description: Unique identifier for the change request
        organization:
          type: string
          description: ID of the organization owning the change request.
        site:
          type: string
          description: ID of the site reviewed by the change request.
        number:
          type: number
          description: Incremental identifier of the change request within the site.
        version:
          type: number
          description: Identity of the complete set of member states currently exposed. It increments once per completed update, so a review can detect that it applies to outdated content.
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        subject:
          $ref: '#/components/schemas/ChangeRequestSubject'
        description:
          $ref: '#/components/schemas/JSONDocument'
        links:
          $ref: '#/components/schemas/ChangeRequestLinks'
        content:
          type: array
          description: Spaces whose content the change request changes, one entry per space. Empty when it only changes the site itself.
          items:
            $ref: '#/components/schemas/SiteChangeRequestContentMember'
        structure:
          $ref: '#/components/schemas/SiteChangeRequestStructureMember'
          description: Only present when the change request changes the site structure.
        customization:
          $ref: '#/components/schemas/SiteChangeRequestCustomizationMember'
          description: Only present when the change request changes the site customization settings.
        comments:
          type: number
          description: Count of opened comments across all members of the change request.
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        mergedBy:
          $ref: '#/components/schemas/User'
          description: User who merged the change request. Only present when it has been merged.
        mergedAt:
          $ref: '#/components/schemas/Timestamp'
          description: Date at which the change request was merged. Only present when it has been merged.
        urls:
          type: object
          description: URLs associated with the object
          properties:
            app:
              type: string
              description: URL of the change request in the application
              format: uri
            location:
              type: string
              description: URL of the change request in the API
              format: uri
          required:
          - app
          - location
      required:
      - object
      - id
      - organization
      - site
      - number
      - version
      - status
      - subject
      - content
      - comments
      - createdBy
      - createdAt
      - updatedAt
      - urls
