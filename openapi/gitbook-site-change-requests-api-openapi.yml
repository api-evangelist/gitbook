              $ref: '#/components/schemas/ContentRef'
          required:
          - ref
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - nodes
      - data
    CustomizationContentLinkTitle:
      type: string
      maxLength: 64
    DocumentInlineButton:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - button
        key:
          type: string
        data:
          allOf:
          - type: object
            properties:
              label:
                type: string
              kind:
                type: string
                enum:
