openapi: 3.2.0
info:
  title: GitBook Site Change Requests API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-change-requests
  x-page-icon: code-pull-request
  x-page-title: Site change requests
  x-page-description: Review and collaborate on proposed changes to a site before merging.
  x-parent: sites
  description: 'A site change request groups changes to a site''s structure and to the content of any number of its spaces into one review, with a single lifecycle and a single merge decision.


    {% openapi-schemas spec="gitbook" schemas="SiteChangeRequest" grouped="false" %}

    The SiteChangeRequest object

    {% endopenapi-schemas %}'
paths:
  /orgs/{organizationId}/sites/{siteId}/change-requests:
    get:
      operationId: listChangeRequestsForSite
      summary: List all change requests for a site
      description: Returns a paginated list of change requests reviewing the site. A site change request groups changes to the site structure and to any number of its spaces into one review. Use this to discover existing change requests before creating a new one.
      x-internal: true
      tags:
      - site-change-requests
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestStatus'
          default: open
        description: If defined, only change requests matching this status will be returned.
      - name: createdBy
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests created by this user will be returned.
      - name: openedBy
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests moved out of draft by this user will be returned.
      - name: archivedBy
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests archived by this user will be returned.
      - name: mergedBy
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests merged by this user will be returned.
      - name: contributor
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests with contributions from this user will be returned.
      - name: memberStatus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SiteChangeRequestMemberStatus'
          default: active
        description: Status of the members.
      - name: orderBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestOrderBy'
      responses:
        '200':
          description: List of the site's change requests
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteChangeRequest'
    post:
      operationId: createSiteChangeRequest
      summary: Create a new change request in a site
      description: 'Creates a change request reviewing the site, as a draft working copy of the content of the spaces it changes. It starts with no members: a space becomes one on its first edit.'
      x-internal: true
      tags:
      - site-change-requests
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/ChangeRequestSubject'
                description:
                  $ref: '#/components/schemas/JSONDocument'
      responses:
        '201':
          description: The change request has been created
          headers:
            Location:
              description: API URL for the newly created change request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteChangeRequest'
  /orgs/{organizationId}/sites/{siteId}/change-requests/{changeRequestId}:
    get:
      operationId: getSiteChangeRequestById
      summary: Get a site change request by its ID
      description: Retrieves a single site change request, including its status, subject, description, aggregate version and active members. Use this to check its current state before deciding to merge, update or request a review.
      x-internal: true
      tags:
      - site-change-requests
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteChangeRequestId'
      responses:
        '200':
          description: The matching change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteChangeRequest'
        '404':
          description: The change request could not be found.
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateSiteChangeRequestById
      summary: Update a site change request's subject, description, or status
      description: Updates the metadata of a site change request. Use this to rename it, add context before requesting a review, or change its workflow status without merging. To change the resources it reviews, update its members instead.
      x-internal: true
      tags:
      - site-change-requests
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteChangeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                subject:
                  $ref: '#/components/schemas/ChangeRequestSubject'
                description:
                  $ref: '#/components/schemas/JSONDocument'
                status:
                  type: string
                  enum:
                  - draft
                  - open
                  - archived
      responses:
        '200':
          description: The change request has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteChangeRequest'
        '404':
          description: The change request could not be found.
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: The change request has been merged and can no longer be changed.
          $ref: '#/components/responses/ConflictError'
    delete:
      operationId: deleteSiteChangeRequestById
      summary: Delete a site change request
      description: Permanently deletes a change request and its members. Merged change requests cannot be deleted; archive a change request instead to keep its review history.
      x-internal: true
      tags:
      - site-change-requests
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteChangeRequestId'
      responses:
        '204':
          description: The change request did not exist
        '205':
          description: The change request has been deleted
        '409':
          description: The change request has been merged and cannot be deleted.
          $ref: '#/components/responses/ConflictError'
components:
  schemas:
    CustomizationAnnouncement:
      type: object
      properties:
        enabled:
          description: Whether to show the site's announcement.
          type: boolean
        message:
          $ref: '#/components/schemas/CustomizationAnnouncementMessage'
        localizedMessage:
          description: Localized overrides for the announcement message, keyed by locale.
          $ref: '#/components/schemas/LocalizedString128'
        link:
          description: The content or URL the announcement links to when clicked.
          $ref: '#/components/schemas/CustomizationContentLink'
        style:
          description: The style of the announcement. Used to style the banner with the right semantic color and enable/disable features like hiding the banner.
          type: string
          enum:
          - info
          - warning
          - danger
          - success
      required:
      - enabled
      - message
      - style
    CustomizationSidebarBackgroundStyle:
      type: string
      description: '- `default`: No background, content sits directly against sidebar edge.

        - `filled`: Muted background color that extends to sidebar edges.

        '
      enum:
      - default
      - filled
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    CustomizationThemedColor:
      type: object
      properties:
        light:
          $ref: '#/components/schemas/Color'
        dark:
          $ref: '#/components/schemas/Color'
      required:
      - light
      - dark
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CustomizationCorners:
      type: string
      enum:
      - straight
      - rounded
      - circular
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    CustomizationThemedURL:
      type: object
      properties:
        light:
          $ref: '#/components/schemas/URL'
        dark:
          $ref: '#/components/schemas/URL'
      required:
      - light
      - dark
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    CustomizationLinksStyle:
      type: string
      description: 'The style used for regular links in the main content, header and footer. Sidebar items are styled separately.

        - `default`: Links are colored in the primary color and feature an underline in the same color.

        - `accent`: Links are colored the same as body text and feature an underline in the primary color.

        '
      enum:
      - default
      - accent
    CustomizationFontDefinitionInput:
      type: object
      description: Defines a font family along with its various font-face declarations for use in CSS '@font-face' rules.
      properties:
        id:
          type: string
          description: A globally unique identifier for the font definition.
        custom:
          type: boolean
          description: Whether the font is a custom font. If false, this font is provided by GitBook.
        fontFamily:
          $ref: '#/components/schemas/FontFamily'
        fontFaces:
          type: array
          description: A list of font-face definitions, specifying variations such as weight and style.
          items:
            $ref: '#/components/schemas/FontFace'
          minItems: 1
      required:
      - id
      - custom
      - fontFamily
      - fontFaces
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentFragment:
      type: object
      properties:
        object:
          type: string
          enum:
          - fragment
        key:
          type: string
        fragment:
          type: string
        type:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlock'
      required:
      - object
      - nodes
    CustomizationTheme:
      type: string
      description: 'The theme to apply to the site. Supercedes the old header preset themes.

        - `clean`: Modern theme featuring translucency and minimally-styled elements.

        - `muted`: Sophisticated theme with decreased contrast between elements.

        - `bold`: High-impact theme with prominent colors and strong contrasts.

        - `gradient`: Trendy theme featuring colorful gradients and splashes of color.

        '
      enum:
      - clean
      - muted
      - bold
      - gradient
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    LocalizedString256:
      type: object
      description: Localized string value with a 256 character limit, keyed by locale. Contains overrides for non-default languages only.
      additionalProperties:
        type: string
        maxLength: 256
      propertyNames:
        $ref: '#/components/schemas/TranslationLanguage'
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    SiteChangeRequestMemberStatus:
      type: string
      description: Whether the member is part of the change request, or a tombstone kept so that a member removed and later re-added keeps its identity, comments and history.
      enum:
      - active
      - removed
    SiteStructure:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - sections
          structure:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/SiteSection'
              - $ref: '#/components/schemas/SiteSectionGroup'
              - $ref: '#/components/schemas/SiteExternalLink'
        required:
        - type
        - structure
      - type: object
        properties:
          type:
            type: string
            enum:
            - siteSpaces
          structure:
            type: array
            items:
              $ref: '#/components/schemas/SiteSpace'
        required:
        - type
        - structure
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    SiteTitle:
      type: string
      description: Title of the site
      minLength: 2
      maxLength: 128
    SiteSectionGroupTitle:
      type: string
      description: Title of the site section group
      minLength: 1
      maxLength: 100
    LocalizedString:
      type: object
      description: Localized string value, keyed by locale. Contains overrides for non-default languages only.
      propertyNames:
        $ref: '#/components/schemas/TranslationLanguage'
      additionalProperties:
        type: string
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    SiteSectionGroup:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-section-group"
          enum:
          - site-section-group
        id:
          type: string
          description: Unique identifier of the site section group
        title:
          $ref: '#/components/schemas/SiteSectionGroupTitle'
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        sections:
          type: array
          deprecated: true
          description: List of site section ids that are members of the group. Use `children` instead.
          items:
            $ref: '#/components/schemas/SiteSection'
        sectionGroup:
          type: string
          description: ID of the parent section group this group belongs to
        draft:
          type: boolean
          description: Whether the site section group is draft and not live.
        children:
          type: array
          description: List of all child sections, groups, and external links nested under this group
          items:
            oneOf:
            - $ref: '#/components/schemas/SiteSection'
            - $ref: '#/components/schemas/SiteSectionGroup'
            - $ref: '#/components/schemas/SiteExternalLink'
        icon:
          $ref: '#/components/schemas/Icon'
      required:
      - object
      - id
      - title
      - draft
      - sections
      - children
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CustomizationPageActionType:
      type: string
      description: Type of a built-in page action that can be displayed in the page actions menu of a published page.
      enum:
      - assistant
      - external-ai
      - markdown
      - mcp
      - git
      - pdf
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    MergeRulesSpaceConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationInherit'
      - $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
    GitSyncOperationErrorAction:
      type: object
      description: An action the user can take to resolve a failed Git Sync operation.
      properties:
        label:
          type: string
          description: Label for the action.
