openapi: 3.2.0
info:
  title: GitBook Site AI API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-ai
  x-page-title: Site AI
  x-page-description: Build conversational AI agents for your docs site.
  x-parent: sites
  description: Build advanced conversational AI experiences within your docs site that go beyond basic Q&A.
paths:
  /orgs/{organizationId}/sites/{siteId}/ai/response:
    post:
      operationId: streamAIResponseInSite
      summary: Generate an AI response in a site
      description: Generate an AI response in a conversation.
      tags:
      - site-ai
      security:
      - user: []
      - oauth:
        - site:ask
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                previousResponseId:
                  type: string
                  description: The ID of the previous response to continue from
                input:
                  type: array
                  description: The messages to send to the AI agent.
                  items:
                    $ref: '#/components/schemas/AIMessageInput'
                model:
                  $ref: '#/components/schemas/AIModel'
                tools:
                  type: array
                  description: Custom tools to provide to the AI agent.
                  items:
                    $ref: '#/components/schemas/AIToolDefinition'
                toolCall:
                  $ref: '#/components/schemas/AIToolCallResult'
                session:
                  $ref: '#/components/schemas/SiteInsightsSession'
                channel:
                  type: object
                  description: The channel from which the question was asked, if applicable.
                  required:
                  - type
                  properties:
                    type:
                      $ref: '#/components/schemas/SiteCoreChannelType'
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AIStreamResponse'
components:
  schemas:
    AIToolCallCheckContentImport:
      type: object
      properties:
        tool:
          type: string
          enum:
          - checkContentImport
        runId:
          type: string
          description: The ID of the import run.
        status:
          type: string
          description: Status of the import when it was checked.
          enum:
          - pending
          - in-progress
          - completed
          - failed
          - cancelled
        importedPages:
          type: number
          description: Number of pages imported when the import was checked.
        totalPages:
          type: number
          description: Number of pages the import has discovered so far.
      required:
      - tool
      - runId
      - status
      - importedPages
      - totalPages
    AIToolCallSearchResultPage:
      type: object
      title: Page result
      description: Result of a search matching a page.
      properties:
        type:
          type: string
          enum:
          - page
        spaceId:
          type: string
          description: The ID of the space
        pageId:
          type: string
          description: The ID of the page
        revisionId:
          type: string
          description: The revision ID of the result
        path:
          type: string
          description: The path of the page within its space, as the published site serves it.
        anchor:
          type: string
          description: The anchor of the result
        title:
          type: string
          description: The title of the result
        description:
          type: string
          description: The description of the result
      required:
      - type
      - spaceId
      - pageId
      - revisionId
      - title
    AIToolCallStartContentImport:
      type: object
      properties:
        tool:
          type: string
          enum:
          - startContentImport
        spaceId:
          type: string
          description: The ID of the space the content is imported into.
        changeRequestId:
          type: string
          description: The ID of the change request the content is imported into.
        runId:
          type: string
          description: The ID of the import run.
        url:
          type: string
          description: The URL the content is imported from, when importing a website.
        files:
          type: array
          description: Names of the attached files the content is imported from, when importing files.
          items:
            type: string
      required:
      - tool
      - spaceId
      - changeRequestId
      - runId
    AIStreamResponseStart:
      type: object
      description: 'Message emitted by the server to indicate the start of the AI response.

        '
      properties:
        type:
          type: string
          enum:
          - response_start
        messageId:
          type: string
          description: 'The ID of the message that this event is composing.

            '
        task:
          $ref: '#/components/schemas/AIMessageTask'
      required:
      - type
      - messageId
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    AIMessageInput:
      type: object
      description: Input version of an AI message.
      properties:
        role:
          $ref: '#/components/schemas/AIMessageRole'
        content:
          oneOf:
          - type: string
            maxLength: 2048
          - $ref: '#/components/schemas/JSONDocument'
        context:
          $ref: '#/components/schemas/AIMessageContext'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AIAttachment'
      required:
      - role
      - content
    AIStreamResponseToolCall:
      type: object
      description: 'Message emitted by the server to indicate that the AI has called a tool.

        '
      properties:
        type:
          type: string
          enum:
          - response_tool_call
        messageId:
          type: string
          description: 'The ID of the message that this event is composing.

            '
        stepIndex:
          type: integer
          description: 'The index of the step of the message that this event is composing.

            '
        toolCall:
          $ref: '#/components/schemas/AIToolCall'
      required:
      - type
      - messageId
      - stepIndex
      - toolCall
    AIToolCallArchiveChangeRequest:
      type: object
      properties:
        tool:
          type: string
          enum:
          - archiveChangeRequest
        spaceId:
          type: string
          description: The ID of the space the change request belongs to.
        changeRequestId:
          type: string
          description: The ID of the change request.
        reason:
          type: string
          description: Why the agent gave up on implementing the change request.
      required:
      - tool
      - spaceId
      - changeRequestId
      - reason
    AIToolCallResult:
      type: object
      description: Result of a tool call.
      required:
      - tool
      - toolCallId
      - output
      properties:
        tool:
          type: string
          description: The name of the tool that was called.
        toolCallId:
          type: string
          description: The ID of the tool call.
        output:
          type: object
          description: The output to the tool call.
        summary:
          $ref: '#/components/schemas/AIToolCallOtherSummary'
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    AIMessageStepPhase:
      type: string
      description: The phase of a step in a message from the AI agent.
      enum:
      - commentary
      - final_answer
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    AIToolCallRenamePage:
      type: object
      properties:
        tool:
          type: string
          enum:
          - renamePage
        spaceId:
          type: string
          description: The ID of the space being edited.
        baseRevisionId:
          type: string
          description: The base revision ID used to compare the page rename in the current conversation.
        page:
          $ref: '#/components/schemas/ChangedRevisionPage'
        changeRequestId:
          type: string
          description: 'The ID of the change request the edit was made in. Absent when the space itself was edited, through its unlocked live edits.

            '
        title:
          type: string
          description: The new title of the page.
      required:
      - tool
      - spaceId
      - baseRevisionId
      - page
      - title
    AIToolCallSetChangeRequestDetails:
      type: object
      properties:
        tool:
          type: string
          enum:
          - setChangeRequestDetails
        spaceId:
          type: string
          description: The ID of the space the change request belongs to.
        changeRequestId:
          type: string
          description: The ID of the change request.
      required:
      - tool
      - spaceId
      - changeRequestId
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    AIToolCallGetReusableContents:
      type: object
      properties:
        tool:
          type: string
          enum:
          - getReusableContents
        spaceId:
          type: string
          description: The ID of the space being accessed.
        revisionId:
          type: string
          description: The revision ID of the space.
      required:
      - tool
      - spaceId
      - revisionId
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    AIStreamResponseDocument:
      type: object
      description: 'Message emitted by the server to indicate the latest block of the document. The block can either be a new block or an update to the previous block.

        '
      properties:
        type:
          type: string
          enum:
          - response_document
          - response_reasoning
        messageId:
          type: string
          description: 'The ID of the message that this event is composing.

            '
        stepIndex:
          type: integer
          description: 'The index of the step of the message that this event is composing.

            '
        operation:
          type: string
          enum:
          - insert
          - update
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
      required:
      - type
      - messageId
      - stepIndex
      - operation
      - blocks
    URL:
      type: string
      format: uri
      maxLength: 2048
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockListItem'
      - $ref: '#/components/schemas/DocumentBlockDivider'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockImage'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockCodeLine'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTabsItem'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockStepperStep'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockColumn'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
      - $ref: '#/components/schemas/DocumentBlockUpdate'
    DocumentInlineAnnotation:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - annotation
        key:
          type: string
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - annotation-body
                nodes:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/DocumentBlocksEssentials'
                    - $ref: '#/components/schemas/DocumentBlockCode'
                  minItems: 1
              required:
              - nodes
              - type
        isVoid:
          type: boolean
          enum:
          - false
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentText'
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - fragments
      - isVoid
      - nodes
    AIToolCallSearchResultRecord:
      type: object
      title: Site context record result
      description: Result of a search matching a site context record.
      properties:
        type:
          type: string
          enum:
          - record
        siteId:
          type: string
          description: The ID of the site owning the context record
        recordId:
          type: string
          description: The ID of the context record
        title:
          type: string
          description: The title of the record
        description:
          type: string
          description: The description of the record
        url:
          type: string
          format: uri
          description: URL of the record in its original source
      required:
      - type
      - siteId
      - recordId
      - title
    DocumentBlocksTopLevels:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlocksEssentials'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
    DocumentBlockEmbed:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - embed
        key:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
            fullWidth:
              type: boolean
          required:
          - url
        fragments:
          type: array
          items:
            allOf:
