openapi: 3.2.0
info:
  title: GitBook Site Section Groups API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-section-groups
  x-page-title: Site section groups
  x-page-description: Group and manage sections of your docs for easier organization.
  x-parent: sites
  description: 'Section groups let you bundle multiple top-level sections together, offering additional structuring capabilities and simplifying navigation for your readers.


    {% openapi-schemas spec="gitbook" schemas="SiteSectionGroup" grouped="false" %}

    The SiteSectionGroup object

    {% endopenapi-schemas %}'
paths:
  /orgs/{organizationId}/sites/{siteId}/section-groups:
    get:
      operationId: listSiteSectionGroups
      summary: List all section groups in a site's navigation structure
      description: Returns a paginated list of section groups for the site. Section groups are containers that organize multiple sections into a hierarchical navigation structure. Use this to inspect the current grouping before adding, updating, or reordering items in the site structure.
      x-gitbook-mcp: true
      tags:
      - site-section-groups
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteSectionGroup'
    post:
      operationId: addSectionGroupToSite
      summary: Add a section group to a site's navigation structure
      description: Creates a new section group to organize multiple sections under a shared navigation label. Section groups can be nested by providing a parent group ID. Existing sections can be assigned to the group at creation time via their IDs. Create the group in draft mode to stage it before publishing.
      x-gitbook-mcp:
        destructive: true
      tags:
      - site-section-groups
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/SiteSectionGroupTitle'
                icon:
                  oneOf:
                  - $ref: '#/components/schemas/Icon'
                  - type: 'null'
                sections:
                  type: array
                  items:
                    type: string
                  description: IDs of the sections to be added to the section group
                parent:
                  type: string
                  description: ID of the parent section group to nest this group under. If not provided, the section group will be added at the root of the site.
                draft:
                  type: boolean
                  description: Whether the section group should be created in draft mode.
              required:
              - title
      responses:
        '201':
          description: Section group added to the site
          headers:
            Location:
              description: API URL for the newly created site-section-group relationship
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SiteSectionGroup'
                - type: object
                  properties:
                    subscriptionNotice:
                      $ref: '#/components/schemas/SubscriptionNotice'
  /orgs/{organizationId}/sites/{siteId}/section-groups/{siteSectionGroupId}:
    patch:
      operationId: updateSiteSectionGroupById
      summary: Update a section group in a site's navigation structure
      description: Updates a section group's properties in the site's navigation structure.
      x-gitbook-mcp: true
      x-gitbook-return-preference: true
      tags:
      - site-section-groups
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionGroupId'
      - $ref: '#/components/parameters/returnPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/SiteSectionGroupTitle'
                localizedTitle:
                  $ref: '#/components/schemas/LocalizedString128'
                icon:
                  oneOf:
                  - $ref: '#/components/schemas/Icon'
                  - type: 'null'
                draft:
                  type: boolean
                  description: Whether the site section group should be kept in draft mode. Setting it to true makes the site section group draft. Setting it to false makes the site section group live.
                parentSectionGroupId:
                  description: ID of the parent section group to move this section group into. Set to null to move the section group to the root of the site.
                  oneOf:
                  - type: string
                  - type: 'null'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSectionGroup'
        '204':
          description: Site section group updated without returning its representation
          headers:
            Preference-Applied:
              $ref: '#/components/headers/returnPreferenceApplied'
    delete:
      operationId: deleteSiteSectionGroupById
      summary: Delete a site section group
      tags:
      - site-section-groups
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionGroupId'
      responses:
        '204':
          description: Site section group did not exist
        '205':
          description: Site section group has been deleted
  /orgs/{organizationId}/sites/{siteId}/section-groups/{siteSectionGroupId}/move:
    post:
      operationId: moveSiteSectionGroup
      deprecated: true
      summary: Move a site section group to a new position.
      tags:
      - site-section-groups
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionGroupId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  description: The position where to move the site section group. When not provided the site section group is moved at the end of the site.
                  $ref: '#/components/schemas/SiteSectionGroupMovePosition'
      responses:
        '200':
          description: Site section group moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSectionGroup'
        '400':
          description: Invalid move site section group position provided
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: No matching site section group found
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    GitSyncOperationDirection:
      type: string
      enum:
      - export
      - import
    SiteSectionDescription:
      type: string
      description: Description of the site section
      minLength: 0
      maxLength: 256
    MemberRoleOrGuest:
      description: The role of a member in an organization, null for guests
      oneOf:
      - $ref: '#/components/schemas/MemberRole'
      - type: 'null'
    BillingTrialStatus:
      type: string
      description: '- notapplicable, no trial can be started for this organization. - none, no trial has been started yet. - active, trial is active. - ended, the trial has ended and the user has choosen to stay on the free plan or has upgraded to a paid plan. - expired, the trial has ended but the user hasn''t deciced yet what to do.

        '
      enum:
      - notapplicable
      - none
      - active
      - ended
      - expired
    DefaultLevel:
      description: Default level for a piece of content
      oneOf:
      - $ref: '#/components/schemas/MemberRoleOrGuest'
      - type: string
        enum:
        - inherit
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    MergeRulesConfigurationInherit:
      type: object
      description: The merge rules inherits from the organization configuration.
      properties:
        type:
          type: string
          enum:
          - inherit
      required:
      - type
    SiteSectionGroupPointer:
      type: object
      properties:
        type:
          type: string
          enum:
          - site-section
          - site-section-group
        id:
          type: string
          description: Unique identifier for the site section
      required:
      - type
      - id
    SiteSection:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-section"
          enum:
          - site-section
        id:
          type: string
          description: Unique identifier of the site section
        title:
          $ref: '#/components/schemas/SiteSectionTitle'
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        description:
          $ref: '#/components/schemas/SiteSectionDescription'
        localizedDescription:
          $ref: '#/components/schemas/LocalizedString256'
        default:
          type: boolean
          description: Whether this is the default section for the site
        draft:
          type: boolean
          description: Whether the site section is draft and not live.
        path:
          $ref: '#/components/schemas/SiteSectionPath'
        condition:
          description: Conditional expression used to evaluate whether the site section should be shown to the site's visitor.
          $ref: '#/components/schemas/Expression'
        sectionGroup:
          type: string
          description: ID of the section group the section belongs to in the site
        siteSpaces:
          type: array
          items:
            $ref: '#/components/schemas/SiteSpace'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            published:
              type: string
              description: URL of the published version of the site section. Only defined when site is published.
              format: uri
        icon:
          $ref: '#/components/schemas/Icon'
      required:
      - object
      - id
      - title
      - path
      - draft
      - siteSpaces
      - urls
    PreviousGitSyncState:
      type: object
      description: What is still known about a target's Git Sync after its installation was removed. Never returned alongside `gitSync`, which describes a live installation.
      required:
      - url
      properties:
        url:
          type: string
          description: The URL to the directory of the repository tree the content synced with before its Git Sync installation was removed, at the branch it synced.
    SiteSectionTitle:
      type: string
      description: Title of the site section
      minLength: 2
      maxLength: 128
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    MergeRule:
      oneOf:
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_one_of_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - allow_bypass
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_at_least_one_review
            - require_at_least_one_approved_review
            - require_all_reviews_approved
            - require_agent_review
            - require_up_to_date_change_request
            - require_change_request_subject
            - require_change_request_description
            - require_author_to_merge
        required:
        - rule
      - type: object
        description: The merge rule is written in the advanced custom expression syntax.
        properties:
          rule:
            type: string
            enum:
            - custom
          expression:
            $ref: '#/components/schemas/Expression'
          message:
            type: string
            description: Optional message to display when the expression evaluates to false.
        required:
        - rule
        - expression
    Icon:
      type: string
      maxLength: 50
      format: icon
      description: Name of the icon
      example: gear
    SiteSpacePath:
      type: string
      description: Path to the space on the site
      minLength: 1
      maxLength: 100
    LocalizedString256:
      type: object
      description: Localized string value with a 256 character limit, keyed by locale. Contains overrides for non-default languages only.
      additionalProperties:
        type: string
        maxLength: 256
      propertyNames:
        $ref: '#/components/schemas/TranslationLanguage'
    MemberRole:
      type: string
      description: '"The role of a member in an organization.

        "admin": Can administrate the content: create, delete spaces, ...

        "create": Can create content.

        "review": Can review content.

        "edit": Can edit the content (live or change requests).

        "comment": Can access the content and its discussions.

        "read": Can access the content, but cannot update it in any way.

        '
      enum:
      - admin
      - create
      - edit
      - review
      - comment
      - read
    SubscriptionTrial:
      type: object
      description: The current or last trial of an organization.
      properties:
        status:
          $ref: '#/components/schemas/BillingTrialStatus'
        endDate:
          description: When the trial ends, or ended.
          $ref: '#/components/schemas/Timestamp'
        daysRemaining:
          type: integer
          description: Days left in the trial, rounded up, so 1 is its last day. 0 once it has ended.
      required:
      - status
      - endDate
      - daysRemaining
    Space:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "space"
          enum:
          - space
        id:
          type: string
          description: Unique identifier for the space
        title:
          $ref: '#/components/schemas/SpaceTitle'
        emoji:
          description: An emoji for this space. It'll match the emoji shown in the GitBook app.
          $ref: '#/components/schemas/Emoji'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        editMode:
          $ref: '#/components/schemas/SpaceEditMode'
        type:
          type: string
          description: Kind of space. Only set to `styleguide` for spaces holding a team's writing style guide; omitted for regular spaces.
          enum:
          - styleguide
        mergeRules:
          $ref: '#/components/schemas/MergeRulesSpaceConfiguration'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the space in the API
              format: uri
            app:
              type: string
              description: URL of the space in the application
              format: uri
            published:
              type: string
              description: URL of the published version of the space. Only defined when visibility is not "private."
              format: uri
            public:
              type: string
              description: URL of the public version of the space. Only defined when visibility is "public".
              format: uri
            icon:
              description: URL of the icon of this space, if defined.
              $ref: '#/components/schemas/URL'
          required:
          - app
          - location
        organization:
          type: string
          description: ID of the organization owning this space
        parent:
          type: string
          description: ID of the parent collection.
        language:
          $ref: '#/components/schemas/TranslationLanguage'
        gitSync:
          $ref: '#/components/schemas/GitSyncState'
        previousGitSync:
          $ref: '#/components/schemas/PreviousGitSyncState'
        imports:
          description: 'Import runs targeting this space, still running or ended recently, most recent first. Only returned when fetching a single space.

            '
          type: array
          items:
            $ref: '#/components/schemas/ContentImportRun'
        visitorAuth:
          $ref: '#/components/schemas/VisitorAuth'
        revision:
          type: string
          description: ID of the active revision in the space.
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        comments:
          type: number
          description: Count of opened comments on the space.
        changeRequests:
          type: number
          description: Total count of change requests on the space.
        changeRequestsOpen:
          type: number
          description: Count of open change requests on the space.
        changeRequestsDraft:
          type: number
          description: Count of draft change requests on the space.
        internal_poweredByV2:
          type: boolean
          description: Whether the space is powered by V2 of the content system.
        internal_singleWebsocket:
          type: boolean
          description: Whether the space uses a single websocket connection for all real-time communication.
        permissions:
          type: object
          description: The set of permissions for the space
          properties:
            view:
              type: boolean
              description: Can the user view the space content.
            access:
              type: boolean
              description: Can the user access the space in the application.
            admin:
              type: boolean
              description: Can the user edit the title, install integrations, and manage the space.
            viewInviteLinks:
              type: boolean
              description: Can the user view the invite links of the space.
            edit:
              type: boolean
              description: Can the user edit the content of the space by creating a change request.
            triggerGitSync:
              type: boolean
              description: Can the user trigger a git sync.
            comment:
              type: boolean
              description: Can the user comment on the content.
            merge:
              type: boolean
              description: Can the user merge change requests.
            review:
              type: boolean
              description: Can the user review change requests.
            installIntegration:
              type: boolean
              description: Can the user install integrations in the space.
          required:
          - view
          - access
          - admin
          - viewInviteLinks
          - edit
          - triggerGitSync
          - comment
          - merge
          - review
          - installIntegration
      required:
      - object
      - id
      - title
      - emoji
      - organization
      - visibility
      - revision
      - createdAt
      - updatedAt
      - comments
      - changeRequests
      - changeRequestsOpen
      - changeRequestsDraft
      - mergeRules
      - urls
      - defaultLevel
      - permissions
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    VisitorAuthCustomBackend:
      type: object
      title: Custom backend for authenticated access
      properties:
        backend:
          type: string
          description: Custom backend for authenticated access
          enum:
          - custom
      required:
      - backend
    ContentImportRun:
      type: object
      properties:
        object:
          description: Type of Object, always equals to "import-run"
          type: string
          enum:
          - import-run
        id:
          description: Unique ID of the import
          type: string
        startedAt:
          description: Date when the import has started
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          description: Filled when the imported is in status "completed"
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: Date when the import was requested
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          description: Date when the import was last updated
          $ref: '#/components/schemas/Timestamp'
        status:
          description: Status of the import
          type: string
          enum:
          - pending
          - in-progress
          - completed
          - failed
          - cancelled
        reason:
          description: Reason for the import failure when `status` is `failed`.
          type: string
        source:
          description: Where the content is imported from.
          $ref: '#/components/schemas/ContentImportSource'
        target:
          description: Where the content is imported into.
          $ref: '#/components/schemas/ContentImportTarget'
        site:
          description: ID of the site the target space belongs to, when it belongs to exactly one.
          type: string
        createdBy:
          description: ID of the user who started the import.
          type: string
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              description: URL of the import run in the API
              type: string
              format: uri
          required:
          - location
        pages:
          description: Pages included in the import
          type: array
          items:
            type: object
            properties:
              id:
                description: ID of page
                type: string
              sourceURL:
                description: Source URL where the page has been imported from
                type: string
              type:
                description: Type of page
                type: string
                enum:
                - page
                - folder
              status:
                description: Status of the page
                type: string
                enum:
                - complete
                - pending
            required:
            - id
            - type
            - status
      required:
      - id
      - status
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    SiteSectionGroupMovePosition:
      type: object
      description: Position at which to move the site section group.
      properties:
        before:
          $ref: '#/components/schemas/SiteSectionGroupPointer'
        after:
          $ref: '#/components/schemas/SiteSectionGroupPointer'
    GitSyncProvider:
      type: string
      description: The provider of the Git Sync installation.
      enum:
      - github
      - gitlab
      - github-legacy
    MergeRulesStandaloneConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationRules'
      - $ref: '#/components/schemas/MergeRulesConfigurationNone'
    SiteSectionGroupTitle:
      type: string
      description: Title of the site section group
      minLength: 1
      maxLength: 100
    Timestamp:
      type: string
      format: date-time
    SubscriptionNotice:
      type: object
      description: 'A notice about the organization''s subscription to relay to the user, such as how many days are left in their trial. It is returned by the operations whose features may require a paid plan once a trial ends.

        '
      properties:
        type:
          type: string
          description: '- trial_started, the operation started the organization''s trial. - trial_countdown, the organization''s trial ends soon. - checkout_required, the operation needs a paid plan to complete.

            '
          enum:
          - trial_started
          - trial_countdown
          - checkout_required
        context:
          type: string
          description: What the user was doing when the notice was given.
          enum:
          - trial_started
          - site_publishing
          - site_features
          - site_customization
        commercialStatus:
          type: string
          description: Whether the organization is on a trial, the free plan, or a paid plan.
          enum:
          - trial
          - free
          - paid
        message:
          type: string
          description: Message to show the user. For users who cannot upgrade, it asks them to reach out to an administrator of the organization.
        trial:
          $ref: '#/components/schemas/SubscriptionTrial'
        canManageBilling:
          type: boolean
          description: Whether the user is an administrator of the organization, and so can upgrade. Otherwise, they have to ask an administrator to upgrade.
        upgradeUrl:
          description: Where to upgrade in the application. Only set when `canManageBilling` is true.
          $ref: '#/components/schemas/URL'
        pricingUrl:
          description: Public page comparing the GitBook plans.
          $ref: '#/components/schemas/URL'
      required:
      - type
      - context
      - commercialStatus
      - message
      - canManageBilling
      - pricingUrl
    SiteSectionPath:
      type: string
      description: Path to the section on the site
      minLength: 1
      maxLength: 100
    EntityId:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: A unique entity identifier
    SiteSectionGroup:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-section-group"
          enum:
          - site-section-group
        id:
          type: string
          description: Unique identifier of the site section group
        title:
          $ref: '#/components/schemas/SiteSectionGroupTitle'
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        sections:
          type: array
          deprecated: true
          description: List of site section ids that are members of the group. Use `children` instead.
          items:
            $ref: '#/components/schemas/SiteSection'
        sectionGroup:
          type: string
          description: ID of the parent section group this group belongs to
        draft:
          type: boolean
          description: Whether the site section group is draft and not live.
        children:
          type: array
          description: List of all child sections, groups, and external links nested under this group
          items:
            oneOf:
            - $ref: '#/components/schemas/SiteSection'
            - $ref: '#/components/schemas/SiteSectionGroup'
            - $ref: '#/components/schemas/SiteExternalLink'
        icon:
          $ref: '#/components/schemas/Icon'
      required:
      - object
      - id
      - title
      - draft
      - sections
      - children
    Emoji:
      type: string
      maxLength: 50
      format: emoji
      description: Unicode codepoint or character of the emoji
      example: 🎉
    ContentImportSource:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - website
          url:
            $ref: '#/components/schemas/URL'
        required:
        - type
        - url
      - type: object
        properties:
          type:
            type: string
            enum:
            - file
          files:
            description: Files to import
            type: array
            maxItems: 50
            items:
              description: Key of file
              type: string
        required:
        - type
        - files
    ContentVisibility:
      type: string
      description: "* `public`: Anyone can access the content, and the content is indexed by search engines.\n* `unlisted`: Anyone can access the content, and the content is not indexed by search engines\n* `share-link`: Anyone with a secret token in the url can access the content.\n* `visitor-auth`: Anyone authenticated through a JWT token can access the content.\n* `in-collection`: Anyone who can access the parent collection can access the content.\n  Only available for spaces in a collection.\n* `private`: Authorized members can access the content.\n"
      enum:
      - public
      - unlisted
      - share-link
      - visitor-auth
      - in-collection
      - private
    GitSyncState:
      type: object
      properties:
        repoName:
          type: string
          description: Repository name.
        installationStatus:
          $ref: '#/components/schemas/GitSyncInstallationStatus'
        installationProvider:
          $ref: '#/components/schemas/GitSyncProvider'
        integration:
          type: string
          deprecated: true
          description: The integration name providing the Git Sync.
        installationId:
          type: string
          description: The ID of the Git Sync installation.
        parentInstallationId:
          type: string
          description: The ID of the parent Git Sync installation, if any.
        url:
          type: string
          description: The URL to the repository tree, used when rendering public content.
        installationProjectDirectory:
          type: string
          description: Directory in the repository this content syncs from, resolved against the parent installation when the installation is managed by a site. Absent when the content syncs from the root of the repository.
        operation:
          type: object
          description: The latest operation on the Git Sync installation.
          properties:
            state:
              $ref: '#/components/schemas/GitSyncOperationState'
            direction:
              $ref: '#/components/schemas/GitSyncOperationDirection'
            startedAt:
              $ref: '#/components/schemas/Timestamp'
            endedAt:
              $ref: '#/components/schemas/Timestamp'
            error:
              type: string
              description: Why the operation failed, when it did.
            errorAction:
              $ref: '#/components/schemas/GitSyncOperationErrorAction'
          required:
          - state
          - direction
          - startedAt
        operationTimeout:
          type: integer
          description: How long an operation is allowed to run before it is terminated (in milliseconds).
        updatedAt:
          description: When the Git provider details were last updated
          $ref: '#/components/schemas/Timestamp'
      required:
      - installationId
      - installationProvider
      - installationStatus
    GitSyncOperationErrorAction:
      type: object
      description: An action the user can take to resolve a failed Git Sync operation.
      properties:
        label:
          type: string
          description: Label for the action.
        url:
          type: string
          format: uri
          description: URL where the user can resolve the failure.
      required:
      - label
      - url
    SiteSpace:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-space"
          enum:
          - site-space
        id:
          type: string
          description: Unique identifier of the site-space
        path:
          $ref: '#/components/schemas/SiteSpacePath'
        section:
          type: string
          description: ID of the section the space belongs to in the site
        space:
          $ref: '#/components/schemas/Space'
        title:
          type: string
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        default:
          type: boolean
          description: Whether this is the default space for the site
        condition:
          description: Conditional expression used to evaluate whether the site space should be shown to the site's visitor.
          $ref: '#/components/schemas/Expression'
        pageId:
          oneOf:
          - type: string
          - type: 'null'
          description: Custom home page within the space, rendered at the site space's path root instead of the space's default landing page.
        draft:
          type: boolean
          description: Whether the site space is draft and not live.
        hasAdvancedCustomizationFeature:
          type: boolean
          description: Whether the space has advanced customization feature enabled
        urls:
          type: object
          description: URLs associated with the object
          properties:
            published:
              type: string
              description: URL of the published version of the site-space. Only defined when site is published.
              format: uri
        hidden:
          type: boolean
          description: Whether the site space is hidden. If true, the site space will not be shown in the site's navigation.
      required:
      - object
      - id
      - space
      - title
      - path
      - draft
      - urls
    LocalizedString128:
      type: object
      description: Localized string value with a 128 character limit, keyed by locale. Contains overrides for non-default languages only.
      additionalProperties:
        type: string
        maxLength: 128
      propertyNames:
        $ref: '#/components/schemas/TranslationLanguage'
    MergeRulesSpaceConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationInherit'
      - $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
    MergeRulesConfigurationNone:
      type: object
      description: The merge rules are disabled, change requests can be merged without review.
      properties:
        type:
          type: string
          enum:
          - none
      required:
      - type
    URL:
      type: string
      format: uri
      maxLength: 2048
    ContentImportTarget:
      type: object
      properties:
        space:
          type: string
          description: ID of the space to import in
        changeRequest:
          type: string
          description: ID of the change request to import in
        page:
          type: string
          description: ID of the page to import in
      required:
      - space
    SpaceEditMode:
      type: string
      description: 'Determines how a Space can be edited.

        * `live`: Users can directly edit the space

        * `locked`: All edits are locked for this space.

        '
      enum:
      - live
      - locked
    SpaceTitle:
      type: string
      description: Title of the space
      maxLength: 50
    GitSyncOperationState:
      type: string
      description: '* `running`: The operation is still running

        * `failure`: The operation failed

        * `success`: The operation was successful

        * `timeout`: The operation timed out

        '
      enum:
      - running
      - failure
      - success
      - timeout
    List:
      type: object
      properties:
        next:
          type: object
          properties:
            page:
              type: string
              description: Unique identifier to query the next results page
          required:
          - page
        count:
          type: number
          description: Total count of objects in the list
    TranslationLanguage:
      type: string
      enum:
      - en
      - fr
      - de
      - es
      - it
      - pt
      - pt-br
      - ru
      - ja
      - zh
      - zh-tw
      - yue
      - ko
      - ar
      - hi
      - nl
      - pl
      - tr
      - sv
      - 'no'
      - da
      - fi
      - el
      - cs
      - hu
      - ro
      - th
      - vi
      - id
      - ms
      - he
      - uk
      - sk
      - bg
      - hr
      - lt
      - lv
      - et
      - sl
      - fr-ca
      - es-mx
      - es-419
    VisitorAuthIntegrationBackend:
      type: object
      title: Integration backend for authenticated access
      properties:
        backend:
          type: string
          description: Integration as backend for authenticated access
          enum:
          - integration
      required:
      - backend
    SiteExternalLink:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-external-link"
          enum:
          - site-external-link
        id:
          type: string
          description: Unique identifier of the external link
        title:
          $ref: '#/components/schemas/SiteSectionTitle'
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        description:
          $ref: '#/components/schemas/SiteSectionDescription'
        localizedDescription:
          $ref: '#/components/schemas/LocalizedString256'
        icon:
          $ref: '#/components/schemas/Icon'
        url:
          $ref: '#/components/schemas/URL'
          description: Absolute HTTP or HTTPS URL opened by the external link
        sectionGroup:
          type: string
          description: ID of the section group the external link belongs to. Omitted for a root link.
        draft:
          type: boolean
          description: Whether the external link is draft and not live
        condition:
          description: Conditional expression used to evaluate whether the external link should be shown to the site's visitor
          $ref: '#/components/schemas/Expression'
      required:
      - object
      - id
      - title
      - url
      - draft
  parameters:
    returnPreference:
      in: header
      name: prefer
      description: Control whether a successful response includes the updated resource representation.
      required: false
      schema:
        type: string
        enum:
        - return=minimal
        - return=representation
    organizationId:
      name: organizationId
      in: path
      required: true
      description: The unique id of the organization
      schema:
        $ref: '#/components/schemas/EntityId'
    listLimit:
      name: limit
      in: query
      description: The number of results per page
      schema:
        type: number
        minimum: 0
        maximum: 1000
    siteId:
      name: siteId
      in: path
      required: true
      description: The unique id of the site
      schema:
        type: string
    listPage:
      name: page
      in: query
      description: Identifier of the page results to fetch.
      schema:
        type: string
    siteSectionGroupId:
      name: siteSectionGroupId
      in: path
      required: true
      description: The unique id of the site group
      schema:
        type: string
  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                    - 400
                  message:
                    type: string
                required:
                - code
                - message
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - code
                - message
  headers:
    returnPreferenceApplied:
      description: Confirms that the requested minimal response preference was applied.
      schema:
        type: string
        enum:
        - return=minimal
  securitySchemes:
    user:
      type: http
      scheme: bearer
    user-internal:
      type: http
      scheme: bearer
    user-staff:
      type: http
      scheme: bearer
    integration:
      type: http
      scheme: bearer
    integration-installation:
      type: http
      scheme: bearer
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.gitbook.com/authorize
          tokenUrl: https://oauth.gitbook.com/token
          scopes:
            user:read: Read your GitBook user profile.
            organization:read: Read the organizations you belong to, their settings and metadata, and their AI agent conversations.
            organization:write: Create organizations, and update organization settings and AI agent conversations.
            organization:members:read: Read organization members, teams, invites and link invites.
            organization:members:write: Manage organization members, teams, invites and link invites.
            organization:ask: Ask AI questions across an organization's content.
            organization:search: Search across an organization's content.
            space:read: Read spaces and their content, including pages, change requests and their reviews, comments, files and revision history.
            space:write: Create, update and delete spaces and their content, including change requests (create, edit, review), comments, and content imports and exports. Merging a change request also requires change-request:merge.
            space:permissions:read: Read the users and teams who have access to spaces and collections.
            space:permissions:write: Manage who has access to spaces and collections, including inviting users and teams.
            change-request:merge: Merge change requests, publishing their changes to the space. Creating, editing and reviewing change requests only requires space:write.
            site:read: Read sites and their settings, including navigation structure, linked spaces, customization, redirects, topics, AI configuration and documentation issues.
            site:write: Create, update and delete sites and their settings, including navigation structure (sections, linked spaces, external links), customization, redirects, topics and AI configuration.
            site:publish: Publish and unpublish sites, controlling their public exposure.
            site:permissions:read: Read the users and teams who have access to sites.
            site:permissions:write: Manage who has access to sites, including inviting users and teams.
            site:auth:read: Read how visitors authenticate on a site and its security configuration, including private share links.
            site:auth:write: Manage how visitors authenticate on a site and its security configuration, including private share links.
            site:insights:read: Read site analytics and insights, including the questions visitors asked Ask AI and the answers they received.
            site:ask: Ask AI questions across a site's content.
            site:search: Search across a site's content.
            integration:read: Read integrations, their status and where they are installed.
            integration:installations:read: Read integration installations and their configuration, which can include credentials for third-party services.
            integration:installations:write: Install and configure integrations on an organization, its spaces and its sites.
            integration:publish: Publish integrations, which can request their own permissions on your content, and route their events to a development tunnel.
            integration:delete: Unpublish integrations, permanently deleting them and every installation of them.
            openapi:read: Read OpenAPI specifications.
            openapi:write: Create, update and delete OpenAPI specifications.
