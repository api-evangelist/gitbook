      type: object
      description: Renders a boolean input.
      properties:
        type:
          type: string
          enum:
          - switch
        disabled:
          type: boolean
        state:
          description: State binding. The value of the input will be stored as a property in the state named after this ID.
          type: string
        initialValue:
          description: Value to initialize the switch with.
          type: boolean
        onValueChange:
          $ref: '#/components/schemas/ContentKitAction'
        confirm:
          $ref: '#/components/schemas/ContentKitConfirm'
      required:
      - type
      - state
    ContentComputeEvent:
      allOf:
      - $ref: '#/components/schemas/SpaceEvent'
      - type: object
        description: Generic event when computing the content of a space
        properties:
          sourceId:
            type: string
          props:
            description: Properties passed to the rendering.
            $ref: '#/components/schemas/PlainObject'
          dependencies:
            description: Dependencies of the computation.
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ComputedContentDependencyResolved'
        required:
        - sourceId
        - props
        - dependencies
    APITemporaryToken:
      type: object
      properties:
        token:
          type: string
          description: Temporary access token to authenticate with the API
      required:
      - token
    EntityId:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: A unique entity identifier
    ContentKitBuiltInSource:
      type: object
      description: Built-in sources that can be used to provide a ContentKitSelect.
      properties:
        source:
          type: string
          enum:
          - openapi
      required:
      - source
    ContentKitDivider:
      type: object
      description: Divider between 2 boxes in a stack.
      properties:
        type:
          type: string
          enum:
          - divider
        size:
          type: string
          enum:
          - small
          - medium
          - large
      required:
      - type
    SpaceInstallationDeletedEvent:
      allOf:
      - $ref: '#/components/schemas/SpaceEvent'
      - type: object
        description: Event received when integration has been uninstalled from a space.
        properties:
          type:
            type: string
            enum:
            - space_installation_deleted
          previous:
            type: object
            description: The state of the Space installation before it was deleted.
            properties:
              configuration:
                type: object
                description: The previous configuration of the Space installation.
        required:
        - type
        - previous
    SiteEvent:
      allOf:
      - $ref: '#/components/schemas/InstallationEvent'
      - type: object
        description: Common properties for all events related to a specific site.
        properties:
          siteId:
            type: string
            description: ID of the site
        required:
        - siteId
    ContentKitConfiguration:
      type: object
      description: Higher level element to define a configuration block. Does not add any UI elements or wrappers. Must be used as a top level element for any configuration component.
      properties:
        type:
          type: string
          enum:
          - configuration
        children:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/ContentKitStepper'
            minItems: 1
            maxItems: 1
          - type: array
            items:
              $ref: '#/components/schemas/ContentKitDescendantElement'
            minItems: 1
      required:
      - type
      - children
    ContentKitStepperStep:
      type: object
      properties:
        type:
          type: string
          enum:
          - step
        id:
          description: unique identifier for the step
          type: string
        title:
          description: title of the step
          type: string
          maxLength: 50
        next:
          description: indicates if the user can progress to the next step based on some internal validation or condition
          type: boolean
          default: false
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentKitDescendantElement'
          minItems: 1
      required:
      - type
      - id
      - children
    Event:
      description: Any event that can be received from GitBook.
      oneOf:
      - $ref: '#/components/schemas/InstallationSetupEvent'
      - $ref: '#/components/schemas/InstallationDeletedEvent'
      - $ref: '#/components/schemas/SpaceInstallationSetupEvent'
      - $ref: '#/components/schemas/SpaceInstallationDeletedEvent'
      - $ref: '#/components/schemas/SiteInstallationSetupEvent'
      - $ref: '#/components/schemas/SiteInstallationDeletedEvent'
      - $ref: '#/components/schemas/SiteViewEvent'
      - $ref: '#/components/schemas/SpaceContentUpdatedEvent'
      - $ref: '#/components/schemas/SpaceGitSyncCompletedEvent'
      - $ref: '#/components/schemas/SpaceGitSyncStartedEvent'
      - $ref: '#/components/schemas/SpaceVisibilityUpdatedEvent'
      - $ref: '#/components/schemas/TaskEvent'
      - $ref: '#/components/schemas/FetchEvent'
      - $ref: '#/components/schemas/FetchPublishedScriptEvent'
      - $ref: '#/components/schemas/FetchVisitorAuthenticationEvent'
      - $ref: '#/components/schemas/UIRenderEvent'
      - $ref: '#/components/schemas/ContentComputeDocumentEvent'
      - $ref: '#/components/schemas/ContentComputeRevisionEvent'
      - $ref: '#/components/schemas/PageFeedbackEvent'
      discriminator:
        propertyName: type
    User:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "user"
          enum:
          - user
        id:
          type: string
          description: Unique identifier for the user
        displayName:
          type: string
          description: Full name for the user
        email:
          type: string
          description: Email address of the user
        photoURL:
          type: string
          description: URL of the user's profile picture
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the user in the API
              format: uri
          required:
          - location
      required:
      - object
      - id
      - displayName
      - urls
    PageFeedbackRating:
      type: string
      enum:
      - bad
      - ok
      - good
    SiteType:
      type: string
      description: The type of the site
      enum:
      - basic
      - premium
      - ultimate
      - sponsored
    ContentKitBlockControl:
      type: object
      description: Control menu item displayed for the block.
      properties:
        icon:
          $ref: '#/components/schemas/ContentKitIcon'
        label:
          type: string
        onPress:
          $ref: '#/components/schemas/ContentKitAction'
        confirm:
          $ref: '#/components/schemas/ContentKitConfirm'
      required:
      - label
      - onPress
    IntegrationContentSecurityPolicy:
      description: "Security policy to validate the content of the integrations scripts and Contentkit. Will be sent as \nheaders when processing the script fetch event and the blocks fetch events.\n"
      oneOf:
      - type: string
      - type: object
        properties:
          base-uri:
            type: string
          block-all-mixed-content:
            type: string
          child-src:
            type: string
          connect-src:
            type: string
          default-src:
            type: string
          font-src:
            type: string
          form-action:
            type: string
          frame-ancestors:
            type: string
          frame-src:
            type: string
          img-src:
            type: string
          manifest-src:
            type: string
          media-src:
            type: string
          navigate-to:
            type: string
          object-src:
            type: string
          plugin-types:
            type: string
          prefetch-src:
            type: string
          referrer:
            type: string
          report-to:
            type: string
          report-uri:
            type: string
          require-sri-for:
            type: string
          require-trusted-types-for:
            type: string
          sandbox:
            type: string
          script-src:
            type: string
          script-src-attr:
            type: string
          script-src-elem:
            type: string
          style-src:
            type: string
          style-src-attr:
            type: string
          style-src-elem:
            type: string
          trusted-types:
            type: string
          upgrade-insecure-requests:
            type: string
          worker-src:
            type: string
    TranslationRef:
      type: object
      properties:
        kind:
          type: string
          enum:
          - translation
        translation:
          type: string
          description: ID of the translation sync
      required:
      - kind
      - translation
    IntegrationInstallationSpaceSelection:
      type: string
      description: Describe whether all spaces have been selected or there's a selection involved
      enum:
      - all
      - selected
    BillingMeterAddon:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    SiteViewEvent:
      allOf:
      - $ref: '#/components/schemas/SiteEvent'
      - type: object
        description: Event received when a page has been visited on a site.
        properties:
          type:
            type: string
            enum:
            - site_view
          spaceId:
            type: string
            description: Unique identifier of the visited space in the site.
            deprecated: true
          siteSpaceId:
            description: The site-space that was viewed
            type: string
          pageId:
            type: string
            description: Unique identifier of the visited page.
          visitor:
            $ref: '#/components/schemas/EventVisitor'
          url:
            type: string
            description: The GitBook content's URL visited (including URL params).
          referrer:
            type: string
            description: The URL of referrer that linked to the page.
        required:
        - type
        - visitor
        - url
        - referrer
  parameters:
    integrationName:
      name: integrationName
      in: path
      required: true
      description: Name of the integration.
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 100
    installationId:
      name: installationId
      in: path
      required: true
      description: Identifier of the installation
      schema:
        type: string
    integrationSearchTarget:
      name: target
      in: query
      description: Filter the integrations by target
      schema:
        $ref: '#/components/schemas/IntegrationTarget'
    integrationSearchCategory:
      name: category
      in: query
      description: Filter the integrations by category
      schema:
        $ref: '#/components/schemas/IntegrationCategory'
    integrationSearchBlockDomain:
      name: blockDomain
      in: query
      description: Filter the integrations by block's domains
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 100
    listPage:
      name: page
      in: query
      description: Identifier of the page results to fetch.
      schema:
        type: string
    organizationId:
      name: organizationId
      in: path
      required: true
      description: The unique id of the organization
      schema:
        $ref: '#/components/schemas/EntityId'
    integrationSearchContentSources:
      name: contentSources
      in: query
      description: If true, returns only integrations with contentSources. If false, returns only integrations without contentSources.
      schema:
        type: boolean
    integrationSearchBlocks:
      name: blocks
      in: query
      description: If true, returns only integrations with blocks. If false, returns only integrations without blocks.
      schema:
        type: boolean
    siteId:
      name: siteId
      in: path
      required: true
      description: The unique id of the site
      schema:
        type: string
    integrationEventId:
      name: eventId
      in: path
      required: true
      description: ID of the integration event
      schema:
        type: string
    integrationSearchScope:
      name: scope
      in: query
      description: Filter the integrations by scope
      schema:
        $ref: '#/components/schemas/IntegrationScope'
    spaceId:
      name: spaceId
      in: path
      required: true
      description: The unique id of the space
      schema:
        $ref: '#/components/schemas/EntityId'
    listLimit:
      name: limit
      in: query
      description: The number of results per page
      schema:
        type: number
        minimum: 0
        maximum: 1000
    integrationSearchOwner:
      name: owner
      in: query
      description: If defined, only list integrations owned by the given organization.
      schema:
        type: string
    integrationSearchQuery:
      name: search
      in: query
      description: 'A search string to filter integrations by name

        '
      schema:
        type: string
  responses:
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - code
                - message
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                    - 400
                  message:
                    type: string
                required:
                - code
                - message
  securitySchemes:
    user:
      type: http
      scheme: bearer
    user-internal:
      type: http
      scheme: bearer
    user-staff:
      type: http
      scheme: bearer
    integration:
      type: http
      scheme: bearer
    integration-installation:
      type: http
      scheme: bearer
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.gitbook.com/authorize
          tokenUrl: https://oauth.gitbook.com/token
          scopes:
            user:read: Read your GitBook user profile.
            organization:read: Read the organizations you belong to, their settings and metadata, and their AI agent conversations.
            organization:write: Create organizations, and update organization settings and AI agent conversations.
            organization:members:read: Read organization members, teams, invites and link invites.
            organization:members:write: Manage organization members, teams, invites and link invites.
            organization:ask: Ask AI questions across an organization's content.
            organization:search: Search across an organization's content.
            space:read: Read spaces and their content, including pages, change requests and their reviews, comments, files and revision history.
            space:write: Create, update and delete spaces and their content, including change requests (create, edit, review), comments, and content imports and exports. Merging a change request also requires change-request:merge.
            space:permissions:read: Read the users and teams who have access to spaces and collections.
            space:permissions:write: Manage who has access to spaces and collections, including inviting users and teams.
            change-request:merge: Merge change requests, publishing their changes to the space. Creating, editing and reviewing change requests only requires space:write.
            site:read: Read sites and their settings, including navigation structure, linked spaces, customization, redirects, topics, AI configuration and documentation issues.
            site:write: Create, update and delete sites and their settings, including navigation structure (sections, linked spaces, external links), customization, redirects, topics and AI configuration.
            site:publish: Publish and unpublish sites, controlling their public exposure.
            site:permissions:read: Read the users and teams who have access to sites.
            site:permissions:write: Manage who has access to sites, including inviting users and teams.
            site:auth:read: Read how visitors authenticate on a site and its security configuration, including private share links.
            site:auth:write: Manage how visitors authenticate on a site and its security configuration, including private share links.
            site:insights:read: Read site analytics and insights, including the questions visitors asked Ask AI and the answers they received.
            site:ask: Ask AI questions across a site's content.
            site:search: Search across a site's content.
            integration:read: Read integrations, their status and where they are installed.
            integration:installations:read: Read integration installations and their configuration, which can include credentials for third-party services.
            integration:installations:write: Install and configure integrations on an organization, its spaces and its sites.
            integration:publish: Publish integrations, which can request their own permissions on your content, and route their events to a development tunnel.
            integration:delete: Unpublish integrations, permanently deleting them and every installation of them.
            openapi:read: Read OpenAPI specifications.
            openapi:write: Create, update and delete OpenAPI specifications.
