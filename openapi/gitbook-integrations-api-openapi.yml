openapi: 3.2.0
info:
  title: GitBook Integrations API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: Integrations
paths:
  /integrations/{integrationName}/installations/{installationId}/spaces:
    post:
      operationId: installIntegrationOnSpace
      summary: Install an integration on a space
      description: Enables an existing organization-level installation on one space. The organization must already have the integration installed.
      x-gitbook-mcp: true
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - name: extended
        in: query
        description: If true, returns the space object in each items. If false, returns the space ID in each items.
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - space
              properties:
                space:
                  type: string
                  description: ID of the space to install the integration on
      responses:
        '201':
          headers:
            Location:
              description: URL for the installed integration
              schema:
                type: string
          description: Integration installed successfully on space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSpaceInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
      tags:
      - Integrations
    get:
      operationId: listIntegrationInstallationSpaces
      summary: List all space integration installations
      description: Returns a paginated list of the spaces an installation is enabled on, with the configuration of the integration for each of them. Pass extended to get the full space object instead of its ID.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:read
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: extended
        in: query
        description: If true, returns the space object in each items. If false, returns the space ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationSpaceInstallation'
  /integrations:
    get:
      operationId: listIntegrations
      summary: List all public integrations
      description: Returns a paginated list of the integrations published in the GitBook marketplace. Use this to discover an integration by name, category, or the blocks and content sources it provides, before installing it on an organization, space or site.
      x-gitbook-mcp: true
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/integrationSearchQuery'
      - $ref: '#/components/parameters/integrationSearchCategory'
      - $ref: '#/components/parameters/integrationSearchBlockDomain'
      - $ref: '#/components/parameters/integrationSearchBlocks'
      - $ref: '#/components/parameters/integrationSearchContentSources'
      - $ref: '#/components/parameters/integrationSearchOwner'
      - $ref: '#/components/parameters/integrationSearchScope'
      - $ref: '#/components/parameters/integrationSearchTarget'
      responses:
        '200':
          description: Paginated list of integrations
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Integration'
  /integrations/{integrationName}:
    get:
      operationId: getIntegrationByName
      summary: Get an integration by its name
      description: Returns a single integration by its unique name, including the configuration it expects, the targets it can be installed on, and the permissions it requests. Private integrations are only readable by the organization that owns them.
      x-gitbook-mcp: true
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      responses:
        '200':
          description: Integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '404':
          description: No matching integration found for given name
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: publishIntegration
      summary: Publish an integration
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:publish
      parameters:
      - $ref: '#/components/parameters/integrationName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '404':
          description: Organization could not be found for the given hostname
          $ref: '#/components/responses/NotFoundError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishIntegration'
    delete:
      operationId: unpublishIntegration
      summary: Unpublish an integration
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:delete
      parameters:
      - $ref: '#/components/parameters/integrationName'
      responses:
        '204':
          description: Integration did not exist
        '205':
          description: Integration has been deleted
  /integrations/{integrationName}/installations:
    get:
      operationId: listIntegrationInstallations
      summary: List all integration installations
      tags:
      - Integrations
      security:
      - integration: []
      - integration-installation: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: externalId
        in: query
        description: External Id to filter by
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationInstallation'
    post:
      operationId: installIntegration
      summary: Install an integration
      description: Installs an integration on an organization, creating the account-level installation that space and site installations hang off. Configure it with the update operation, then enable it on individual spaces or sites.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationTarget'
      responses:
        '201':
          headers:
            Location:
              description: URL for the installed integration
              schema:
                type: string
          description: Integration installed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /integrations/{integrationName}/events:
    get:
      operationId: listIntegrationEvents
      summary: List all integration events
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: Paginated list of integration events
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationEvent'
  /integrations/{integrationName}/events/{eventId}:
    get:
      operationId: getIntegrationEvent
      summary: Get an integration event by its ID
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/integrationEventId'
      responses:
        '200':
          description: Integration event
          content:
            application/json:
              schema:
                type: object
                required:
                - event
                properties:
                  event:
                    $ref: '#/components/schemas/IntegrationEvent'
                  trace:
                    $ref: '#/components/schemas/IntegrationEventTrace'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /integrations/{integrationName}/spaces:
    get:
      operationId: listIntegrationSpaceInstallations
      summary: List all integration space installations
      tags:
      - Integrations
      security:
      - integration: []
      - integration-installation: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: externalId
        in: query
        description: External Id to filter by
        schema:
          type: string
      - name: extended
        in: query
        description: If true, returns the space object in each items. If false, returns the space ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationSpaceInstallation'
  /integrations/{integrationName}/sites:
    get:
      operationId: listIntegrationSiteInstallations
      summary: List all integration site installations
      tags:
      - Integrations
      security:
      - integration: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: externalId
        in: query
        description: External ID to filter by
        schema:
          type: string
      - name: extended
        in: query
        description: If true, returns the site object in each items. If false, returns the site ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationSiteInstallation'
  /integrations/{integrationName}/dev:
    put:
      operationId: setIntegrationDevelopmentMode
      summary: Enable integration dev mode
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:publish
      parameters:
      - $ref: '#/components/parameters/integrationName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnelUrl:
                  type: string
                  description: URL of the tunnel to dispatch integration events to
                  minLength: 1
                  maxLength: 256
                all:
                  type: boolean
                  default: false
                  description: 'If set to true, all requests will be forwarded to the tunnel, not just from the owning organization.

                    '
              required:
              - tunnelUrl
      responses:
        '204':
          description: Updated development mode successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: disableIntegrationDevelopmentMode
      summary: Disable integration dev mode
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:publish
      parameters:
      - $ref: '#/components/parameters/integrationName'
      responses:
        '205':
          description: Disabled development mode successfully
  /integrations/{integrationName}/render:
    get:
      operationId: renderIntegrationUIWithGet
      summary: Render an integration UI with GET method
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - name: request
        in: query
        required: true
        description: LZ-string compressed JSON request
        schema:
          type: string
      responses:
        '200':
          description: ContentKit element to render
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentKitRenderOutput'
          headers:
            Cache-Control:
              schema:
                type: string
    post:
      operationId: renderIntegrationUIWithPost
      summary: Render an integration UI with POST method
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      responses:
        '200':
          description: ContentKit element to render
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentKitRenderOutput'
          headers:
            Cache-Control:
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderIntegrationUI'
  /integrations/{integrationName}/tasks:
    post:
      operationId: queueIntegrationTask
      summary: Queue an integration task
      tags:
      - Integrations
      security:
      - integration: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  description: Payload for the integration task
                schedule:
                  type: number
                  description: Number of seconds to wait before executing the task, defaults to 0
                  minimum: 0
                  maximum: 86400
              required:
              - task
      responses:
        '204':
          description: Integration task created successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
  /integrations/{integrationName}/installations/{installationId}:
    get:
      operationId: getIntegrationInstallationById
      summary: Get an integration installation by its ID
      description: Returns the organization-level installation of an integration, including its account configuration and how many spaces it manages. The configuration can contain credentials the integration stored for third-party services.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:read
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      responses:
        '200':
          description: Integration installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateIntegrationInstallation
      summary: Update an integration installation
      description: Updates the account-level configuration of an installation, and which spaces or sites it applies to.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      responses:
        '200':
          description: The installation has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationInstallation'
    delete:
      operationId: uninstallIntegration
      summary: Uninstall an integration
      tags:
      - Integrations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      responses:
        '204':
          description: Integration installation did not exist
        '205':
          description: Integration uninstalled successfully
  /integrations/{integrationName}/installations/{installationId}/tokens:
    post:
      operationId: createIntegrationInstallationToken
      summary: Create an integration installation API token
      description: Creates a temporary API token of an integration's installation that has access to the installation and it's scopes. You must be authenticated as the integration to obtain this token.
      tags:
      - Integrations
      security:
      - integration: []
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      responses:
        '200':
          description: The API token for the installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITemporaryToken'
        '404':
          description: Installation could not be found
          $ref: '#/components/responses/NotFoundError'
  /integrations/{integrationName}/installations/{installationId}/spaces/{spaceId}:
    get:
      operationId: getIntegrationSpaceInstallation
      summary: Get an integration space installation
      description: Returns the installation of an integration on one space, including the configuration of the integration for that space.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:read
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/spaceId'
      - name: extended
        in: query
        description: If true, returns the space object in each items. If false, returns the space ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Integration space installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSpaceInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateIntegrationSpaceInstallation
      summary: Update an integration space installation
      description: Updates the configuration of an integration for one space.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/spaceId'
      - name: extended
        in: query
        description: If true, returns the space object in each items. If false, returns the space ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The space installation has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSpaceInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationSpaceInstallation'
    delete:
      operationId: uninstallIntegrationFromSpace
      summary: Uninstall an integration from a space
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/spaceId'
      responses:
        '204':
          description: The space installation did not exist.
        '205':
          description: The space installation has been deleted.
  /integrations/{integrationName}/installations/{installationId}/sites:
    get:
      operationId: listIntegrationInstallationSites
      summary: List all site integration installations
      description: Returns a paginated list of the sites an installation is enabled on, with the configuration of the integration for each of them. Pass extended to get the full site object instead of its ID.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:read
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: extended
        in: query
        description: If true, returns the site object in each items. If false, returns the site ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationSiteInstallation'
    post:
      operationId: installIntegrationOnSite
      summary: Install an integration on a site
      description: Enables an existing organization-level installation on one site. The organization must already have the integration installed.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - name: extended
        in: query
        description: If true, returns the site object in each items. If false, returns the site ID in each items.
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - siteId
              properties:
                siteId:
                  type: string
                  description: ID of the site to install the integration on
      responses:
        '201':
          headers:
            Location:
              description: URL for the installed integration on the site
              schema:
                type: string
          description: Integration installed successfully on site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSiteInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /integrations/{integrationName}/installations/{installationId}/sites/{siteId}:
    get:
      operationId: getIntegrationSiteInstallation
      summary: Get an integration site installation
      description: Returns the installation of an integration on one site, including the configuration of the integration for that site.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:read
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/siteId'
      - name: extended
        in: query
        description: If true, returns the site object in each items. If false, returns the site ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Integration site installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSiteInstallation'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateIntegrationSiteInstallation
      summary: Update an integration site installation
      description: Updates the configuration of an integration for one site.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:installations:write
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/siteId'
      - name: extended
        in: query
        description: If true, returns the site object in each items. If false, returns the site ID in each items.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The site installation has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSiteInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationSiteInstallation'
    delete:
      operationId: uninstallIntegrationFromSite
      summary: Uninstall an integration from a site
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/integrationName'
      - $ref: '#/components/parameters/installationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '204':
          description: The site installation did not exist.
        '205':
          description: The site installation has been deleted.
  /orgs/{organizationId}/integrations:
    get:
      operationId: listOrganizationIntegrations
      summary: List all public integrations along with private ones trusted by the specific org
      description: 'Returns a paginated list of the integrations available to the organization: every publicly published integration plus the private ones the organization owns or is trusted with. Prefer this over the public listing when acting inside an organization.'
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/integrationSearchQuery'
      - $ref: '#/components/parameters/integrationSearchCategory'
      - $ref: '#/components/parameters/integrationSearchBlockDomain'
      - $ref: '#/components/parameters/integrationSearchBlocks'
      - $ref: '#/components/parameters/integrationSearchContentSources'
      - $ref: '#/components/parameters/integrationSearchOwner'
      - $ref: '#/components/parameters/integrationSearchScope'
      - $ref: '#/components/parameters/integrationSearchTarget'
      responses:
        '200':
          description: List of integrations.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Integration'
  /orgs/{organizationId}/integrations/{integrationName}/installation_status:
    get:
      operationId: getOrganizationIntegrationStatus
      summary: Get the status of an integration
      description: Returns whether an integration is installed for the organization and the status of that installation. Use this for a single integration instead of listing every status.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - integration:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/integrationName'
      responses:
        '200':
          description: Integration installation status
          content:
            application/json:
              schema:
                properties:
                  status:
                    $ref: '#/components/schemas/IntegrationInstallationStatus'
                required:
                - status
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/installations:
    get:
      operationId: listOrganizationInstallations
      summary: List all integration installations
      tags:
      - Integrations
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/integrationSearchQuery'
      responses:
        '200':
          description: List of integrations with the associated installations.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          installation:
                            $ref: '#/components/schemas/IntegrationInstallation'
                          integration:
                            $ref: '#/components/schemas/Integration'
                        required:
                        - integration
                        - installation
  /orgs/{organizationId}/integrations/installations-status:
    get:
      operationId: listOrganizationIntegrationsStatus
      summary: List all integration statuses
      description: Returns integration installations in the organization. Use site or space with the matching target to efficiently scope the result to one resource. The target of each installation says whether it is installed on the organization, a space or a site.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: target
        in: query
        description: Filter installations by their target (organization, space, or site). When not provided, defaults to organization-level installations for backwards compatibility
        schema:
          type: string
          default: organization
          enum:
          - organization
          - space
          - site
      - name: site
        in: query
        description: Return installations for this site. Only valid when target is site.
        schema:
          type: string
      - name: space
        in: query
        description: Return installations for this space. Only valid when target is space.
        schema:
          type: string
      responses:
        '200':
          description: List of installed integrations and their statuses
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/InstalledIntegration'
  /orgs/{organizationId}/sites/{siteId}/integration-scripts:
    get:
      operationId: listSiteIntegrationScripts
      summary: List custom scripts injected into a site's published pages
      description: Returns all integration scripts configured to be injected into the published pages of a site, such as analytics trackers, chat widgets, or custom JavaScript. Use this to audit which third-party scripts are active on the site.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteIntegrationScript'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/sites/{siteId}/integrations:
    get:
      operationId: listSiteIntegrations
      summary: List third-party integrations enabled on a site
      description: Returns a paginated list of integrations currently enabled on the site. Integrations extend site functionality with third-party services such as analytics, support, or authentication providers. Use this to audit which integrations are active, or to find an integration before updating its settings.
      x-gitbook-mcp: true
      tags:
      - Integrations
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/integrationSearchQuery'
      responses:
        '200':
          description: Listing of integrations enabled in the site.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Integration'
components:
  schemas:
    GitSyncOperationDirection:
      type: string
      enum:
      - export
      - import
    IntegrationSpaceInstallation:
      allOf:
      - $ref: '#/components/schemas/IntegrationContentInstallationBase'
      - type: object
        properties:
          space:
            description: The space the integration is installed on. Using the string value is deprecated in favor of space.id
            oneOf:
            - type: string
            - $ref: '#/components/schemas/Space'
        required:
        - space
    MemberRoleOrGuest:
      description: The role of a member in an organization, null for guests
      oneOf:
      - $ref: '#/components/schemas/MemberRole'
      - type: 'null'
    DefaultLevel:
      description: Default level for a piece of content
      oneOf:
      - $ref: '#/components/schemas/MemberRoleOrGuest'
      - type: string
        enum:
        - inherit
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    IntegrationInstallationStatus:
      type: string
      enum:
      - active
      - pending
      - paused
    MergeRulesConfigurationInherit:
      type: object
      description: The merge rules inherits from the organization configuration.
      properties:
        type:
          type: string
          enum:
          - inherit
      required:
      - type
    IntegrationInstallationExternalIds:
      type: array
      description: External IDs assigned by the integration.
      maxItems: 5
      items:
        type: string
    PreviousGitSyncState:
      type: object
      description: What is still known about a target's Git Sync after its installation was removed. Never returned alongside `gitSync`, which describes a live installation.
      required:
      - url
      properties:
        url:
          type: string
          description: The URL to the directory of the repository tree the content synced with before its Git Sync installation was removed, at the branch it synced.
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    MergeRule:
      oneOf:
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_one_of_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - allow_bypass
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_at_least_one_review
            - require_at_least_one_approved_review
            - require_all_reviews_approved
            - require_agent_review
            - require_up_to_date_change_request
            - require_change_request_subject
            - require_change_request_description
            - require_author_to_merge
        required:
        - rule
      - type: object
        description: The merge rule is written in the advanced custom expression syntax.
        properties:
          rule:
            type: string
            enum:
            - custom
          expression:
            $ref: '#/components/schemas/Expression'
          message:
            type: string
            description: Optional message to display when the expression evaluates to false.
        required:
        - rule
        - expression
    MemberRole:
      type: string
      description: '"The role of a member in an organization.

        "admin": Can administrate the content: create, delete spaces, ...

        "create": Can create content.

        "review": Can review content.

        "edit": Can edit the content (live or change requests).

        "comment": Can access the content and its discussions.

        "read": Can access the content, but cannot update it in any way.

        '
      enum:
      - admin
      - create
      - edit
      - review
      - comment
      - read
    Space:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "space"
          enum:
          - space
        id:
          type: string
          description: Unique identifier for the space
        title:
          $ref: '#/components/schemas/SpaceTitle'
        emoji:
          description: An emoji for this space. It'll match the emoji shown in the GitBook app.
          $ref: '#/components/schemas/Emoji'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        editMode:
          $ref: '#/components/schemas/SpaceEditMode'
        type:
          type: string
          description: Kind of space. Only set to `styleguide` for spaces holding a team's writing style guide; omitted for regular spaces.
          enum:
          - styleguide
        mergeRules:
          $ref: '#/components/schemas/MergeRulesSpaceConfiguration'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the space in the API
              format: uri
            app:
              type: string
              description: URL of the space in the application
              format: uri
            published:
              type: string
              description: URL of the published version of the space. Only defined when visibility is not "private."
              format: uri
            public:
              type: string
              description: URL of the public version of the space. Only defined when visibility is "public".
              format: uri
            icon:
              description: URL of the icon of this space, if defined.
              $ref: '#/components/schemas/URL'
          required:
          - app
          - location
        organization:
          type: string
          description: ID of the organization owning this space
        parent:
          type: string
          description: ID of the parent collection.
        language:
          $ref: '#/components/schemas/TranslationLanguage'
        gitSync:
          $ref: '#/components/schemas/GitSyncState'
        previousGitSync:
          $ref: '#/components/schemas/PreviousGitSyncState'
        imports:
          description: 'Import runs targeting this space, still running or ended recently, most recent first. Only returned when fetching a single space.

            '
          type: array
          items:
            $ref: '#/components/schemas/ContentImportRun'
        visitorAuth:
          $ref: '#/components/schemas/VisitorAuth'
        revision:
          type: string
          description: ID of the active revision in the space.
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        comments:
          type: number
          description: Count of opened comments on the space.
        changeRequests:
          type: number
          description: Total count of change requests on the space.
        changeRequestsOpen:
          type: number
          description: Count of open change requests on the space.
        changeRequestsDraft:
          type: number
          description: Count of draft change requests on the space.
        internal_poweredByV2:
          type: boolean
          description: Whether the space is powered by V2 of the content system.
        internal_singleWebsocket:
          type: boolean
          description: Whether the space uses a single websocket connection for all real-time communication.
        permissions:
          type: object
          description: The set of permissions for the space
          properties:
            view:
              type: boolean
              description: Can the user view the space content.
            access:
              type: boolean
              description: Can the user access the space in the application.
            admin:
              type: boolean
              description: Can the user edit the title, install integrations, and manage the space.
            viewInviteLinks:
              type: boolean
              description: Can the user view the invite links of the space.
            edit:
              type: boolean
              description: Can the user edit the content of the space by creating a change request.
            triggerGitSync:
              type: boolean
              description: Can the user trigger a git sync.
            comment:
              type: boolean
              description: Can the user comment on the content.
            merge:
              type: boolean
              description: Can the user merge change requests.
            review:
              type: boolean
              description: Can the user review change requests.
            installIntegration:
              type: boolean
              description: Can the user install integrations in the space.
          required:
          - view
          - access
          - admin
          - viewInviteLinks
          - edit
          - triggerGitSync
          - comment
          - merge
          - review
          - installIntegration
      required:
      - object
      - id
      - title
      - emoji
      - organization
      - visibility
      - revision
      - createdAt
      - updatedAt
      - comments
      - changeRequests
      - changeRequestsOpen
      - changeRequestsDraft
      - mergeRules
      - urls
      - defaultLevel
      - permissions
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    VisitorAuthCustomBackend:
      type: object
      title: Custom backend for authenticated access
      properties:
        backend:
          type: string
          description: Custom backend for authenticated access
          enum:
          - custom
      required:
      - backend
    ContentImportRun:
      type: object
      properties:
        object:
          description: Type of Object, always equals to "import-run"
          type: string
          enum:
          - import-run
        id:
          description: Unique ID of the import
          type: string
        startedAt:
          description: Date when the import has started
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          description: Filled when the imported is in status "completed"
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: Date when the import was requested
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          description: Date when the import was last updated
          $ref: '#/components/schemas/Timestamp'
        status:
          description: Status of the import
          type: string
          enum:
          - pending
          - in-progress
          - completed
          - failed
          - cancelled
        reason:
          description: Reason for the import failure when `status` is `failed`.
          type: string
        source:
          description: Where the content is imported from.
          $ref: '#/components/schemas/ContentImportSource'
        target:
          description: Where the content is imported into.
          $ref: '#/components/schemas/ContentImportTarget'
        site:
          description: ID of the site the target space belongs to, when it belongs to exactly one.
          type: string
        createdBy:
          description: ID of the user who started the import.
          type: string
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              description: URL of the import run in the API
              type: string
              format: uri
          required:
          - location
        pages:
          description: Pages included in the import
          type: array
          items:
            type: object
            properties:
              id:
                description: ID of page
                type: string
              sourceURL:
                description: Source URL where the page has been imported from
                type: string
              type:
                description: Type of page
                type: string
                enum:
                - page
                - folder
              status:
                description: Status of the page
                type: string
                enum:
                - complete
                - pending
            required:
            - id
            - type
            - status
      required:
      - id
      - status
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    GitSyncProvider:
      type: string
      description: The provider of the Git Sync installation.
      enum:
      - github
      - gitlab
      - github-legacy
    MergeRulesStandaloneConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationRules'
      - $ref: '#/components/schemas/MergeRulesConfigurationNone'
    Timestamp:
      type: string
      format: date-time
    Emoji:
      type: string
      maxLength: 50
      format: emoji
      description: Unicode codepoint or character of the emoji
      example: 🎉
    ContentImportSource:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - website
          url:
            $ref: '#/components/schemas/URL'
        required:
        - type
        - url
      - type: object
        properties:
          type:
            type: string
            enum:
            - file
          files:
            description: Files to import
            type: array
            maxItems: 50
            items:
              description: Key of file
              type: string
        required:
        - type
        - files
    ContentVisibility:
      type: string
      description: "* `public`: Anyone can access the content, and the content is indexed by search engines.\n* `unlisted`: Anyone can access the content, and the content is not indexed by search engines\n* `share-link`: Anyone with a secret token in the url can access the content.\n* `visitor-auth`: Anyone authenticated through a JWT token can access the content.\n* `in-collection`: Anyone who can access the parent collection can access the content.\n  Only available for spaces in a collection.\n* `private`: Authorized members can access the content.\n"
      enum:
      - public
      - unlisted
      - share-link
      - visitor-auth
      - in-collection
      - private
    GitSyncState:
      type: object
      properties:
        repoName:
          type: string
          description: Repository name.
        installationStatus:
          $ref: '#/components/schemas/GitSyncInstallationStatus'
        installationProvider:
          $ref: '#/components/schemas/GitSyncProvider'
        integration:
          type: string
          deprecated: true
          description: The integration name providing the Git Sync.
        installationId:
          type: string
          description: The ID of the Git Sync installation.
        parentInstallationId:
          type: string
          description: The ID of the parent Git Sync installation, if any.
        url:
          type: string
          description: The URL to the repository tree, used when rendering public content.
        installationProjectDirectory:
          type: string
          description: Directory in the repository this content syncs from, resolved against the parent installation when the installation is managed by a site. Absent when the content syncs from the root of the repository.
        operation:
          type: object
          description: The latest operation on the Git Sync installation.
          properties:
            state:
              $ref: '#/components/schemas/GitSyncOperationState'
            direction:
              $ref: '#/components/schemas/GitSyncOperationDirection'
            startedAt:
              $ref: '#/components/schemas/Timestamp'
            endedAt:
              $ref: '#/components/schemas/Timestamp'
            error:
              type: string
              description: Why the operation failed, when it did.
            errorAction:
              $ref: '#/components/schemas/GitSyncOperationErrorAction'
          required:
          - state
          - direction
          - startedAt
        operationTimeout:
          type: integer
          description: How long an operation is allowed to run before it is terminated (in milliseconds).
        updatedAt:
          description: When the Git provider details were last updated
          $ref: '#/components/schemas/Timestamp'
      required:
      - installationId
      - installationProvider
      - installationStatus
    GitSyncOperationErrorAction:
      type: object
      description: An action the user can take to resolve a failed Git Sync operation.
      properties:
        label:
          type: string
          description: Label for the action.
        url:
          type: string
          format: uri
          description: URL where the user can resolve the failure.
      required:
      - label
      - url
    MergeRulesSpaceConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationInherit'
      - $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
    SpaceTitle:
      type: string
      description: Title of the space
      maxLength: 50
    MergeRulesConfigurationNone:
      type: object
      description: The merge rules are disabled, change requests can be merged without review.
      properties:
        type:
          type: string
          enum:
          - none
      required:
      - type
    GitSyncOperationState:
      type: string
      description: '* `running`: The operation is still running

        * `failure`: The operation failed

        * `success`: The operation was successful

        * `timeout`: The operation timed out

        '
      enum:
      - running
      - failure
      - success
      - timeout
    URL:
      type: string
      format: uri
      maxLength: 2048
    ContentImportTarget:
      type: object
      properties:
        space:
          type: string
          description: ID of the space to import in
        changeRequest:
          type: string
          description: ID of the change request to import in
        page:
          type: string
          description: ID of the page to import in
      required:
      - space
    SpaceEditMode:
      type: string
      description: 'Determines how a Space can be edited.

        * `live`: Users can directly edit the space

        * `locked`: All edits are locked for this space.

        '
      enum:
      - live
      - locked
    TranslationLanguage:
      type: string
      enum:
      - en
      - fr
      - de
      - es
      - it
      - pt
      - pt-br
      - ru
      - ja
      - zh
      - zh-tw
      - yue
      - ko
      - ar
      - hi
      - nl
      - pl
      - tr
      - sv
      - 'no'
      - da
      - fi
      - el
      - cs
      - hu
      - ro
      - th
      - vi
      - id
      - ms
      - he
      - uk
      - sk
      - bg
      - hr
      - lt
      - lv
      - et
      - sl
      - fr-ca
      - es-mx
      - es-419
    VisitorAuthIntegrationBackend:
      type: object
      title: Integration backend for authenticated access
      properties:
        backend:
          type: string
          description: Integration as backend for authenticated access
          enum:
          - integration
      required:
      - backend
    IntegrationContentInstallationBase:
      type: object
      description: Base properties of an installation of an integration on a site or space.
      properties:
        integration:
          description: Unique name identifier of the integration
          type: string
        installation:
          description: ID of the integration installation
          type: string
        status:
          $ref: '#/components/schemas/IntegrationInstallationStatus'
        configuration:
          description: Configuration of the integration for this site
          type: object
        externalIds:
          $ref: '#/components/schemas/IntegrationInstallationExternalIds'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the integration's installation in the API
              format: uri
            publicEndpoint:
              type: string
              description: Public HTTP endpoint for the integration's installation
              format: uri
            publicContentEndpoint:
              type: string
              description: Public endpoint serving the integration's rendered content (e.g. WebFrames), isolated from the cookie-bearing publicEndpoint origin. Equals publicEndpoint when no separate content origin is configured.
              format: uri
          required:
          - location
          - publicEndpoint
          - publicContentEndpoint
      required:
      - integration
      - installation
      - status
      - configuration
      - externalIds
      - urls
    SpaceEvent:
      allOf:
      - $ref: '#/components/schemas/InstallationEvent'
      - type: object
        description: Common properties for all events related to a specific space.
        properties:
          spaceId:
            type: string
            description: ID of the space
        required:
        - spaceId
    ContentKitText:
      type: object
      description: Low level text element.
      properties:
        type:
          type: string
          enum:
          - text
        style:
          type: string
          enum:
          - bold
          - italic
          - code
          - strikethrough
        children:
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - $ref: '#/components/schemas/ContentKitText'
              - $ref: '#/components/schemas/ContentKitLink'
      required:
      - type
      - children
    BlockReason:
      type: string
      description: A short description giving context on the reason for the block.
      minLength: 1
      maxLength: 255
    FetchEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - type: object
        description: Event representing an incoming HTTP request.
        properties:
          spaceId:
            type: string
            description: The space ID, if requests are specific to a single space
          siteId:
