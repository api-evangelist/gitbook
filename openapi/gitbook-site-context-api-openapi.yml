    SiteFindingAction:
      type: string
      description: "An action that moves a `broken-link` finding to another state. A finding's `actions` lists the ones it allows.\n  - `approve` makes the redirect GitBook drafted live, which resolves the finding.\n  - `reject` deletes the redirect GitBook drafted; the finding stays open and GitBook won't draft a fix for it again.\n  - `create-redirect` creates a redirect for its path with `createSiteRedirect`, prefilled with the suggestion; it resolves the finding.\n  - `mark-resolved` resolves it without a redirect: visitors still get a 404.\n  - `reopen` reopens it, deleting the live redirect at its path. For a fix GitBook applied, this undoes the fix and GitBook won't fix the link again.\n  - `ignore` dismisses it.\n  - `restore` reopens a dismissed finding.\n"
      enum:
      - approve
      - reject
      - create-redirect
      - mark-resolved
      - reopen
      - ignore
      - restore
