          $ref: '#/components/schemas/ChangeRequestChangeCounts'
        siteTopic:
          type: object
          description: Site topic the change request was created from, when it came from one.
          properties:
            site:
              type: string
              description: ID of the site associated with the change request.
            topic:
              type: string
              description: ID of the site topic associated with the change request.
            finding:
              type: string
              deprecated: true
              description: 'ID of the site finding the change request fixes. Use `siteFindings` instead: a change request can fix a finding without belonging to a topic, and this field is absent in that case.'
          required:
          - site
          - topic
