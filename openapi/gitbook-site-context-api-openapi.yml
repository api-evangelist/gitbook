openapi: 3.2.0
info:
  title: GitBook Site Context API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-context
  x-page-title: Site context
  x-page-description: Manage context records, connections, and topics for a docs site.
  x-parent: sites
  description: 'Manage the contextual records and topics used by your site to power AI experiences and insights.


    {% openapi-schemas spec="gitbook" schemas="ContextRecord,ContextConnection,SiteTopic,SiteFinding,SiteFindingPage" grouped="false" %}

    The Site Context objects

    {% endopenapi-schemas %}'
paths:
  /orgs/{organizationId}/sites/{siteId}/context-records:
    get:
      operationId: listSiteContextRecords
      summary: List all context records
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: type
        in: query
        description: Filter context records by type.
        schema:
          $ref: '#/components/schemas/ContextRecordType'
      - name: connector
        in: query
        description: Filter context records by connector type.
        schema:
          $ref: '#/components/schemas/ContextConnector'
      - name: connection
        in: query
        description: Filter context records by connection id.
        schema:
          type: string
      - name: topic
        in: query
        description: Filter context records by associated site topic ID.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ContextRecord'
    put:
      operationId: upsertSiteContextRecords
      summary: Create or update context records
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContextRecordInput'
      responses:
        '204':
          description: The context records have been created or updated
  /orgs/{organizationId}/sites/{siteId}/context-records/{siteContextRecordId}:
    get:
      operationId: getSiteContextRecordById
      summary: Get a context record
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextRecordId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRecord'
  /orgs/{organizationId}/sites/{siteId}/scans:
    get:
      operationId: listSiteScans
      summary: List all site scans
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: topic
        in: query
        description: Filter scans by associated site topic ID.
        schema:
          type: string
      - name: status
        in: query
        description: Filter scans by status.
        schema:
          $ref: '#/components/schemas/SiteScanStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteScan'
  /orgs/{organizationId}/sites/{siteId}/scans/{siteScanId}:
    get:
      operationId: getSiteScanById
      summary: Get a site scan by ID
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteScanId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteScan'
  /orgs/{organizationId}/sites/{siteId}/findings:
    get:
      operationId: listSiteFindings
      summary: List documentation issues GitBook has found on a site
      description: 'Lists the quality issues GitBook''s AI has identified on a site by comparing its content against real usage and external sources — content gaps, outdated or incorrect content, and broken or outbound links. Use this when asked to find, audit, or fix problems in a site''s docs. Only findings with status "open" need work; "candidate" ones have not been confirmed yet. A "broken-link" finding is fixed by a redirect rather than a content edit: pass its `brokenLinkAction` to createSiteRedirect. Fix the rest by opening a change request with its `siteFindingId` set, so merging the change request resolves it.'
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: topic
        in: query
        description: Filter findings by associated site topic ID.
        schema:
          type: string
      - name: question
        in: query
        description: Filter findings that reference the given site question ID as evidence.
        schema:
          type: string
      - name: status
        in: query
        description: Filter findings by status.
        schema:
          $ref: '#/components/schemas/SiteFindingStatus'
      - name: type
        in: query
        description: Filter findings by type. When multiple types are given, findings matching any of them are returned.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteFindingType'
      - name: url
        in: query
        description: 'Filter link findings whose URL contains this text: the broken path of a `broken-link` finding, or the checked URL of an `outbound-link-error` one. Findings of any other type never match, so this narrows the list to link findings on its own.'
        schema:
          type: string
      - name: severity
        in: query
        description: Filter findings by estimated severity.
        schema:
          $ref: '#/components/schemas/SiteFindingSeverity'
      - name: hasChangeRequests
        in: query
        description: Filter findings that have at least one associated change request.
        schema:
          type: boolean
      - name: state
        in: query
        description: Filter link findings by where they stand, for example `awaiting-approval` for broken links with a redirect GitBook drafted.
        schema:
          $ref: '#/components/schemas/SiteFindingState'
      - name: source
        in: query
        description: Filter findings by the source of their evidence. Each entry is either `connection:<connectionId>` (findings with at least one piece of evidence coming from the given connection) or `questions` (findings with at least one piece of evidence coming from a site question). When multiple entries are given, findings matching any of them are returned.
        schema:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/SiteTriageFilterQuestions'
            - $ref: '#/components/schemas/SiteTriageFilterConnections'
      - name: updatedAfter
        in: query
        description: Only return findings last updated at or after this date.
        schema:
          type: string
          format: date-time
      - name: updatedBefore
        in: query
        description: Only return findings last updated before this date.
        schema:
          type: string
          format: date-time
      - name: orderBy
        in: query
        description: Sort findings by the given field.
        schema:
          $ref: '#/components/schemas/SiteFindingOrderBy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteFinding'
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}:
    get:
      operationId: getSiteFindingById
      summary: Get details of a single documentation issue
      description: Retrieves the full detail of one documentation issue found by GitBook's AI. Use this after `listSiteFindings` to inspect a specific issue before deciding to fix, dismiss, or investigate it further.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFinding'
    patch:
      operationId: updateSiteFindingById
      summary: Resolve, dismiss, or reopen a documentation issue
      description: 'Changes the status of a documentation issue found by GitBook''s AI, typically after fixing it (for example via `triggerChangeRequestsForSiteFinding`) or dismissing it as not worth acting on. This does not edit any content itself — it only records the outcome. For a `broken-link` finding, use `applySiteFindingAction` instead: its status follows the redirects at its path.'
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/SiteFindingStatus'
              required:
              - status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFinding'
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}/change-requests:
    get:
      operationId: listChangeRequestsForSiteFinding
      summary: List content fixes already proposed for a documentation issue
      description: Lists the change requests created to fix a documentation issue. Use this to check whether an issue already has a pending or merged fix before triggering a new one.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '200':
          description: List of change requests linked to the site finding
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChangeRequest'
    post:
      operationId: triggerChangeRequestsForSiteFinding
      summary: Fix a documentation issue by generating a change request
      description: 'Starts GitBook''s AI on fixing a documentation issue directly: it drafts the content change and opens it as a change request for review, rather than editing content in place. This is the primary way to act on "fix issues/gaps/broken links in my docs" requests once `listSiteFindings` has surfaced the relevant findings. Processing is asynchronous; poll `listChangeRequestsForSiteFinding` for the resulting change request, then review and merge it with `submitOrMergeChangeRequest`.'
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '202':
          description: Site finding processing has been started
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}/pages:
    get:
      operationId: listPagesForSiteFinding
      summary: List the pages affected by a documentation issue
      description: Lists the site pages a documentation issue relates to. Use this to locate which page(s) to edit when fixing an issue manually instead of via `triggerChangeRequestsForSiteFinding`.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '200':
          description: List of pages linked to the site finding
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteFindingPage'
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}/questions:
    get:
      operationId: listQuestionsForSiteFinding
      summary: List the Ask-AI questions evidencing a documentation issue
      description: Lists the questions end users asked GitBook's Ask-AI assistant that were used as evidence for a documentation issue. Use this to see what users actually wanted to know before deciding how to fix the issue.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '200':
          description: List of questions linked to the site finding
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteQuestion'
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}/records:
    get:
      operationId: listRecordsForSiteFinding
      summary: List the source content evidencing a documentation issue
      description: Lists the context records that GitBook's AI used as evidence for a documentation issue. Use this to see what real-world signal led to the finding before deciding how to fix it.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      responses:
        '200':
          description: List of records linked to the site finding
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ContextRecord'
  /orgs/{organizationId}/sites/{siteId}/findings/{siteFindingId}/actions:
    post:
      operationId: applySiteFindingAction
      summary: Apply an action to a broken link
      description: Applies one of the `actions` a `broken-link` finding lists, with the site permission it gives. Returns 409 when the finding doesn't allow the action now.
      x-gitbook-mcp:
        destructive: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteFindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: '#/components/schemas/SiteFindingAction'
              required:
              - action
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFinding'
  /orgs/{organizationId}/sites/{siteId}/stats/findings:
    get:
      operationId: getSiteFindingStats
      summary: Get a summary of documentation issues found on a site
      description: Returns aggregate statistics about the documentation issues GitBook identified on a site. Accepts the same filters as `listSiteFindings`. Use this to answer "how healthy are my docs" before drilling into individual findings.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - name: topic
        in: query
        description: Filter findings by associated site topic ID.
        schema:
          type: string
      - name: status
        in: query
        description: Filter findings by status.
        schema:
          $ref: '#/components/schemas/SiteFindingStatus'
      - name: type
        in: query
        description: Filter findings by type. When multiple types are given, findings matching any of them are returned.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteFindingType'
      - name: severity
        in: query
        description: Filter findings by estimated severity.
        schema:
          $ref: '#/components/schemas/SiteFindingSeverity'
      - name: hasChangeRequests
        in: query
        description: Filter findings that have at least one associated change request.
        schema:
          type: boolean
      - name: source
        in: query
        description: Filter findings by the source of their evidence. Each entry is either `connection:<connectionId>` (findings with at least one piece of evidence coming from the given connection) or `questions` (findings with at least one piece of evidence coming from a site question). When multiple entries are given, findings matching any of them are counted.
        schema:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/SiteTriageFilterQuestions'
            - $ref: '#/components/schemas/SiteTriageFilterConnections'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFindingStats'
  /orgs/{organizationId}/sites/{siteId}/context-connections:
    get:
      operationId: listSiteContextConnections
      summary: List all context connections
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ContextConnection'
    post:
      operationId: createSiteContextConnection
      summary: Create a context connection
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContextConnectorSetup'
              - type: object
                properties:
                  usageSettings:
                    $ref: '#/components/schemas/ContextUsageSettings'
                  filter:
                    $ref: '#/components/schemas/ContextConnectionFilter'
      responses:
        '201':
          description: Created connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnection'
  /orgs/{organizationId}/sites/{siteId}/context-connections/{siteContextConnectionId}:
    get:
      operationId: getSiteContextConnectionById
      summary: Get a context connection
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextConnectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnection'
    patch:
      operationId: updateSiteContextConnectionById
      summary: Update a context connection
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ContextConnectorSetup'
              - type: object
                description: Update a Jira connection. Omit `setupSettings.apiToken` to keep the stored token.
                required:
                - connector
                - setupSettings
                properties:
                  connector:
                    type: string
                    enum:
                    - builtin:jira
                  label:
                    $ref: '#/components/schemas/ContextConnectionLabel'
                  setupSettings:
                    type: object
                    required:
                    - baseUrl
                    - apiEmail
                    properties:
                      baseUrl:
                        $ref: '#/components/schemas/baseUrl'
                      apiEmail:
                        $ref: '#/components/schemas/apiEmail'
                      apiToken:
                        $ref: '#/components/schemas/apiToken'
                      projectKeys:
                        $ref: '#/components/schemas/projectKeys'
                      statusMapping:
                        $ref: '#/components/schemas/statusMapping'
              - type: object
                properties:
                  usageSettings:
                    $ref: '#/components/schemas/ContextUsageSettings'
                  label:
                    $ref: '#/components/schemas/ContextConnectionLabel'
                  filter:
                    $ref: '#/components/schemas/ContextConnectionFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnection'
    delete:
      operationId: deleteSiteContextConnectionById
      summary: Delete a context connection
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextConnectionId'
      responses:
        '204':
          description: Context connection did not exist
        '205':
          description: Context connection deleted
  /orgs/{organizationId}/sites/{siteId}/context-connections/{siteContextConnectionId}/sync:
    post:
      operationId: syncSiteContextConnection
      summary: Trigger a sync for a context connection
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextConnectionId'
      responses:
        '204':
          description: Sync started
        '400':
          description: Connection was synced less than an hour ago or invalid connector
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/sites/{siteId}/context-connections/{siteContextConnectionId}/test:
    post:
      operationId: testSiteContextConnection
      summary: Test a context connection's stored credentials
      description: 'Verifies the stored credentials of a context connection against the external service, without changing anything. A failed verification is reported in the response body with `success` set to `false` rather than as an HTTP error. Connectors that have nothing to verify report `success: true`.'
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteContextConnectionId'
      responses:
        '200':
          description: The connection test completed (see `success` for the outcome).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnectionTestResult'
  /orgs/{organizationId}/sites/{siteId}/topics:
    get:
      operationId: listSiteTopics
      summary: List all topics
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - name: from
        in: query
        description: Filter stats to answers created at or after this timestamp.
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        description: Filter stats to answers created at or before this timestamp.
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: relevance
        in: query
        description: Filter stats by question relevance.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteQuestionAnswerRelevance'
      - name: channelType
        in: query
        description: Filter stats by answer channel type.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteChannelType'
      - name: answered
        in: query
        description: Filter stats by answer resolution.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteQuestionAnswerResolution'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteTopic'
  /orgs/{organizationId}/sites/{siteId}/topics/{siteTopicId}:
    get:
      operationId: getSiteTopicById
      summary: Get a topic
      description: Retrieves a single topic of a site by its ID, including its label, its parent topic when it is a subtopic, its summary and usage settings, and its page, record, finding and Ask AI question counts. Use this when you have a topic ID and need the topic's label or its stats.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteTopicId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteTopic'
    patch:
      operationId: updateSiteTopicById
      summary: Update a topic
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteTopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usageSettings:
                  $ref: '#/components/schemas/SiteTopicUsageSettings'
              required:
              - usageSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteTopic'
  /orgs/{organizationId}/sites/{siteId}/topics/{siteTopicId}/findings:
    delete:
      operationId: deleteSiteTopicFindings
      summary: Delete all documentation issues found under a topic
      description: Permanently deletes every finding associated with a site topic, regardless of status. This is a bulk, irreversible cleanup operation — use `updateSiteFindingById` to resolve or dismiss individual issues instead unless the intent is to wipe every issue under a topic, for example when the topic itself is being removed.
      x-gitbook-mcp: true
      tags:
      - site-context
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteTopicId'
      responses:
        '204':
          description: Topic had no findings or did not exist
        '205':
          description: Topic findings deleted
