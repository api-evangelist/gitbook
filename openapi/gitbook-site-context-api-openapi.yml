    SiteFindingOutboundLink:
      type: object
      description: 'Details of an `outbound-link-error` finding: the failing external URL, or the domain when it doesn''t resolve, and the observed failure, sourced from the site''s outbound link checks. A resolved finding has either `url` or `host` and no other field. Absent on findings of any other type.'
      properties:
        url:
          type: string
          format: uri
          description: The external URL that fails. Absent when `host` is set.
        host:
          type: string
          description: The domain that doesn't resolve, set instead of `url` when the finding covers every link to that domain on the site.
        status:
          type: string
          description: Current health status of the URL or domain for this site.
          enum:
          - pending
          - healthy
          - suspect
          - failed
          - recovering
          - canceled
        failureKind:
          type: string
          description: Classification of the confirmed failure.
          enum:
          - client-error
          - server-error
          - redirect
          - dns
          - tls
          - connection
          - timeout
        httpStatus:
          type: number
          description: HTTP status code of the last observation, when one was received.
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the URL or domain was last observed.
