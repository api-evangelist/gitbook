openapi: 3.2.0
info:
  title: GitBook Translations API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: Translations
  x-page-icon: language
  x-page-title: Translations
  x-page-description: Configure multi-language support and translation options for your documentation.
  description: The Translations API provides ways to localize your content into various languages. It supports custom strings, default language settings, and more.
paths:
  /orgs/{organizationId}/translations:
    get:
      operationId: listTranslations
      summary: List all the translations
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Translation'
    post:
      operationId: createTranslation
      summary: Create a translation
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  $ref: '#/components/schemas/TranslationSource'
                language:
                  $ref: '#/components/schemas/TranslationLanguage'
                instructions:
                  $ref: '#/components/schemas/JSONDocument'
              required:
              - language
              - source
      responses:
        '201':
          description: Translation has been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/translations/{translationId}:
    get:
      operationId: getTranslation
      summary: Get a translation by its ID
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/translationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '404':
          description: No matching translation found
          $ref: '#/components/responses/NotFoundError'
    put:
      operationId: updateTranslation
      summary: Update a translation
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/translationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - instructions
              properties:
                instructions:
                  $ref: '#/components/schemas/JSONDocument'
      responses:
        '200':
          description: Translation has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/BadRequestError'
    delete:
      operationId: deleteTranslation
      summary: Delete a translation
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/translationId'
      responses:
        '204':
          description: Translation did not exist
        '205':
          description: Translation has been deleted
  /orgs/{organizationId}/translations/{translationId}/run:
    post:
      operationId: runTranslation
      summary: Run a translation again
      tags:
      - Translations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/translationId'
      responses:
        '204':
          description: Translation run triggered
        '404':
          description: No matching translation found
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentFragment:
      type: object
      properties:
        object:
          type: string
          enum:
          - fragment
        key:
          type: string
        fragment:
          type: string
        type:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlock'
      required:
      - object
      - nodes
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockListItem'
      - $ref: '#/components/schemas/DocumentBlockDivider'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockImage'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockCodeLine'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTabsItem'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockStepperStep'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockColumn'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
      - $ref: '#/components/schemas/DocumentBlockUpdate'
    DocumentInlineAnnotation:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - annotation
        key:
          type: string
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - annotation-body
                nodes:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/DocumentBlocksEssentials'
                    - $ref: '#/components/schemas/DocumentBlockCode'
                  minItems: 1
              required:
              - nodes
              - type
        isVoid:
          type: boolean
          enum:
          - false
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentText'
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - fragments
      - isVoid
      - nodes
    DocumentBlocksTopLevels:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlocksEssentials'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
    DocumentBlockEmbed:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - embed
        key:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
            fullWidth:
              type: boolean
          required:
          - url
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockReusableContent:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - reusable-content
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              $ref: '#/components/schemas/ContentRefReusableContent'
          required:
          - ref
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              description: A content token that can be used to fetch the reusable content from the API.
              type: string
      required:
      - object
      - type
      - data
      - isVoid
    Translation:
      type: object
      properties:
        object:
          type: string
          enum:
          - translation
        id:
          type: string
          description: Unique identifier of the translation sync
        status:
          $ref: '#/components/schemas/TranslationStatus'
        source:
          $ref: '#/components/schemas/TranslationSource'
        language:
          $ref: '#/components/schemas/TranslationLanguage'
        instructions:
          $ref: '#/components/schemas/JSONDocument'
        result:
          $ref: '#/components/schemas/TranslationResult'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stats:
          type: object
          properties:
            runs:
              type: integer
              description: Total number of times the translation has been run
            totalWords:
              type: integer
              description: Total number of words counted toward translation usage over all runs
            totalPages:
              type: integer
              description: Total number of unique pages translated
            totalDuration:
              type: integer
              description: Total duration of all runs (in seconds)
            latestRunDuration:
              type: integer
              description: Duration of the latest run (in seconds)
            latestPages:
              type: integer
              description: Number of unique pages translated in the latest run
            latestWords:
              type: integer
              description: Number of words counted toward translation usage in the latest run
          required:
          - runs
          - totalWords
          - totalPages
          - totalDuration
          - latestRunDuration
          - latestPages
          - latestWords
        permissions:
          type: object
          properties:
            view:
              type: boolean
              description: Whether the user can view the object
            edit:
              type: boolean
              description: Whether the user can edit the object
          required:
          - view
          - edit
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the translation settings in the API
              format: uri
          required:
          - location
      required:
      - object
      - id
      - status
      - source
      - language
      - instructions
      - createdAt
      - updatedAt
      - stats
      - permissions
      - urls
    DocumentTableDefinitionFiles:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - files
        required:
        - type
    DocumentMarkSubscript:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - subscript
      required:
      - object
      - type
    ContentRefTag:
      type: object
      properties:
        kind:
          type: string
          enum:
          - tag
        tag:
          type: string
          description: The slug of the tag, also used as the ID, and references the tags defined on a revision.
        space:
          type: string
          description: The space in which the tag is defined. If undefined, the tag is assumed to be in the same space as the content reference.
      required:
      - kind
      - tag
    OpenAPIWebhookPointer:
      type: object
      description: Pointer to a webhook in the OpenAPI spec.
      properties:
        name:
          type: string
          description: Name of the webhook in the OpenAPI spec.
        method:
          type: string
          description: HTTP method of the webhook in the OpenAPI spec.
      required:
      - name
      - method
    DocumentBlockOpenAPI:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - swagger
        key:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/OpenAPIOperationPointer'
          - type: object
            properties:
              ref:
                oneOf:
                - $ref: '#/components/schemas/ContentRefFile'
                - $ref: '#/components/schemas/ContentRefURL'
              expanded:
                type: boolean
                description: If true, the block is opened by default.
              fullWidth:
                type: boolean
            required:
            - ref
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            id:
              description: Unique ID to be used in an URL for the block.
              type: string
          required:
          - id
      required:
      - object
      - type
      - data
