openapi: 3.2.0
info:
  title: GitBook URLs API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: URLs
  x-page-icon: link
  x-page-title: URLs
  x-page-description: Configure where and how your GitBook content can be accessed.
  description: Manage official endpoints, direct deep links, or short links for your content. This allows you to keep track of multiple custom URLs or vanity links under one system.
paths:
  /urls/content:
    get:
      operationId: getContentByUrl
      summary: Resolve a URL to a content (space, collection, page)
      tags:
      - URLs
      security:
      - user: []
      - integration: []
      - integration-installation: []
      parameters:
      - name: url
        in: query
        required: true
        description: URL to resolve
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: URL resolved to a collection
                  properties:
                    collection:
                      $ref: '#/components/schemas/Collection'
                  required:
                  - collection
                - type: object
                  description: URL resolved to the content of a space
                  properties:
                    space:
                      $ref: '#/components/schemas/Space'
                    changeRequest:
                      $ref: '#/components/schemas/ChangeRequest'
                    page:
                      oneOf:
                      - $ref: '#/components/schemas/RevisionPageDocument'
                      - $ref: '#/components/schemas/RevisionPageGroup'
                  required:
                  - space
  /urls/embed:
    get:
      operationId: getEmbedByUrl
      summary: Resolve a URL to an embed
      tags:
      - URLs
      parameters:
      - name: url
        in: query
        required: true
        description: URL to resolve
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Embed'
  /urls/published:
    get:
      operationId: getPublishedContentByUrl
      summary: Resolve a URL of a published content
      deprecated: true
      tags:
      - URLs
      parameters:
      - name: url
        in: query
        required: true
        description: URL to resolve
        schema:
          $ref: '#/components/schemas/URL'
      - name: visitorAuthToken
        in: query
        required: false
        description: JWT token generated for a authenticated access session
        schema:
          type: string
      - name: redirectOnError
        in: query
        required: false
        description: When true redirects the user to the authentication/fallback URL if the access token is invalid
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedSiteContentLookup'
        '404':
          description: No content found for the URL.
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: resolvePublishedContentByUrl
      summary: Resolve a URL of a published content
      tags:
      - URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  description: URL to resolve
                  $ref: '#/components/schemas/URL'
                redirectOnError:
                  type: boolean
                  description: When true redirects the user to the authentication/fallback URL if the access token is invalid
                  default: false
                visitor:
                  $ref: '#/components/schemas/SiteVisitorPayload'
              required:
              - url
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedSiteContentLookup'
        '404':
          description: No content found for the URL.
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    RevisionPageLayoutOptionsCoverMask:
      type: string
      description: Mask applied to the cover image.
      enum:
      - none
      - radial
    ChangeRequestChangeCounts:
      type: object
      description: Exact semantic entity and page-document block counts for a change request at its current head and base revisions.
      properties:
        pages:
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        library:
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        blocks:
          description: Nested user-visible page-document block counts. Absent when `blocksOmittedReason` is set.
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        blocksOmittedReason:
          type: string
          enum:
          - too-many-pages
          - too-many-blocks
          - timeout
          description: 'Why `blocks` is absent: too many pages changed (`too-many-pages`), the changed pages hold too many blocks to compare within the counting budget (`too-many-blocks`; this is not a count of changed blocks), or counting ran out of time (`timeout`). Page and library counts are still exact.'
      required:
      - pages
      - library
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    ComputedContentSourceRevision:
      oneOf:
      - $ref: '#/components/schemas/ComputedContentSourceRevisionOpenAPI'
      - $ref: '#/components/schemas/ComputedContentSourceRevisionTranslation'
      - $ref: '#/components/schemas/ComputedContentSourceIntegration'
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    MarkdownDocument:
      type: object
      properties:
        markdown:
          type: string
          description: Content of the document formatted as markdown
          example: '# Hello World


            This is a markdown document linking to [another page](/pages/page_id).

            '
      required:
      - markdown
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentFragment:
      type: object
      properties:
        object:
          type: string
          enum:
          - fragment
        key:
          type: string
        fragment:
          type: string
        type:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlock'
      required:
      - object
      - nodes
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    ComputedContentDependencySpace:
      type: object
      properties:
        ref:
          $ref: '#/components/schemas/ContentRefSpace'
        value:
          type:
          - object
          - 'null'
          description: See `Space` schema component.
          properties:
            object:
              type: string
              enum:
              - space
            id:
              type: string
            revision:
              type: string
          required:
          - object
          - id
          - revision
      required:
      - ref
      - value
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    MergeRulesSpaceConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationInherit'
      - $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
    GitSyncOperationErrorAction:
      type: object
      description: An action the user can take to resolve a failed Git Sync operation.
      properties:
        label:
          type: string
          description: Label for the action.
        url:
          type: string
          format: uri
          description: URL where the user can resolve the failure.
      required:
      - label
      - url
    URL:
      type: string
      format: uri
      maxLength: 2048
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockListItem'
      - $ref: '#/components/schemas/DocumentBlockDivider'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockImage'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockCodeLine'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTabsItem'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockStepperStep'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockColumn'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
      - $ref: '#/components/schemas/DocumentBlockUpdate'
    DocumentInlineAnnotation:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - annotation
        key:
          type: string
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - annotation-body
                nodes:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/DocumentBlocksEssentials'
                    - $ref: '#/components/schemas/DocumentBlockCode'
                  minItems: 1
              required:
              - nodes
              - type
        isVoid:
          type: boolean
          enum:
          - false
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentText'
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - fragments
      - isVoid
      - nodes
    ComputedContentSourceRevisionOpenAPI:
      allOf:
      - $ref: '#/components/schemas/ComputedContentSourceOpenAPIBase'
      - type: object
        description: Parameters for an OpenAPI computed revision
        required:
        - props
        properties:
          props:
            type: object
            properties:
              models:
                type: boolean
              downloadLink:
                type: boolean
                description: Whether to show a link to download the OpenAPI spec.
              grouping:
                type: string
                enum:
                - by-tag
                - by-operation
                description: How GitBook will group generated pages. "by-tag" groups operations under their tag; "by-operation" creates a separate page per operation. Defaults to "by-tag" when absent.
            required:
            - models
    VisitorAuthIntegrationBackend:
      type: object
      title: Integration backend for authenticated access
      properties:
        backend:
          type: string
          description: Integration as backend for authenticated access
          enum:
          - integration
      required:
      - backend
    DocumentBlocksTopLevels:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlocksEssentials'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
    DocumentBlockEmbed:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - embed
        key:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
            fullWidth:
              type: boolean
          required:
          - url
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockReusableContent:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - reusable-content
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              $ref: '#/components/schemas/ContentRefReusableContent'
          required:
          - ref
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              description: A content token that can be used to fetch the reusable content from the API.
              type: string
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionFiles:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
