openapi: 3.2.0
info:
  title: GitBook Site Ask API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-ask
  x-page-title: Site AI ask
  x-page-description: Allow AI-driven queries within a specific docs site.
  x-parent: sites
  description: Give your users a way to ask content-aware AI queries that are scoped entirely to the site's published documents.
paths:
  /orgs/{organizationId}/sites/{siteId}/ask:
    post:
      operationId: streamAskInSite
      summary: Ask a question in a site
      description: The response is streamed.
      tags:
      - site-ask
      security:
      - user: []
      - oauth:
        - site:ask
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/documentFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question
              - scope
              properties:
                question:
                  type: string
                  maxLength: 512
                context:
                  type: object
                  description: 'You may optionally provide additional information about the context of the question. This doesn''t affect the scope of the search, but GitBook may use this information to provide a better answer. Generally speaking, you should provide as much context as possible.

                    '
                  properties:
                    siteSpaceId:
                      type: string
                    goal:
                      description: 'The end goal the agent is trying to accomplish on behalf of the user. Unlike the question, which is the immediate query, the goal describes the broader task or outcome the agent is working towards. GitBook uses this to steer the answer towards what is ultimately useful for that goal.

                        '
                      $ref: '#/components/schemas/AgentGoal'
                scope:
                  $ref: '#/components/schemas/SiteSearchScope'
                session:
                  $ref: '#/components/schemas/SiteInsightsSession'
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SearchAIAnswerStream'
  /orgs/{organizationId}/sites/{siteId}/ask/questions:
    get:
      operationId: streamRecommendedQuestionsInSite
      summary: List recommended questions to ask in a site
      description: The response is streamed.
      tags:
      - site-ask
      security:
      - user: []
      - oauth:
        - site:ask
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - name: siteSpaceId
        in: query
        description: The ID of the site space to filter the recommended questions for.
        schema:
          type: string
      - name: spaceId
        in: query
        description: The ID of the space to filter the recommended questions for.
        deprecated: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SearchAIRecommendedQuestionStream'
components:
  schemas:
    SearchAIAnswerStream:
      type: object
      properties:
        type:
          type: string
          enum:
          - answer
        answer:
          $ref: '#/components/schemas/SearchAIAnswer'
      required:
      - type
      - answer
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    MarkdownDocument:
      type: object
      properties:
        markdown:
          type: string
          description: Content of the document formatted as markdown
          example: '# Hello World


            This is a markdown document linking to [another page](/pages/page_id).

            '
      required:
      - markdown
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockListItem'
      - $ref: '#/components/schemas/DocumentBlockDivider'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockImage'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockCodeLine'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTabsItem'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockStepperStep'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockColumn'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
      - $ref: '#/components/schemas/DocumentBlockUpdate'
    DocumentInlineAnnotation:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - annotation
        key:
          type: string
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - annotation-body
                nodes:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/DocumentBlocksEssentials'
                    - $ref: '#/components/schemas/DocumentBlockCode'
                  minItems: 1
              required:
              - nodes
              - type
        isVoid:
          type: boolean
          enum:
          - false
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentText'
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - fragments
      - isVoid
      - nodes
    DocumentBlocksTopLevels:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlocksEssentials'
      - $ref: '#/components/schemas/DocumentBlockQuote'
      - $ref: '#/components/schemas/DocumentBlockHint'
      - $ref: '#/components/schemas/DocumentBlockPrompt'
      - $ref: '#/components/schemas/DocumentBlockImages'
      - $ref: '#/components/schemas/DocumentBlockFile'
      - $ref: '#/components/schemas/DocumentBlockDrawing'
      - $ref: '#/components/schemas/DocumentBlockEmbed'
      - $ref: '#/components/schemas/DocumentBlockCode'
      - $ref: '#/components/schemas/DocumentBlockMath'
      - $ref: '#/components/schemas/DocumentBlockExpandable'
      - $ref: '#/components/schemas/DocumentBlockTabs'
      - $ref: '#/components/schemas/DocumentBlockTable'
      - $ref: '#/components/schemas/DocumentBlockOpenAPI'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIOperation'
      - $ref: '#/components/schemas/DocumentBlockOpenAPISchemas'
      - $ref: '#/components/schemas/DocumentBlockOpenAPIWebhook'
      - $ref: '#/components/schemas/DocumentBlockContentRef'
      - $ref: '#/components/schemas/DocumentBlockIntegration'
      - $ref: '#/components/schemas/DocumentBlockReusableContent'
      - $ref: '#/components/schemas/DocumentBlockStepper'
      - $ref: '#/components/schemas/DocumentBlockIf'
      - $ref: '#/components/schemas/DocumentBlockColumns'
      - $ref: '#/components/schemas/DocumentBlockUpdates'
    DocumentBlockEmbed:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - embed
        key:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
            fullWidth:
              type: boolean
          required:
          - url
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockReusableContent:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - reusable-content
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              $ref: '#/components/schemas/ContentRefReusableContent'
          required:
          - ref
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              description: A content token that can be used to fetch the reusable content from the API.
              type: string
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionFiles:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - files
        required:
        - type
    DocumentMarkSubscript:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - subscript
      required:
      - object
      - type
    ContentRefTag:
      type: object
      properties:
        kind:
          type: string
          enum:
          - tag
        tag:
          type: string
          description: The slug of the tag, also used as the ID, and references the tags defined on a revision.
        space:
          type: string
          description: The space in which the tag is defined. If undefined, the tag is assumed to be in the same space as the content reference.
      required:
      - kind
      - tag
    OpenAPIWebhookPointer:
      type: object
      description: Pointer to a webhook in the OpenAPI spec.
      properties:
        name:
          type: string
          description: Name of the webhook in the OpenAPI spec.
        method:
          type: string
          description: HTTP method of the webhook in the OpenAPI spec.
      required:
      - name
      - method
    DocumentBlockOpenAPI:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - swagger
        key:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/OpenAPIOperationPointer'
          - type: object
            properties:
              ref:
                oneOf:
                - $ref: '#/components/schemas/ContentRefFile'
                - $ref: '#/components/schemas/ContentRefURL'
              expanded:
                type: boolean
                description: If true, the block is opened by default.
              fullWidth:
                type: boolean
            required:
            - ref
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            id:
              description: Unique ID to be used in an URL for the block.
              type: string
          required:
          - id
      required:
      - object
      - type
      - data
      - isVoid
    ContentRefCollection:
      type: object
      properties:
        kind:
          type: string
          enum:
          - collection
        collection:
          type: string
      required:
      - kind
      - collection
    DocumentTableDefinitionContentRef:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - content-ref
        required:
        - type
    DocumentBlockQuote:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - blockquote
        key:
          type: string
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    SiteInsightsSession:
      type: object
      description: Identifiers for a GitBook site session, used for analytics and adaptive content.
      properties:
        visitorId:
          type: string
          description: GitBook's unique identifier of the visitor.
        sessionId:
          type: string
          description: GitBook's unique identifier of the visitor's session.
      required:
      - visitorId
      - sessionId
    DocumentBlockTable:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - table
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties:
            view:
              oneOf:
              - $ref: '#/components/schemas/DocumentTableViewGrid'
              - $ref: '#/components/schemas/DocumentTableViewCards'
            records:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/DocumentTableRecord'
            definition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/DocumentTableDefinition'
            cellMerges:
              type: array
              description: Positional table cell merge ranges. The current document model retains only non-overlapping horizontal or vertical merges between adjacent Text or Number body cells. Anchors and spans are resolved against the table's current sorted record order and visible column order.
              items:
                $ref: '#/components/schemas/DocumentTableCellMerge'
            fullWidth:
              type: boolean
              description: Whether to render the block as a full width one
            search:
