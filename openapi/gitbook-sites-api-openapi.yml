      description: 'A notice about the organization''s subscription to relay to the user, such as how many days are left in their trial. It is returned by the operations whose features may require a paid plan once a trial ends.

        '
      properties:
        type:
          type: string
          description: '- trial_started, the operation started the organization''s trial. - trial_countdown, the organization''s trial ends soon. - checkout_required, the operation needs a paid plan to complete.

            '
          enum:
          - trial_started
          - trial_countdown
          - checkout_required
        context:
          type: string
          description: What the user was doing when the notice was given.
          enum:
          - trial_started
          - site_publishing
          - site_features
          - site_customization
        commercialStatus:
          type: string
          description: Whether the organization is on a trial, the free plan, or a paid plan.
          enum:
          - trial
          - free
          - paid
        message:
