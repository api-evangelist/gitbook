openapi: 3.2.0
info:
  title: GitBook Sites API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: Sites
  x-page-icon: globe
  x-page-title: Docs sites
  x-page-description: Manage your published docs sites.
  description: 'The Docs Sites API lets you programmatically manage published documentation sites within your organization. You can list and update all sites created under a specific organization, making it easy to audit or interact with site metadata at scale.


    {% openapi-schemas spec="gitbook" schemas="Site" grouped="false" %}

    The Site object

    {% endopenapi-schemas %}'
paths:
  /orgs/{organizationId}/sites:
    get:
      operationId: listSites
      summary: List all documentation sites in an organization
      description: Returns a paginated list of all documentation sites belonging to the organization. Use this to discover available sites before fetching their content, settings, or structure. Members with access only to individual spaces receive the sites that use those spaces as site items, with site administration fields omitted.
      x-gitbook-mcp:
        curatedBy: list_sites
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: space
        in: query
        description: Identifier of the space to filter the sites by
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: Filter sites by their title
        required: false
        schema:
          type: string
      - name: published
        in: query
        description: Filter sites by their published status
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: Filter by site type
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Site'
    post:
      operationId: createSite
      summary: Create a new documentation site in an organization
      description: Creates a new documentation site within the organization. Optionally links one or more existing spaces as content sources at creation time. The site is created in an unpublished state; call the publish endpoint separately to make it publicly accessible.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  description: "The type of the site. Defaults to:\n  - Sponsored for community organizations\n  - Ultimate for all other organizations"
                  $ref: '#/components/schemas/SiteType'
                title:
                  $ref: '#/components/schemas/SiteTitle'
                visibility:
                  $ref: '#/components/schemas/SiteVisibility'
                spaces:
                  type: array
                  description: ID of spaces to be added to the site
                  items:
                    type: string
      responses:
        '201':
          description: Site created
          headers:
            Location:
              description: API URL for the newly created site
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
  /orgs/{organizationId}/sites/{siteId}:
    get:
      operationId: getSiteById
      summary: Get a documentation site by its ID
      description: Retrieves full details for a single documentation site. Use this to inspect a specific site's metadata before reading or modifying its settings, structure, or content. Members with access only through a linked space can retrieve a limited site summary; site administration fields are omitted.
      x-gitbook-mcp: true
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          description: No matching site found
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateSiteById
      summary: Update the properties of a documentation site
      description: Updates a documentation site's configuration. Use this to rename a site, change its access level, or point it at a reverse-proxy path such as https://company.com/docs.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/SiteTitle'
                visibility:
                  $ref: '#/components/schemas/SiteVisibility'
                basename:
                  $ref: '#/components/schemas/SiteBasename'
                adaptiveContent:
                  $ref: '#/components/schemas/SiteAdaptiveContent'
                defaultLevel:
                  $ref: '#/components/schemas/DefaultLevel'
                defaultSiteSpace:
                  type: string
                  description: ID of the site-space to be used as the default at the root level. If site has sections, this will mark the default site space in the site's default section.
                defaultSiteSection:
                  type: string
                  description: ID of the site-section to be used as the default.
                proxy:
                  description: 'Configure a proxy URL for a site. For example, you can use it to host the site on a subdirectory of your domain like `https://company.com/docs`.

                    Use `null` to remove the proxy.

                    '
                  oneOf:
                  - $ref: '#/components/schemas/SiteProxyOrigin'
                  - type: 'null'
                styleguide:
                  description: 'Attach an existing style guide to the site by the ID of the style guide space, or `null` to detach the current one. The space must be a style guide owned by the same organization.

                    '
                  oneOf:
                  - type: string
                  - type: 'null'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      operationId: deleteSiteById
      summary: Delete a site
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '204':
          description: Site did not exist
        '205':
          description: Site has been deleted
  /orgs/{organizationId}/sites/{siteId}/adaptive-schema:
    get:
      operationId: getSiteAdaptiveSchema
      summary: Get the visitor attributes JSON schema for an adaptive content site
      description: Returns the JSON schema that defines the visitor attributes expected by an adaptive content site. Adaptive content uses these attributes (e.g., user role, plan tier) to conditionally show or hide content sections. Use this to understand what visitor data must be provided when rendering adaptive content.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: The JSON schema that defines the attributes expected from a visitor of the Adaptive content site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAdaptiveSchema'
        '404':
          description: No visitor attributes schema found for the site.
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      operationId: updateSiteAdaptiveSchema
      summary: Update the visitor attributes JSON schema for an adaptive content site
      description: Replaces the JSON schema that defines expected visitor attributes for adaptive content. The schema controls which attributes (e.g., role, subscription tier) can be used in conditional expressions to show or hide content for specific visitors. After updating, existing conditional expressions are evaluated against the new schema.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonSchema:
                  description: The JSON schema to set on the site. `regions` is only accepted for organizations with regions enabled.
                  $ref: '#/components/schemas/SiteAdaptiveJSONSchemaWithRegions'
              required:
              - jsonSchema
      responses:
        '200':
          description: The site adaptive schema has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAdaptiveSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orgs/{organizationId}/sites/{siteId}/adaptive-schema/template-conditions:
    get:
      operationId: listSiteAdaptiveTemplateConditions
      summary: List condition templates for adaptive content expressions in a site
      description: Returns pre-generated condition templates derived from the site's visitor attributes schema. These templates can be used as building blocks when writing adaptive content expressions to conditionally show or hide content for different visitor types. Use this to discover available conditions before authoring adaptive rules.
      x-gitbook-mcp: true
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: List of template conditions generated based on the site visitor schema.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteAdaptiveTemplateCondition'
                required:
                - items
  /orgs/{organizationId}/sites/{siteId}/published:
    get:
      operationId: getPublishedContentSite
      summary: Get the full published profile of a site including structure and customization
      description: Returns the complete profile needed to render the published experience of a site. Use this when building a site renderer or preview rather than fetching each resource individually.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteShareKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedContentSite'
        '404':
          description: No matching site found
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/sites/{siteId}/publish:
    post:
      operationId: publishSite
      summary: Publish a site to make it publicly accessible
      description: Makes the site publicly accessible at its configured URL by publishing it. If the organization's plan requires an upgrade, the response includes a Stripe checkout session ID instead of the site object. Use unpublish to take the site offline again.
      x-gitbook-mcp:
        destructive: true
        idempotent: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:publish
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Site published successfully
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Site'
                  - type: object
                    properties:
                      subscriptionNotice:
                        $ref: '#/components/schemas/SubscriptionNotice'
                - type: object
                  description: User needs to checkout in order to publish the site.
                  properties:
                    type:
                      type: string
                      enum:
                      - checkout
                    sessionId:
                      type: string
                      description: Stripe payment session ID
                    subscriptionNotice:
                      $ref: '#/components/schemas/SubscriptionNotice'
                  required:
                  - type
                  - sessionId
  /orgs/{organizationId}/sites/{siteId}/setup:
    get:
      operationId: getSiteSetup
      summary: Get the setup steps of a site
      description: Lists the steps to set up a site, from a first edit to publishing, and whether each one is completed. Use it to know what is left to do on a site. Returns no steps once the site has been published.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSetup'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/sites/{siteId}/unpublish:
    post:
      operationId: unpublishSite
      summary: Take a site offline by unpublishing it
      description: Removes the site from public access by unpublishing it. The site's configuration and content are preserved; use the publish endpoint to make it accessible again. Use this when you need to temporarily hide a site or take it down for maintenance.
      x-gitbook-mcp:
        destructive: true
        idempotent: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:publish
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Site unpublished successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
  /orgs/{organizationId}/sites/{siteId}/structure/sort:
    patch:
      operationId: sortSiteStructure
      summary: Move a site structure item to a new position
      description: Reorders a site space, section, section group, or external link relative to any sibling at the same structure level. Sorting changes sibling order only; move an item between the root and a group through that item's update operation first.
      x-gitbook-mcp: true
      x-gitbook-return-preference: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/returnPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  description: Pointer to the site space, section, section group, or external link being moved.
                  $ref: '#/components/schemas/SiteStructureItemPointer'
                position:
                  description: The position to move the item to. When not provided the item is moved to the end of the site structure.
                  $ref: '#/components/schemas/SiteStructureItemMovePosition'
              required:
              - item
              - position
      responses:
        '200':
          description: Item successfully moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteStructureItem'
        '204':
          description: Item moved without returning its representation
          headers:
            Preference-Applied:
              $ref: '#/components/headers/returnPreferenceApplied'
        '400':
          description: Invalid move position provided
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: No matching item found
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orgs/{organizationId}/sites/{siteId}/integration-scripts:
    get:
      operationId: listSiteIntegrationScripts
      summary: List custom scripts injected into a site's published pages
      description: Returns all integration scripts configured to be injected into the published pages of a site, such as analytics trackers, chat widgets, or custom JavaScript. Use this to audit which third-party scripts are active on the site.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteIntegrationScript'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/sites/{siteId}/integrations:
    get:
      operationId: listSiteIntegrations
      summary: List third-party integrations enabled on a site
      description: Returns a paginated list of integrations currently enabled on the site. Integrations extend site functionality with third-party services such as analytics, support, or authentication providers. Use this to audit which integrations are active, or to find an integration before updating its settings.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/integrationSearchQuery'
      responses:
        '200':
          description: Listing of integrations enabled in the site.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Integration'
  /orgs/{organizationId}/sites/{siteId}/search:
    post:
      operationId: searchSiteContent
      summary: Full-text search across all content in a site
      description: Performs a full-text search across all published spaces in the site and returns matching pages with relevant excerpts. Use the scope parameter to restrict the search to specific site spaces or sections. Prefer this over the space-level search when you need to search across a multi-section site in one call.
      x-gitbook-mcp:
        readOnly: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:search
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - query
                properties:
                  query:
                    type: string
                    maxLength: 512
              - oneOf:
                - type: object
                  required:
                  - scope
                  properties:
                    scope:
                      description: Define the scope of the search.
                      $ref: '#/components/schemas/SiteSearchScope'
                - type: object
                  properties:
                    mode:
                      description: Search only in the site spaces provided. Deprecated, use scope instead.
                      deprecated: true
                      type: string
                      enum:
                      - specific
                    siteSpaceIds:
                      type: array
                      minLength: 1
                      items:
                        type: string
                  required:
                  - siteSpaceIds
                - type: object
                  properties:
                    mode:
                      description: Search in the current site space and all section's defaults. Deprecated, use scope instead.
                      deprecated: true
                      type: string
                      enum:
                      - current
                    siteSpaceId:
                      type: string
                  required:
                  - mode
                  - siteSpaceId
                - type: object
                  properties:
                    mode:
                      description: Search in all site-spaces. Deprecated, use scope instead.
                      deprecated: true
                      type: string
                      enum:
                      - all
                  required:
                  - mode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        oneOf:
                        - $ref: '#/components/schemas/SearchSpaceResult'
                        - $ref: '#/components/schemas/SearchRecordResult'
                        discriminator:
                          propertyName: type
  /orgs/{organizationId}/sites/{siteId}/search/prewarm:
    post:
      operationId: prewarmSiteSearch
      summary: Prewarm a site's search cache
      description: Hints the search backend that latency-sensitive site search requests are likely to arrive soon. Call this when a visitor opens the site's search interface.
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:search
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '204':
          description: Search cache warmup accepted
  /orgs/{organizationId}/sites/{siteId}/template:
    post:
      operationId: applyTemplateToSite
      summary: Apply the default documentation template to a site
      description: Populates an empty site with GitBook's default documentation structure, content, and customization. Use this after creating a site without spaces to give it a ready-to-edit starting point.
      x-gitbook-mcp:
        destructive: true
      tags:
      - Sites
      security:
      - user-internal: []
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Template applied to site.
  /orgs/{organizationId}/sites/{siteId}/styleguide:
    post:
      operationId: createSiteStyleguideById
      summary: Create or retrieve the style guide space for a site
      description: Ensures the site has a dedicated style guide space and returns it. The style guide defines writing style and tone guidelines that the AI editor agent references when generating or refining content for the site. If a style guide already exists, this is idempotent and returns the existing space.
      x-gitbook-mcp:
        idempotent: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: 'Built-in template id to seed the style guide content with. Omit (or send no body) to create a blank style guide.

                    '
      responses:
        '200':
          description: Style guide created or already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/sites/{siteId}/styleguide/runs:
    post:
      operationId: createSiteStyleguideRun
      summary: Start a style guide check run for a site
      description: 'Starts a style guide check: GitBook Agent reviews the given spaces against the site''s style guide and proposes fixes. A space with no check open gets a new draft change request marked as belonging to the returned run; one whose check is still open has it taken over instead, so it stays marked with the run that opened it. Fails if the site has no style guide.'
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spaces:
                  type: array
                  description: IDs of the site's spaces to check. Each must be an editable content space of the site, and not the style guide itself.
                  items:
                    type: string
                  minItems: 1
                  maxItems: 3
              required:
              - spaces
      responses:
        '201':
          description: Style guide check run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: '#/components/schemas/SiteStyleguideRun'
                  changeRequests:
                    type: array
                    description: 'The change request each space''s check runs in: opened by this run, or already open and taken over. One per space that could be started.'
                    items:
                      $ref: '#/components/schemas/ChangeRequest'
                required:
                - run
                - changeRequests
        '404':
          $ref: '#/components/responses/NotFoundError'
    get:
      operationId: listSiteStyleguideRuns
      summary: List the style guide check runs of a site
      description: Returns the site's style guide check runs, most recent first. Use the `styleguideRun` filter on the organization change requests endpoint to get the change requests a run opened.
      x-gitbook-mcp: true
      tags:
      - Sites
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteStyleguideRun'
components:
  schemas:
    SearchPageResult:
      type: object
      description: Search result representing a page in a space.
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: Description of the page, suitable for presenting a page-root search destination.
        path:
          type: string
        score:
          $ref: '#/components/schemas/SearchResultScore'
        rank:
          type: integer
          minimum: 1
          description: One-based position in the globally ranked result set, preserved when results are paginated and grouped by space.
        resultType:
          type: string
          description: Whether the page matched on its own fields (title, description) or on the content of one of its sections.
          enum:
          - page
          - section
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SearchSectionResult'
        ancestors:
          type: array
