          type: string
          description: Unique identifier for the site structure item (site space, site section, site section group, or external link).
      required:
      - type
      - id
    DocumentTableViewGrid:
      type: object
      properties:
        type:
          type: string
          enum:
          - grid
        columns:
          type: array
          description: Ordered list of the definition IDs to display
          items:
            type: string
        columnWidths:
          type: object
          description: Percent width of each column
          additionalProperties:
            type: number
        hideHeader:
          type: boolean
          description: Should we display the header with column titles
        stickyHeader:
          type: boolean
          description: Should we keep the table header sticky while the page scrolls
        stickyFirstColumn:
          type: boolean
          description: Should we keep the first visible table column sticky while horizontally scrolling
        useNewSizing:
          type: boolean
          description: 'Tables in GitBook originally used a scaled width approach i.e. the width defined

            in columnWidths would be scaled to ensure a 100% width table.


            We later changed this to treat the widths in columnWidths as exact values - they are

            never scaled. A columnWidth of 50 is rendered as 50px.


            In order to maintain backwards compatibility, we track whether or not we

            use the new system here.


            All new tables should have this value set to true, older tables will have it set

            to undefined.

            '
      required:
      - type
      - columns
      - hideHeader
    CustomizationSidebarListStyle:
      type: string
      description: '- `default`: Simple list items without special styling, groups are inset with a line.

        - `pill`: Rounded capsule shape around selected/active items.

        - `line`: Continuous line next to all items, with colored line part for selected/active items.

        '
      enum:
      - default
      - pill
      - line
    CustomizationSearchStyle:
      type: string
      description: 'The style of the search button.

        - `prominent`: large search bar in the middle of the header, with less room for other header items,

        - `subtle`: small search bar in the corner of the header, with more room for other header items.

        '
      enum:
      - prominent
      - subtle
    CustomizationDepth:
      type: string
      description: 'The degree of visual depth (through shadows, gradients and elevation effects) of elements on the site.

        - `subtle`: Subtle shadows and minimal elevation.

        - `flat`: Flat elements, no shadows and no elevation.

        '
      enum:
      - subtle
      - flat
    MergeRulesStandaloneConfiguration:
