    SiteSearchScope:
      oneOf:
      - type: object
        required:
        - mode
        properties:
          mode:
            description: 'Search across all sections of a site, only including the default content of each section. This scope is wide and shallow. You may optionally specify a list of additional site spaces to search in alongside the default content.

              '
            type: string
            enum:
            - default
          currentSiteSpace:
            type: string
            description: 'The ID of the site space that must always be included in the search results. The language of this site space will be used to match other site spaces with the same language, if applicable.

              '
          restrictTo:
            description: 'Must not be provided when searching the entire default scope. To restrict the search to a subset of the default scope, provide `restrictTo` along with `currentSiteSpace`.

              '
            type: string
            minLength: 2
            maxLength: 1
            x-typescript: never
      - type: object
        required:
        - mode
        - currentSiteSpace
        - restrictTo
        properties:
          mode:
            description: 'Search a subset of the default scope of the site, relative to the current site space.

              '
            type: string
            enum:
            - default
          currentSiteSpace:
            type: string
            description: 'The ID of the site space the search is made from. The language of this site space will be used to match other site spaces with the same language, if applicable.

              '
          restrictTo:
            type: string
            enum:
            - currentSiteSpace
            - otherSiteSpaces
            description: 'Restrict the search to a subset of the default scope. With `currentSiteSpace`, only the current site space is searched. With `otherSiteSpaces`, the current site space is excluded and only the other site spaces in the default scope are searched.

              '
      - type: object
        required:
        - mode
        - siteSpaceIds
        properties:
          mode:
            description: Only search in the provided site spaces.
            type: string
            enum:
            - specific
          siteSpaceIds:
            type: array
            minLength: 1
            items:
              type: string
      - type: object
        required:
        - mode
        properties:
          mode:
            description: Search in all sections and site spaces. This scope is wide and deep.
            type: string
            enum:
            - all
