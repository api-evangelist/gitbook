    ChangeRequest:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "change-request"
          enum:
          - change-request
        id:
          type: string
          description: Unique identifier for the change request
        number:
          type: number
          description: Incremental identifier of the change request
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        subject:
          $ref: '#/components/schemas/ChangeRequestSubject'
        description:
          $ref: '#/components/schemas/JSONDocument'
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        mergedBy:
          $ref: '#/components/schemas/User'
          description: User who merged the change request. Only present when the change request has been merged.
        mergedAt:
          $ref: '#/components/schemas/Timestamp'
          description: Date at which the change request was merged. Only present when the change request has been merged.
        space:
          type: string
          description: ID of the space in which the change request was created.
        revision:
          type: string
          description: ID of the active revision in the change request.
        revisionInitial:
          type: string
          description: ID of the initial revision in the space from which the change request was created.
        revisionMergedAncestor:
          type: string
          description: ID of the latest revision when updating from main space content.
        revisionMerged:
          type: string
          description: When merged, ID of the revision resulting from the merge.
        comments:
          type: number
          description: Count of opened comments on the change request.
        changeCounts:
          description: Change counts computed when the change request gets a new revision, for its current head and base revisions. Merged change requests keep their last computed counts. Absent until computed.
          $ref: '#/components/schemas/ChangeRequestChangeCounts'
        siteTopic:
          type: object
          description: Site topic the change request was created from, when it came from one.
          properties:
            site:
              type: string
              description: ID of the site associated with the change request.
            topic:
              type: string
              description: ID of the site topic associated with the change request.
            finding:
              type: string
              deprecated: true
              description: 'ID of the site finding the change request fixes. Use `siteFindings` instead: a change request can fix a finding without belonging to a topic, and this field is absent in that case.'
          required:
          - site
          - topic
        siteFinding:
          deprecated: true
          type: object
          description: First linked site finding. Use `siteFindings` to read all linked findings.
          properties:
            site:
              type: string
              description: ID of the site the finding belongs to.
            finding:
              type: string
              description: ID of the site finding the change request fixes.
          required:
          - site
          - finding
        siteFindings:
          type: array
          description: Site findings linked to the change request, in link order. Absent when none are linked. Merging resolves findings once every linked change request is merged, except outbound broken links, which are resolved by the outbound checker.
          items:
            type: object
            properties:
              site:
                type: string
                description: ID of the site the finding belongs to.
              finding:
                type: string
                description: ID of the site finding the change request fixes.
            required:
            - site
            - finding
        styleguide:
          type: object
          description: 'Style guide check that opened the change request, when it came from one. A check can be run again on the change request already open on a space, rather than opening a second one, so several checks can share a change request.

            '
          properties:
            site:
              type: string
              description: ID of the site the style guide belongs to.
            run:
              type: string
              description: ID of the style guide check run that opened the change request.
            changedPages:
              type: number
              description: 'Number of pages the check changed, recorded when it finished. Absent while it is still running, or when it never completed.

                '
            checkedAt:
              $ref: '#/components/schemas/Timestamp'
              description: 'When the most recent style guide check on the change request finished. Later edits from anyone else do not move it. Absent while the first one is still running.

                '
          required:
          - site
          - run
        outdated:
          type: boolean
          description: If true, the change request is not up-to-date with latest changes in the main content.
        imports:
          description: 'Import runs targeting this change request, still running or ended recently, most recent first. Only returned when fetching a single change request.

            '
          type: array
          items:
            $ref: '#/components/schemas/ContentImportRun'
        links:
          $ref: '#/components/schemas/ChangeRequestLinks'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            app:
              type: string
              description: URL of the space in the application
              format: uri
            location:
              type: string
              description: URL of the user in the API
              format: uri
          required:
          - app
          - location
      required:
      - object
      - id
      - number
      - status
      - subject
      - createdBy
      - createdAt
      - updatedAt
      - space
      - revision
      - revisionInitial
      - comments
      - outdated
      - urls
