openapi: 3.2.0
info:
  title: GitBook Change Requests API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: change-requests
  x-page-icon: code-pull-request
  x-page-title: Change requests
  x-page-description: Review and collaborate on proposed documentation changes before merging.
  description: 'This API helps you keep your space clean by letting contributors propose changes, review them, and then merge or discard as needed.


    {% openapi-schemas spec="gitbook" schemas="ChangeRequest" grouped="false" %}

    The ChangeRequest object

    {% endopenapi-schemas %}'
paths:
  /spaces/{spaceId}/change-requests:
    post:
      operationId: createChangeRequest
      summary: Create a new change request in a space
      description: Creates a new change request, which is a draft working copy of the space's content — similar to a Git branch or pull request. Use this before making content edits to avoid modifying the live published content directly. Optionally supply a subject and a template to pre-populate the change request with content. Once created, use the change-request content endpoints to read and modify pages within the draft, then merge it when ready. Pass `siteFindingIds` to link the documentation findings this change request fixes. Outbound broken links are resolved by the outbound checker, rather than by merging.
      x-gitbook-mcp:
        curatedBy: create_change_request
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/spaceId'
      responses:
        '201':
          description: Change Request Created
          headers:
            Location:
              description: API URL for the newly created change request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: Subject of the change request
                template:
                  $ref: '#/components/schemas/ApplySpaceTemplate'
                  description: Template to apply to the change request
                description:
                  $ref: '#/components/schemas/JSONDocument'
                  description: Description of the change request, explaining what it changes and why, for whoever reviews it. Only paragraphs and lists are kept; other blocks are stripped along with their text.
                siteFindingId:
                  type: string
                  deprecated: true
                  description: The site finding this change request fixes. Use `siteFindingIds` instead. The finding's site must contain this space.
                siteFindingIds:
                  type: array
                  maxItems: 25
                  items:
                    type: string
                  description: Site findings this change request fixes. Each finding's site must contain this space, and the caller must have edit permission on each site. Takes precedence over `siteFindingId` when both are supplied.
              additionalProperties: true
    get:
      operationId: listChangeRequestsForSpace
      summary: List all change requests for a space
      description: Returns a paginated list of change requests for the given space. Use this to discover existing change requests before creating a new one, or to find change requests assigned to a specific user for review.
      x-gitbook-mcp: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/spaceId'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestStatus'
          default: open
        description: If defined, only change requests matching this status will be returned.
      - name: creator
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests created by this user will be returned.
      - name: contributor
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests with contributions from this user will be returned.
      - name: requestedReviewer
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests with a requested reviewer for this user will be returned.
      - name: topic
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests linked to this site topic will be returned.
      - name: orderBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestOrderBy'
      responses:
        '200':
          description: List of the space's change requests
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChangeRequest'
  /spaces/{spaceId}/change-requests/{changeRequestId}:
    get:
      operationId: getChangeRequestById
      summary: Get a change request by its ID
      description: Retrieves the full details of a single change request, including its status, subject, description, and metadata. Use this to check the current state of a change request before deciding to merge, update, or request a review.
      x-gitbook-mcp: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      responses:
        '200':
          description: The matching change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '404':
          description: The change request could not be found.
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateChangeRequestById
      summary: Update a change request's subject, description, or status
      description: Updates the metadata of a change request. Use this to rename a change request, add context before requesting a review, or change the workflow status without merging. To update page content within the change request, use the content endpoint instead. Set `siteFindingIds` to replace the documentation findings linked to the change request. Outbound broken links are resolved by the outbound checker, rather than by merging.
      x-gitbook-mcp: true
      x-gitbook-return-preference: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      - $ref: '#/components/parameters/returnPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/ChangeRequestSubject'
                description:
                  $ref: '#/components/schemas/JSONDocument'
                links:
                  type: array
                  description: External links associated with the change request.
                  items:
                    $ref: '#/components/schemas/ChangeRequestLinkInput'
                  maxItems: 10
                status:
                  type: string
                  enum:
                  - draft
                  - open
                  - archived
                siteFindingId:
                  deprecated: true
                  type:
                  - string
                  - 'null'
                  description: The site finding this change request fixes. Use `siteFindingIds` instead. The finding's site must contain this space. Replaces the whole set of linked findings with this finding. Pass null to unlink all findings.
                siteFindingIds:
                  type:
                  - array
                  - 'null'
                  maxItems: 25
                  items:
                    type: string
                  description: Replaces the linked site findings. Each finding's site must contain this space, and the caller must have edit permission on each site. Pass null or an empty list to unlink all findings. Omit to keep the current links. Takes precedence over `siteFindingId` when both are supplied.
      responses:
        '200':
          description: The change request has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '204':
          description: Change request updated without returning its representation
          headers:
            Preference-Applied:
              $ref: '#/components/headers/returnPreferenceApplied'
  /spaces/{spaceId}/change-requests/{changeRequestId}/merge:
    post:
      operationId: mergeChangeRequest
      summary: Merge a change request into the space's live content
      description: Merges the change request's draft content into the space's primary (published) content, making all changes live. If the result is "conflicts", the merge was still applied but the space may need manual conflict resolution. Consider running updateChangeRequest first to sync with the latest live content and reduce conflicts.
      x-gitbook-mcp:
        destructive: true
        curatedBy: submit_or_merge_change_request
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - change-request:merge
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: string
                    description: ID of the resulting revision
                  result:
                    type: string
                    enum:
                    - merge
                    - conflicts
                required:
                - revision
                - result
  /spaces/{spaceId}/change-requests/{changeRequestId}/update:
    post:
      operationId: updateChangeRequest
      summary: Sync a change request with the latest live space content
      description: Rebases the change request onto the latest primary revision of the space, pulling in any changes that were merged to the live space since this change request was created. Run this before merging to minimise conflicts, especially if the change request has been open for a while.
      x-gitbook-mcp:
        destructive: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: string
                    description: ID of the resulting revision
                  result:
                    type: string
                    enum:
                    - update
                    - conflicts
                required:
                - revision
                - result
  /spaces/{spaceId}/change-requests/{changeRequestId}/pdf:
    get:
      operationId: getChangeRequestPDF
      summary: Get a temporary URL to download a change request's content as PDF
      description: Generates a temporary URL (valid for 1 hour) to download the change request's draft content as a PDF. Optionally scope the export to a single page using the page and only parameters. Use this to share or archive the draft content before merging.
      x-gitbook-mcp: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      - in: query
        name: only
        description: Generate a PDF only for the provided page.
        schema:
          type: boolean
      - in: query
        name: page
        description: ID of a specific page to generate a PDF for.
        schema:
          type: string
      responses:
        '200':
          description: URL of the PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    description: Temporary URL to print the content. The URL will work for 1h.
                    $ref: '#/components/schemas/URL'
                required:
                - url
  /orgs/{organizationId}/change-requests:
    get:
      operationId: listChangeRequestsForOrganization
      summary: List all change requests across an entire organization
      description: Returns a paginated list of change requests across all spaces in the organization. Use this for an organization-wide view of open drafts — for example, to find all change requests needing a specific reviewer's attention. For a single space's change requests, use the space-scoped endpoint instead.
      x-gitbook-mcp: true
      tags:
      - change-requests
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/organizationId'
      - name: status
        in: query
        required: false
        schema:
          type: array
          description: If defined, only change requests matching the statuses will be returned.
          items:
            $ref: '#/components/schemas/ChangeRequestStatus'
          default:
          - open
      - name: creator
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests created by this user will be returned.
      - name: contributor
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests with contributions from this user will be returned.
      - name: requestedReviewer
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests with a requested reviewer for this user will be returned.
      - name: site
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests linked to this site will be returned.
      - name: space
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests from this space will be returned.
      - name: topic
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests linked to this site topic will be returned.
      - name: styleguideRun
        in: query
        required: false
        schema:
          type: string
        description: If defined, only change requests opened by this style guide check run will be returned.
      - name: finding
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - all
        description: Controls whether change requests from triage are included. Pass `none` to exclude change requests from triage, or `all` to include them. Default is `none`.
      - name: orderBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestOrderBy'
      responses:
        '200':
          description: List of the organization's change requests
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChangeRequest'
components:
  schemas:
    ChangeRequestChangeCounts:
      type: object
      description: Exact semantic entity and page-document block counts for a change request at its current head and base revisions.
      properties:
        pages:
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        library:
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        blocks:
          description: Nested user-visible page-document block counts. Absent when `blocksOmittedReason` is set.
          $ref: '#/components/schemas/ChangeRequestChangeCountsByType'
        blocksOmittedReason:
          type: string
          enum:
          - too-many-pages
          - too-many-blocks
          - timeout
          description: 'Why `blocks` is absent: too many pages changed (`too-many-pages`), the changed pages hold too many blocks to compare within the counting budget (`too-many-blocks`; this is not a count of changed blocks), or counting ran out of time (`timeout`). Page and library counts are still exact.'
      required:
      - pages
      - library
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    DocumentBlockFile:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - file
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
          required:
          - ref
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentBlockIntegration:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - integration
        key:
          type: string
        data:
          type: object
          properties:
            integration:
              type: string
              description: Name of the integration
            block:
              type: string
              description: ID of the block in the integration
            props:
              description: Properties passed to the block during rendering
              $ref: '#/components/schemas/PlainObject'
            action:
              $ref: '#/components/schemas/ContentKitAction'
            url:
              type: string
              description: 'URL associated with the content represented by the block.

                This property is set when creating a block from a URL (unfurl) to ensure

                we can convert the block back to an embed.

                '
            fullWidth:
              type: boolean
          required:
          - integration
          - block
          - props
        isVoid:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties:
            token:
              type: string
              description: A content token that can be used to authenticate requests for cross-space integration blocks.
            spaceId:
              type: string
              description: ID of the space the integration block originates from
      required:
      - object
      - type
      - data
      - isVoid
    URL:
      type: string
      format: uri
      maxLength: 2048
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockListItem'
