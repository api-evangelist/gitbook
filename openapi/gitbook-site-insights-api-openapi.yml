openapi: 3.2.0
info:
  title: GitBook Site Insights API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-insights
  x-page-title: Site insights
  x-page-description: Analyze traffic and engagement metrics for your docs site.
  x-parent: sites
  description: This API delivers insights about how visitors interact with your site, including page views and user engagement, helping you measure and optimize your content strategy.
paths:
  /orgs/{organizationId}/sites/{siteId}/agent-feedback:
    post:
      operationId: submitSiteAgentFeedback
      deprecated: true
      summary: Submit agent feedback for a site.
      description: 'Submit feedback from an AI agent about the content of the site, such as outdated, incorrect or missing content encountered while helping a user.


        Deprecated in favour of `submitAgentFeedbackToSite`, which collects feedback about every surface a site exposes to agents. Send the same payload there as a `site-content` subject.'
      x-internal: true
      tags:
      - site-insights
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  description: The feedback about the content of the site.
                  type: string
                  minLength: 1
                  maxLength: 2048
                goal:
                  description: 'The end goal the agent is trying to accomplish on behalf of the user, giving the context the agent was working towards when it encountered the issue.

                    '
                  $ref: '#/components/schemas/AgentGoal'
                url:
                  description: URL of the content the feedback is about.
                  $ref: '#/components/schemas/URL'
                spaceId:
                  description: ID of the space the feedback is about.
                  type: string
                pageId:
                  description: ID of the page the feedback is about.
                  type: string
                source:
                  description: 'Surface the feedback was submitted from. When omitted, the feedback is recorded with an unknown source.

                    '
                  $ref: '#/components/schemas/AgentFeedbackSource'
              required:
              - feedback
              - url
              - spaceId
              - pageId
      responses:
        '204':
          description: Feedback submitted
  /orgs/{organizationId}/sites/{siteId}/insights/events:
    post:
      operationId: trackEventsInSiteById
      summary: Track site events
      tags:
      - site-insights
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '204':
          description: Events have been tracked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/SiteInsightsEvent'
              required:
              - events
  /orgs/{organizationId}/sites/{siteId}/insights/events/aggregate:
    post:
      operationId: aggregateSiteEvents
      summary: Query a site's analytics events
      description: 'Runs an aggregation query over a published site''s Insights events, grouped and filtered over a time range. Use it to answer analytics questions about how visitors engage with a site''s documentation: page views, visitors, searches, referrers, and broken URLs (404s). A 404 is a `page_view` or `search_open_result` event whose `page` is `null`, in the `site` display context; filter `eventPageNotFoundType` not in `conditional` to leave out 404s that adaptive content explains. Group by `datetime` for a trend over time and by `urlPath` for the top broken URLs.'
      x-gitbook-mcp:
        readOnly: true
      security:
      - user: []
      - oauth:
        - site:insights:read
      tags:
      - site-insights
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInsightsQueryEventsAggregation'
      responses:
        '200':
          description: Aggregated events in the site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInsightsQueryEventsAggregationResult'
  /orgs/{organizationId}/sites/{siteId}/insights/visitor-segments:
    get:
      operationId: listSiteVisitorSegments
      summary: List a site visitor segments
      tags:
      - site-insights
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: List of visitor segments in the site.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteInsightsVisitorSegment'
components:
  schemas:
    SiteInsightsDisplayContext:
      type: string
      description: Context in which the event was recorded.
      enum:
      - site
      - server
      - embed
      - mcp
    SiteInsightsQueryEventsValues:
      oneOf:
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - datetime
          values:
            type: array
            items:
              $ref: '#/components/schemas/Timestamp'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - dayOfWeek
          values:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 7
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - hourOfDay
          values:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 23
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - url
          values:
            type: array
            items:
              $ref: '#/components/schemas/URL'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - urlPath
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventsCount
          values:
            type: array
            items:
              type: number
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - sessionsCount
          values:
            type: array
            items:
              type: number
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorsCount
          values:
            type: array
            items:
              type: number
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventType
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsEventType'
      - type: object
        required:
        - column
        - claim
        - values
        properties:
          column:
            type: string
            enum:
            - visitorClaim
          claim:
            type: string
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorAuthenticated
          values:
            type: array
            items:
              type:
              - boolean
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorClaimProperty
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorBrowser
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsVisitorBrowser'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorDevice
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsVisitorDevice'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorOS
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsVisitorOS'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorBot
          values:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/SiteInsightsVisitorBot'
              - type: string
                enum:
                - ''
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventLinkTargetValue
          values:
            type: array
            items:
              $ref: '#/components/schemas/ContentRef'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventLinkTargetKind
          values:
            type: array
            items:
              type: string
              enum:
              - url
              - page
              - file
              - anchor
              - space
              - collection
              - user
              - reusable-content
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventLinkPosition
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsLinkPosition'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - siteSection
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventLLMSVariant
          values:
            type: array
            items:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/SiteInsightsLLMSVariant'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventPageNotFoundType
          values:
            type: array
            items:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/SiteInsightsPageNotFoundType'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventMarkdownSource
          values:
            type: array
            items:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/SiteInsightsMarkdownSource'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - siteSpace
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - siteShareKey
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - displayContext
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsDisplayContext'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - page
          values:
            description: Pages to match. `null` matches events that resolved to no page, which for `page_view` events is a 404 (a broken URL).
            type: array
            items:
              oneOf:
              - type: 'null'
              - type: object
                required:
                - page
                - space
                properties:
                  page:
                    type:
                    - string
                    - 'null'
                  space:
                    type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorGeoCountry
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorGeoPoint
          values:
            type: array
            items:
              type:
              - object
              - 'null'
              required:
              - latitude
              - longitude
              - h3
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                h3:
                  type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorLanguage
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorUserAgent
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - visitorId
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventLinkTargetDomain
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventAPIOperationPath
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventAPIOperationMethod
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventSearchQuery
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventSearchResultRecordId
          values:
            type: array
            items:
              type:
              - string
              - 'null'
      - type: object
        description: 'Ratings submitted on a page, counted once per rating a reader submitted rather than once

          per event.

          '
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - pageFeedbackRating
          values:
            type: array
            items:
              type: object
              required:
              - ok
              - good
              - bad
              properties:
                ok:
                  type: number
                good:
                  type: number
                bad:
                  type: number
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - askResponseRating
          values:
            type: array
            items:
              type: object
              required:
              - positive
              - negative
              properties:
                positive:
                  type: number
                negative:
                  type: number
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventPageFeedbackRating
          values:
            type: array
            items:
              $ref: '#/components/schemas/PageFeedbackRating'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventAskResponseRating
          values:
            type: array
            items:
              type: integer
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventPageFeedbackComment
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - referrer
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - referrerDomain
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - previousUrl
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - utmSource
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - utmMedium
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - utmCampaign
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - utmTerm
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - utmContent
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventAdDomain
          values:
            type: array
            items:
              type: string
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventAdPlacement
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsAdPlacement'
      - type: object
        required:
        - column
        - values
        properties:
          column:
            type: string
            enum:
            - eventTrademarkPlacement
          values:
            type: array
            items:
              $ref: '#/components/schemas/SiteInsightsTrademarkPlacement'
    SiteInsightsEventBase:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SiteInsightsEventSession'
        location:
          $ref: '#/components/schemas/SiteInsightsEventLocation'
        timestamp:
          description: Optional timestamp of the event. If not provided, the current timestamp will be used. Must be within 5 minutes of the current time.
          $ref: '#/components/schemas/Timestamp'
      required:
      - session
      - location
    SiteInsightsQueryRange:
      oneOf:
      - $ref: '#/components/schemas/SiteInsightsQueryRangePreset'
      - $ref: '#/components/schemas/SiteInsightsQueryRangeCustom'
    SiteInsightsLLMSVariant:
      type: string
      enum:
      - standard
      - full
    PlainObject:
      properties: {}
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/PlainObject'
        - type: string
        - type: boolean
        - type: number
        - type: array
          items:
            oneOf:
            - type: string
            - type: boolean
            - type: number
            - $ref: '#/components/schemas/PlainObject'
    ContentRefTag:
      type: object
      properties:
        kind:
          type: string
          enum:
          - tag
        tag:
          type: string
          description: The slug of the tag, also used as the ID, and references the tags defined on a revision.
        space:
          type: string
          description: The space in which the tag is defined. If undefined, the tag is assumed to be in the same space as the content reference.
      required:
      - kind
      - tag
    ContentRefOpenAPI:
      type: object
      properties:
        kind:
          type: string
          enum:
          - openapi
        spec:
          type: string
          description: Slug of the OpenAPI specification
      required:
      - kind
      - spec
    SiteInsightsEventAskView:
      description: Event when a user views the ask UI.
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - ask_view
          trigger:
            type: string
            enum:
            - hover
            - selection
            - site
            - page
            - code
            - embed
        required:
        - type
    SiteInsightsQueryOperator:
      type: string
      enum:
      - in
      - notIn
      - greaterThan
      - greaterThanOrEqual
      - lessThan
      - lessThanOrEqual
    SiteInsightsEventAgentFeedback:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - agent_feedback
        required:
        - type
    SiteInsightsQueryEventsFilter:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsQueryEventsValues'
      - type: object
        properties:
          operator:
            $ref: '#/components/schemas/SiteInsightsQueryOperator'
    ContentRefCollection:
      type: object
      properties:
        kind:
          type: string
          enum:
          - collection
        collection:
          type: string
      required:
      - kind
      - collection
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    SiteInsightsEventRSSRequest:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - rss_request
        required:
        - type
    SiteInsightsMarkdownSource:
      description: How a page's markdown was requested. `page-action` means a reader used the site's page-actions menu — its copy or view-as-markdown action — rather than a client fetching the URL directly.
      type: string
      enum:
      - page-action
    OpenAPIOperationPointer:
      type: object
      description: Pointer to an operation in the OpenAPI spec.
      properties:
        path:
          type: string
          description: Path of the operation in the OpenAPI spec.
        method:
          type: string
          description: HTTP method of the operation in the OpenAPI spec.
      required:
      - path
      - method
    SiteInsightsEventTrademarkClick:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - trademark_click
          placement:
            $ref: '#/components/schemas/SiteInsightsTrademarkPlacement'
        required:
        - type
        - placement
    ContentRefSpace:
      type: object
      properties:
        kind:
          type: string
          enum:
          - space
        space:
          type: string
      required:
      - kind
      - space
    SiteInsightsEventAskRateResponse:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - ask_rate_response
          query:
            type: string
            description: Question asked.
          rating:
            type: integer
            enum:
            - 1
            - -1
          responseId:
            type: string
            description: ID of the AI response.
        required:
        - type
        - query
        - rating
        - responseId
    SiteInsightsEventAPIClientRequest:
      allOf:
      - $ref: '#/components/schemas/SiteInsightsEventBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - api_client_request
          operation:
            $ref: '#/components/schemas/OpenAPIOperationPointer'
        required:
        - type
        - operation
    SiteInsightsVisitorOS:
      type: string
      enum:
      - windows
      - macos
      - linux
      - android
      - ios
      - unknown
    ContentRefUser:
      type: object
      properties:
        kind:
          type: string
          enum:
          - user
        user:
          type: string
      required:
      - kind
      - user
