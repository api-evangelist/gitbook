openapi: 3.2.0
info:
  title: GitBook Site Sections API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: site-sections
  x-page-title: Site sections
  x-page-description: Create and organize high-level sections for your docs site.
  x-parent: sites
  description: 'Sections help partition your site''s content at the top level. They can be modified, deleted, or reorganized to reflect your site''s changing structure.


    {% openapi-schemas spec="gitbook" schemas="SiteSection" grouped="false" %}

    The SiteSection object

    {% endopenapi-schemas %}'
paths:
  /orgs/{organizationId}/sites/{siteId}/sections:
    post:
      operationId: addSectionToSite
      summary: Add a new navigation section to a site backed by a space
      description: Creates a new top-level navigation section in the site. The section appears as a tab or sidebar entry in the site navigation. Pass an existing space ID to link it as the section's primary content source, or pass `null` to create and link a new space. New spaces start with a blank page unless a template is provided or `empty` is `true`, which creates the space with no page at all (use it when you are about to add the pages yourself).
      x-gitbook-mcp:
        destructive: true
      tags:
      - site-sections
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spaceId:
                  oneOf:
                  - type: string
                  - type: 'null'
                  description: Pass the ID of an existing space or pass `null` to create a new space. The space will be added to the section as a site space variant.
                template:
                  $ref: '#/components/schemas/ApplySpaceTemplate'
                  description: Template for the new space when `spaceId` is `null`. Templates that provision organization-level resources, such as OpenAPI specifications, are not supported by this site-scoped operation.
                empty:
                  type: boolean
                  default: false
                  description: Create the new space without any content, not even a blank page. Useful when the content is about to be populated, for example by an import. Only valid when `spaceId` is `null` and no template is provided.
                title:
                  oneOf:
                  - $ref: '#/components/schemas/SiteSectionTitle'
                  - type: 'null'
                  description: Section title. Also used as the space title when `spaceId` is `null` and no template is provided.
                icon:
                  oneOf:
                  - $ref: '#/components/schemas/Icon'
                  - type: 'null'
                draft:
                  type: boolean
                  default: false
                  description: Whether the section should be created in draft mode. Defaults to false. Editors can set this to true to create draft content after sections are enabled. Creating live content requires Creator permission; enabling sections requires Admin permission.
                pageId:
                  type: string
                  description: Custom home page within an existing space, rendered at the section's path root instead of the space's default landing page. Providing it when `spaceId` is `null` returns a 400 error.
                siteSectionGroupId:
                  type: string
                  description: ID of the section group to create the section in
              required:
              - spaceId
      responses:
        '201':
          description: Section added to the site
          headers:
            Location:
              description: API URL for the newly created site-section relationship
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SiteSection'
                - type: object
                  properties:
                    subscriptionNotice:
                      $ref: '#/components/schemas/SubscriptionNotice'
    get:
      operationId: listSiteSections
      summary: List all navigation sections in a site
      description: Returns a paginated list of sections in the site. Each section is a top-level navigation item backed by one or more site spaces. Use this to inspect the current navigation structure, find a section ID before updating it, or check whether sections are in draft or live state.
      x-gitbook-mcp: true
      tags:
      - site-sections
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteShareKey'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteSection'
  /orgs/{organizationId}/sites/{siteId}/sections/{siteSectionId}:
    patch:
      operationId: updateSiteSectionById
      summary: Update a navigation section in a site
      description: Updates a navigation section's configuration in the site structure.
      x-gitbook-mcp: true
      x-gitbook-return-preference: true
      tags:
      - site-sections
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionId'
      - $ref: '#/components/parameters/returnPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/SiteSectionTitle'
                localizedTitle:
                  $ref: '#/components/schemas/LocalizedString128'
                path:
                  $ref: '#/components/schemas/SiteSectionPath'
                defaultSiteSpace:
                  type: string
                  description: ID of the site-space to be used as the default in this section.
                condition:
                  description: Conditional expression used to evaluate whether the site section should be shown to the site's visitor (should evaluate to a boolean). If not set, the condition will remain unchanged. If set to null, the condition will be removed.
                  oneOf:
                  - $ref: '#/components/schemas/Expression'
                  - type: 'null'
                icon:
                  oneOf:
                  - $ref: '#/components/schemas/Icon'
                  - type: 'null'
                draft:
                  type: boolean
                  description: Whether the site section should be kept in draft mode. Setting it to true makes the site section draft. Setting it to false makes the site section live.
                description:
                  oneOf:
                  - $ref: '#/components/schemas/SiteSectionDescription'
                  - type: 'null'
                localizedDescription:
                  $ref: '#/components/schemas/LocalizedString256'
                siteSectionGroupId:
                  description: ID of the section group to move the section into. Set to null to move the section to the root of the site.
                  oneOf:
                  - type: string
                  - type: 'null'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSection'
        '204':
          description: Site section updated without returning its representation
          headers:
            Preference-Applied:
              $ref: '#/components/headers/returnPreferenceApplied'
    delete:
      operationId: deleteSiteSectionById
      summary: Delete a site section
      tags:
      - site-sections
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionId'
      responses:
        '204':
          description: Site section did not exist
        '205':
          description: Site section has been deleted
  /orgs/{organizationId}/sites/{siteId}/sections/{siteSectionId}/move:
    post:
      operationId: moveSiteSection
      deprecated: true
      summary: Move a site section to a new position.
      tags:
      - site-sections
      security:
      - user: []
      - oauth:
        - site:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteSectionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  description: The position where to move the site section. When not provided the site section is moved at the end of the site.
                  $ref: '#/components/schemas/SiteSectionMovePosition'
      responses:
        '200':
          description: Site section moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSection'
        '400':
          description: Invalid move site section position provided
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: No matching Site section found
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    GitSyncOperationDirection:
      type: string
      enum:
      - export
      - import
    SiteSectionDescription:
      type: string
      description: Description of the site section
      minLength: 0
      maxLength: 256
    MemberRoleOrGuest:
      description: The role of a member in an organization, null for guests
      oneOf:
      - $ref: '#/components/schemas/MemberRole'
      - type: 'null'
    BillingTrialStatus:
      type: string
      description: '- notapplicable, no trial can be started for this organization. - none, no trial has been started yet. - active, trial is active. - ended, the trial has ended and the user has choosen to stay on the free plan or has upgraded to a paid plan. - expired, the trial has ended but the user hasn''t deciced yet what to do.

        '
      enum:
      - notapplicable
      - none
      - active
      - ended
      - expired
    DefaultLevel:
      description: Default level for a piece of content
      oneOf:
      - $ref: '#/components/schemas/MemberRoleOrGuest'
      - type: string
        enum:
        - inherit
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    MergeRulesConfigurationInherit:
      type: object
      description: The merge rules inherits from the organization configuration.
      properties:
        type:
          type: string
          enum:
          - inherit
      required:
      - type
    ContentRefTag:
      type: object
      properties:
        kind:
          type: string
          enum:
          - tag
        tag:
          type: string
          description: The slug of the tag, also used as the ID, and references the tags defined on a revision.
        space:
          type: string
          description: The space in which the tag is defined. If undefined, the tag is assumed to be in the same space as the content reference.
      required:
      - kind
      - tag
    ContentRefOpenAPI:
      type: object
      properties:
        kind:
          type: string
          enum:
          - openapi
        spec:
          type: string
          description: Slug of the OpenAPI specification
      required:
      - kind
      - spec
    SiteSection:
      type: object
      properties:
        object:
          type: string
          description: The object type, which is always "site-section"
          enum:
          - site-section
        id:
          type: string
          description: Unique identifier of the site section
        title:
          $ref: '#/components/schemas/SiteSectionTitle'
        localizedTitle:
          $ref: '#/components/schemas/LocalizedString128'
        description:
          $ref: '#/components/schemas/SiteSectionDescription'
        localizedDescription:
          $ref: '#/components/schemas/LocalizedString256'
        default:
          type: boolean
          description: Whether this is the default section for the site
        draft:
          type: boolean
          description: Whether the site section is draft and not live.
        path:
          $ref: '#/components/schemas/SiteSectionPath'
        condition:
          description: Conditional expression used to evaluate whether the site section should be shown to the site's visitor.
          $ref: '#/components/schemas/Expression'
        sectionGroup:
          type: string
          description: ID of the section group the section belongs to in the site
        siteSpaces:
          type: array
          items:
            $ref: '#/components/schemas/SiteSpace'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            published:
              type: string
              description: URL of the published version of the site section. Only defined when site is published.
              format: uri
        icon:
          $ref: '#/components/schemas/Icon'
      required:
      - object
      - id
      - title
      - path
      - draft
      - siteSpaces
      - urls
    PreviousGitSyncState:
      type: object
      description: What is still known about a target's Git Sync after its installation was removed. Never returned alongside `gitSync`, which describes a live installation.
      required:
      - url
      properties:
        url:
          type: string
          description: The URL to the directory of the repository tree the content synced with before its Git Sync installation was removed, at the branch it synced.
    ContentRefCollection:
      type: object
      properties:
        kind:
          type: string
          enum:
          - collection
        collection:
          type: string
      required:
      - kind
      - collection
    SiteSectionTitle:
      type: string
      description: Title of the site section
      minLength: 2
      maxLength: 128
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    SiteSectionMovePosition:
      type: object
      description: Position at which to move the site section to.
      properties:
        before:
          $ref: '#/components/schemas/SiteSectionPointer'
        after:
          $ref: '#/components/schemas/SiteSectionPointer'
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    MergeRule:
      oneOf:
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_one_of_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - allow_bypass
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_at_least_one_review
            - require_at_least_one_approved_review
            - require_all_reviews_approved
            - require_agent_review
            - require_up_to_date_change_request
            - require_change_request_subject
            - require_change_request_description
            - require_author_to_merge
        required:
        - rule
      - type: object
        description: The merge rule is written in the advanced custom expression syntax.
        properties:
          rule:
            type: string
            enum:
            - custom
          expression:
            $ref: '#/components/schemas/Expression'
          message:
            type: string
            description: Optional message to display when the expression evaluates to false.
        required:
        - rule
        - expression
    Icon:
      type: string
      maxLength: 50
      format: icon
      description: Name of the icon
      example: gear
    ContentRefSpace:
      type: object
      properties:
        kind:
          type: string
          enum:
          - space
        space:
          type: string
      required:
      - kind
      - space
    SiteSpacePath:
      type: string
      description: Path to the space on the site
      minLength: 1
      maxLength: 100
    ContentRefUser:
      type: object
      properties:
        kind:
          type: string
          enum:
          - user
        user:
          type: string
      required:
      - kind
      - user
    ContentRefReusableContent:
      type: object
      properties:
        kind:
          type: string
          enum:
          - reusable-content
        reusableContent:
          type: string
        space:
          type: string
          description: The space in which the reusable content is defined. If undefined, the reusable content is assumed to be in the same space as the content reference.
      required:
      - kind
      - reusableContent
    LocalizedString256:
      type: object
      description: Localized string value with a 256 character limit, keyed by locale. Contains overrides for non-default languages only.
      additionalProperties:
        type: string
        maxLength: 256
      propertyNames:
        $ref: '#/components/schemas/TranslationLanguage'
    MemberRole:
      type: string
      description: '"The role of a member in an organization.

        "admin": Can administrate the content: create, delete spaces, ...

        "create": Can create content.

        "review": Can review content.

        "edit": Can edit the content (live or change requests).

        "comment": Can access the content and its discussions.

        "read": Can access the content, but cannot update it in any way.

        '
      enum:
      - admin
      - create
      - edit
      - review
      - comment
      - read
    SpaceTemplateParams:
      type: object
      description: Parameters for a space template
      properties:
        contentRefs:
          type: object
          additionalProperties:
            type: object
            $ref: '#/components/schemas/ContentRef'
    SubscriptionTrial:
      type: object
      description: The current or last trial of an organization.
      properties:
        status:
          $ref: '#/components/schemas/BillingTrialStatus'
        endDate:
          description: When the trial ends, or ended.
          $ref: '#/components/schemas/Timestamp'
        daysRemaining:
          type: integer
          description: Days left in the trial, rounded up, so 1 is its last day. 0 once it has ended.
      required:
      - status
      - endDate
      - daysRemaining
    Space:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "space"
          enum:
          - space
        id:
          type: string
          description: Unique identifier for the space
        title:
          $ref: '#/components/schemas/SpaceTitle'
        emoji:
          description: An emoji for this space. It'll match the emoji shown in the GitBook app.
          $ref: '#/components/schemas/Emoji'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        editMode:
          $ref: '#/components/schemas/SpaceEditMode'
        type:
          type: string
          description: Kind of space. Only set to `styleguide` for spaces holding a team's writing style guide; omitted for regular spaces.
          enum:
          - styleguide
        mergeRules:
          $ref: '#/components/schemas/MergeRulesSpaceConfiguration'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the space in the API
              format: uri
            app:
              type: string
              description: URL of the space in the application
              format: uri
            published:
              type: string
              description: URL of the published version of the space. Only defined when visibility is not "private."
              format: uri
            public:
              type: string
              description: URL of the public version of the space. Only defined when visibility is "public".
              format: uri
            icon:
              description: URL of the icon of this space, if defined.
              $ref: '#/components/schemas/URL'
          required:
          - app
          - location
        organization:
          type: string
          description: ID of the organization owning this space
        parent:
          type: string
          description: ID of the parent collection.
        language:
          $ref: '#/components/schemas/TranslationLanguage'
        gitSync:
          $ref: '#/components/schemas/GitSyncState'
        previousGitSync:
          $ref: '#/components/schemas/PreviousGitSyncState'
        imports:
          description: 'Import runs targeting this space, still running or ended recently, most recent first. Only returned when fetching a single space.

            '
          type: array
          items:
            $ref: '#/components/schemas/ContentImportRun'
        visitorAuth:
          $ref: '#/components/schemas/VisitorAuth'
        revision:
          type: string
          description: ID of the active revision in the space.
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        comments:
          type: number
          description: Count of opened comments on the space.
        changeRequests:
          type: number
          description: Total count of change requests on the space.
        changeRequestsOpen:
          type: number
          description: Count of open change requests on the space.
        changeRequestsDraft:
          type: number
          description: Count of draft change requests on the space.
        internal_poweredByV2:
          type: boolean
          description: Whether the space is powered by V2 of the content system.
        internal_singleWebsocket:
          type: boolean
          description: Whether the space uses a single websocket connection for all real-time communication.
        permissions:
          type: object
          description: The set of permissions for the space
          properties:
            view:
              type: boolean
              description: Can the user view the space content.
            access:
              type: boolean
              description: Can the user access the space in the application.
            admin:
              type: boolean
              description: Can the user edit the title, install integrations, and manage the space.
            viewInviteLinks:
              type: boolean
              description: Can the user view the invite links of the space.
            edit:
              type: boolean
              description: Can the user edit the content of the space by creating a change request.
            triggerGitSync:
              type: boolean
              description: Can the user trigger a git sync.
            comment:
              type: boolean
              description: Can the user comment on the content.
            merge:
              type: boolean
              description: Can the user merge change requests.
            review:
              type: boolean
              description: Can the user review change requests.
            installIntegration:
              type: boolean
              description: Can the user install integrations in the space.
          required:
          - view
          - access
          - admin
          - viewInviteLinks
          - edit
          - triggerGitSync
          - comment
          - merge
          - review
          - installIntegration
      required:
      - object
      - id
      - title
      - emoji
      - organization
      - visibility
      - revision
      - createdAt
      - updatedAt
      - comments
      - changeRequests
      - changeRequestsOpen
      - changeRequestsDraft
      - mergeRules
      - urls
      - defaultLevel
      - permissions
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    VisitorAuthCustomBackend:
      type: object
      title: Custom backend for authenticated access
      properties:
        backend:
          type: string
          description: Custom backend for authenticated access
          enum:
          - custom
      required:
      - backend
    ApplySpaceTemplate:
      type: object
      properties:
        id:
          type: string
          description: The ID of the template to use for the space
        params:
          $ref: '#/components/schemas/SpaceTemplateParams'
      required:
      - id
    ContentImportRun:
      type: object
      properties:
        object:
          description: Type of Object, always equals to "import-run"
          type: string
          enum:
          - import-run
        id:
          description: Unique ID of the import
          type: string
        startedAt:
          description: Date when the import has started
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          description: Filled when the imported is in status "completed"
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: Date when the import was requested
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          description: Date when the import was last updated
          $ref: '#/components/schemas/Timestamp'
        status:
          description: Status of the import
          type: string
          enum:
          - pending
          - in-progress
          - completed
          - failed
          - cancelled
        reason:
          description: Reason for the import failure when `status` is `failed`.
          type: string
        source:
          description: Where the content is imported from.
          $ref: '#/components/schemas/ContentImportSource'
        target:
          description: Where the content is imported into.
          $ref: '#/components/schemas/ContentImportTarget'
        site:
          description: ID of the site the target space belongs to, when it belongs to exactly one.
          type: string
        createdBy:
          description: ID of the user who started the import.
          type: string
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              description: URL of the import run in the API
              type: string
              format: uri
          required:
          - location
        pages:
          description: Pages included in the import
          type: array
          items:
            type: object
            properties:
              id:
                description: ID of page
                type: string
              sourceURL:
                description: Source URL where the page has been imported from
                type: string
              type:
                description: Type of page
                type: string
                enum:
                - page
                - folder
              status:
                description: Status of the page
                type: string
                enum:
                - complete
                - pending
