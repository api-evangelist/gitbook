openapi: 3.2.0
info:
  title: GitBook Collections API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: Collections
  x-page-icon: folder
  x-page-title: Collections
  x-page-description: Organize and manage grouped sets of spaces for better content structure.
  description: 'Collections let you bundle multiple spaces under a unified entity, making large-scale content easier to handle. You can sort content by subject, department, or any grouping logic.


    {% openapi-schemas spec="gitbook" schemas="Collection" grouped="false" %}

    The Collection object

    {% endopenapi-schemas %}'
paths:
  /collections/{collectionId}:
    get:
      operationId: getCollectionById
      summary: Get a collection by its ID
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    patch:
      operationId: updateCollectionById
      summary: Update a collection
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/collectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/CollectionTitle'
                description:
                  $ref: '#/components/schemas/CollectionDescription'
                defaultLevel:
                  $ref: '#/components/schemas/DefaultLevel'
      responses:
        '200':
          description: The collection has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    delete:
      operationId: deleteCollectionById
      summary: Delete a collection
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/collectionId'
      responses:
        '204':
          description: Collection did not exist
        '205':
          description: Collection has been deleted
  /collections/{collectionId}/spaces:
    get:
      operationId: listSpacesInCollectionById
      summary: List all collection spaces
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/collectionId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Space'
  /collections/{collectionId}/move:
    post:
      operationId: moveCollection
      summary: Move a collection to a new position
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/collectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                parent:
                  description: The unique id of the parent collection
                  type:
                  - string
                  - 'null'
                position:
                  description: Where to move the collection. By default, it will be moved at the end.
                  $ref: '#/components/schemas/ContentPosition'
      responses:
        '200':
          description: Collection moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid position space or collection provided
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: No matching Collection found for given ID
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Operation would not result in any update
          $ref: '#/components/responses/ConflictError'
  /collections/{collectionId}/transfer:
    post:
      operationId: transferCollection
      summary: Transfer a collection
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/collectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: string
                  description: The unique id of the target organization
              required:
              - organization
      responses:
        '200':
          description: Collection transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '404':
          description: No matching Collection found for given ID
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Transfer would not result in any update
          $ref: '#/components/responses/ConflictError'
        '412':
          description: The collection cannot be moved.
          $ref: '#/components/responses/PreconditionFailedError'
  /orgs/{organizationId}/collections:
    get:
      operationId: listCollectionsInOrganizationById
      summary: List all collections
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: nested
        in: query
        description: If true, all nested collections will be listed
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Collection'
    post:
      operationId: createCollection
      summary: Create a collection
      tags:
      - Collections
      security:
      - user: []
      - oauth:
        - space:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 50
                parent:
                  type: string
                  description: ID of a parent collection
      responses:
        '201':
          description: Collection created
          headers:
            Location:
              description: API URL for the newly created collection
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
components:
  schemas:
    GitSyncOperationDirection:
      type: string
      enum:
      - export
      - import
    MemberRoleOrGuest:
      description: The role of a member in an organization, null for guests
      oneOf:
      - $ref: '#/components/schemas/MemberRole'
      - type: 'null'
    DefaultLevel:
      description: Default level for a piece of content
      oneOf:
      - $ref: '#/components/schemas/MemberRoleOrGuest'
      - type: string
        enum:
        - inherit
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    MergeRulesConfigurationInherit:
      type: object
      description: The merge rules inherits from the organization configuration.
      properties:
        type:
          type: string
          enum:
          - inherit
      required:
      - type
    PreviousGitSyncState:
      type: object
      description: What is still known about a target's Git Sync after its installation was removed. Never returned alongside `gitSync`, which describes a live installation.
      required:
      - url
      properties:
        url:
          type: string
          description: The URL to the directory of the repository tree the content synced with before its Git Sync installation was removed, at the branch it synced.
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    MergeRule:
      oneOf:
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_one_of_specific_reviewers
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - allow_bypass
          users:
            type: array
            description: List of user IDs.
            items:
              type: string
        required:
        - rule
        - users
      - type: object
        properties:
          rule:
            type: string
            enum:
            - require_at_least_one_review
            - require_at_least_one_approved_review
            - require_all_reviews_approved
            - require_agent_review
            - require_up_to_date_change_request
            - require_change_request_subject
            - require_change_request_description
            - require_author_to_merge
        required:
        - rule
      - type: object
        description: The merge rule is written in the advanced custom expression syntax.
        properties:
          rule:
            type: string
            enum:
            - custom
          expression:
            $ref: '#/components/schemas/Expression'
          message:
            type: string
            description: Optional message to display when the expression evaluates to false.
        required:
        - rule
        - expression
    SpacePointer:
      type: object
      properties:
        type:
          type: string
          enum:
          - space
        space:
          type: string
          description: Unique identifier for the space
      required:
      - type
      - space
    MemberRole:
      type: string
      description: '"The role of a member in an organization.

        "admin": Can administrate the content: create, delete spaces, ...

        "create": Can create content.

        "review": Can review content.

        "edit": Can edit the content (live or change requests).

        "comment": Can access the content and its discussions.

        "read": Can access the content, but cannot update it in any way.

        '
      enum:
      - admin
      - create
      - edit
      - review
      - comment
      - read
    Space:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "space"
          enum:
          - space
        id:
          type: string
          description: Unique identifier for the space
        title:
          $ref: '#/components/schemas/SpaceTitle'
        emoji:
          description: An emoji for this space. It'll match the emoji shown in the GitBook app.
          $ref: '#/components/schemas/Emoji'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        editMode:
          $ref: '#/components/schemas/SpaceEditMode'
        type:
          type: string
          description: Kind of space. Only set to `styleguide` for spaces holding a team's writing style guide; omitted for regular spaces.
          enum:
          - styleguide
        mergeRules:
          $ref: '#/components/schemas/MergeRulesSpaceConfiguration'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the space in the API
              format: uri
            app:
              type: string
              description: URL of the space in the application
              format: uri
            published:
              type: string
              description: URL of the published version of the space. Only defined when visibility is not "private."
              format: uri
            public:
              type: string
              description: URL of the public version of the space. Only defined when visibility is "public".
              format: uri
            icon:
              description: URL of the icon of this space, if defined.
              $ref: '#/components/schemas/URL'
          required:
          - app
          - location
        organization:
          type: string
          description: ID of the organization owning this space
        parent:
          type: string
          description: ID of the parent collection.
        language:
          $ref: '#/components/schemas/TranslationLanguage'
        gitSync:
          $ref: '#/components/schemas/GitSyncState'
        previousGitSync:
          $ref: '#/components/schemas/PreviousGitSyncState'
        imports:
          description: 'Import runs targeting this space, still running or ended recently, most recent first. Only returned when fetching a single space.

            '
          type: array
          items:
            $ref: '#/components/schemas/ContentImportRun'
        visitorAuth:
          $ref: '#/components/schemas/VisitorAuth'
        revision:
          type: string
          description: ID of the active revision in the space.
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        comments:
          type: number
          description: Count of opened comments on the space.
        changeRequests:
          type: number
          description: Total count of change requests on the space.
        changeRequestsOpen:
          type: number
          description: Count of open change requests on the space.
        changeRequestsDraft:
          type: number
          description: Count of draft change requests on the space.
        internal_poweredByV2:
          type: boolean
          description: Whether the space is powered by V2 of the content system.
        internal_singleWebsocket:
          type: boolean
          description: Whether the space uses a single websocket connection for all real-time communication.
        permissions:
          type: object
          description: The set of permissions for the space
          properties:
            view:
              type: boolean
              description: Can the user view the space content.
            access:
              type: boolean
              description: Can the user access the space in the application.
            admin:
              type: boolean
              description: Can the user edit the title, install integrations, and manage the space.
            viewInviteLinks:
              type: boolean
              description: Can the user view the invite links of the space.
            edit:
              type: boolean
              description: Can the user edit the content of the space by creating a change request.
            triggerGitSync:
              type: boolean
              description: Can the user trigger a git sync.
            comment:
              type: boolean
              description: Can the user comment on the content.
            merge:
              type: boolean
              description: Can the user merge change requests.
            review:
              type: boolean
              description: Can the user review change requests.
            installIntegration:
              type: boolean
              description: Can the user install integrations in the space.
          required:
          - view
          - access
          - admin
          - viewInviteLinks
          - edit
          - triggerGitSync
          - comment
          - merge
          - review
          - installIntegration
      required:
      - object
      - id
      - title
      - emoji
      - organization
      - visibility
      - revision
      - createdAt
      - updatedAt
      - comments
      - changeRequests
      - changeRequestsOpen
      - changeRequestsDraft
      - mergeRules
      - urls
      - defaultLevel
      - permissions
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    VisitorAuthCustomBackend:
      type: object
      title: Custom backend for authenticated access
      properties:
        backend:
          type: string
          description: Custom backend for authenticated access
          enum:
          - custom
      required:
      - backend
    ContentImportRun:
      type: object
      properties:
        object:
          description: Type of Object, always equals to "import-run"
          type: string
          enum:
          - import-run
        id:
          description: Unique ID of the import
          type: string
        startedAt:
          description: Date when the import has started
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          description: Filled when the imported is in status "completed"
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: Date when the import was requested
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          description: Date when the import was last updated
          $ref: '#/components/schemas/Timestamp'
        status:
          description: Status of the import
          type: string
          enum:
          - pending
          - in-progress
          - completed
          - failed
          - cancelled
        reason:
          description: Reason for the import failure when `status` is `failed`.
          type: string
        source:
          description: Where the content is imported from.
          $ref: '#/components/schemas/ContentImportSource'
        target:
          description: Where the content is imported into.
          $ref: '#/components/schemas/ContentImportTarget'
        site:
          description: ID of the site the target space belongs to, when it belongs to exactly one.
          type: string
        createdBy:
          description: ID of the user who started the import.
          type: string
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              description: URL of the import run in the API
              type: string
              format: uri
          required:
          - location
        pages:
          description: Pages included in the import
          type: array
          items:
            type: object
            properties:
              id:
                description: ID of page
                type: string
              sourceURL:
                description: Source URL where the page has been imported from
                type: string
              type:
                description: Type of page
                type: string
                enum:
                - page
                - folder
              status:
                description: Status of the page
                type: string
                enum:
                - complete
                - pending
            required:
            - id
            - type
            - status
      required:
      - id
      - status
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    GitSyncProvider:
      type: string
      description: The provider of the Git Sync installation.
      enum:
      - github
      - gitlab
      - github-legacy
    MergeRulesStandaloneConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationRules'
      - $ref: '#/components/schemas/MergeRulesConfigurationNone'
    Timestamp:
      type: string
      format: date-time
    ContentPosition:
      type: object
      description: Position at which to insert an item
      properties:
        before:
          oneOf:
          - $ref: '#/components/schemas/SpacePointer'
          - $ref: '#/components/schemas/CollectionPointer'
        after:
          oneOf:
          - $ref: '#/components/schemas/SpacePointer'
          - $ref: '#/components/schemas/CollectionPointer'
    EntityId:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: A unique entity identifier
    Emoji:
      type: string
      maxLength: 50
      format: emoji
      description: Unicode codepoint or character of the emoji
      example: 🎉
    CollectionPointer:
      type: object
      properties:
        type:
          type: string
          enum:
          - collection
        collection:
          type: string
          description: Unique identifier for the collection
      required:
      - type
      - collection
    ContentImportSource:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - website
          url:
            $ref: '#/components/schemas/URL'
        required:
        - type
        - url
      - type: object
        properties:
          type:
            type: string
            enum:
            - file
          files:
            description: Files to import
            type: array
            maxItems: 50
            items:
              description: Key of file
              type: string
        required:
        - type
        - files
    ContentVisibility:
      type: string
      description: "* `public`: Anyone can access the content, and the content is indexed by search engines.\n* `unlisted`: Anyone can access the content, and the content is not indexed by search engines\n* `share-link`: Anyone with a secret token in the url can access the content.\n* `visitor-auth`: Anyone authenticated through a JWT token can access the content.\n* `in-collection`: Anyone who can access the parent collection can access the content.\n  Only available for spaces in a collection.\n* `private`: Authorized members can access the content.\n"
      enum:
      - public
      - unlisted
      - share-link
      - visitor-auth
      - in-collection
      - private
    GitSyncState:
      type: object
      properties:
        repoName:
          type: string
          description: Repository name.
        installationStatus:
          $ref: '#/components/schemas/GitSyncInstallationStatus'
        installationProvider:
          $ref: '#/components/schemas/GitSyncProvider'
        integration:
          type: string
          deprecated: true
          description: The integration name providing the Git Sync.
        installationId:
          type: string
          description: The ID of the Git Sync installation.
        parentInstallationId:
          type: string
          description: The ID of the parent Git Sync installation, if any.
        url:
          type: string
          description: The URL to the repository tree, used when rendering public content.
        installationProjectDirectory:
          type: string
          description: Directory in the repository this content syncs from, resolved against the parent installation when the installation is managed by a site. Absent when the content syncs from the root of the repository.
        operation:
          type: object
          description: The latest operation on the Git Sync installation.
          properties:
            state:
              $ref: '#/components/schemas/GitSyncOperationState'
            direction:
              $ref: '#/components/schemas/GitSyncOperationDirection'
            startedAt:
              $ref: '#/components/schemas/Timestamp'
            endedAt:
              $ref: '#/components/schemas/Timestamp'
            error:
              type: string
              description: Why the operation failed, when it did.
            errorAction:
              $ref: '#/components/schemas/GitSyncOperationErrorAction'
          required:
          - state
          - direction
          - startedAt
        operationTimeout:
          type: integer
          description: How long an operation is allowed to run before it is terminated (in milliseconds).
        updatedAt:
          description: When the Git provider details were last updated
          $ref: '#/components/schemas/Timestamp'
      required:
      - installationId
      - installationProvider
      - installationStatus
    Collection:
      type: object
      properties:
        object:
          type: string
          description: Type of Object, always equals to "collection"
          enum:
          - collection
        id:
          type: string
          description: Unique identifier for the collection
        title:
          $ref: '#/components/schemas/CollectionTitle'
        description:
          $ref: '#/components/schemas/CollectionDescription'
        organization:
          type: string
          description: ID of the organization owning this collection
        parent:
          type: string
          description: ID of the parent collection, if any
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the collection in the API
              format: uri
            app:
              type: string
              description: URL of the collection in the application
              format: uri
          required:
          - app
          - location
        permissions:
          type: object
          description: The set of permissions for the collection
          properties:
            view:
              type: boolean
              description: Can the user view the collection.
            admin:
              type: boolean
              description: Can the user edit the title/description.
            viewInviteLinks:
              type: boolean
              description: Can the user view the invite links of the collection.
            create:
              type: boolean
              description: Can the user create spaces/collections in this collection.
          required:
          - view
          - admin
          - viewInviteLinks
          - create
      required:
      - object
      - id
      - title
      - organization
      - urls
      - defaultLevel
      - permissions
    CollectionTitle:
      type: string
      description: Title of the collection
      maxLength: 50
    GitSyncOperationErrorAction:
      type: object
      description: An action the user can take to resolve a failed Git Sync operation.
      properties:
        label:
          type: string
          description: Label for the action.
        url:
          type: string
          format: uri
          description: URL where the user can resolve the failure.
      required:
      - label
      - url
    MergeRulesSpaceConfiguration:
      oneOf:
      - $ref: '#/components/schemas/MergeRulesConfigurationInherit'
      - $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
    MergeRulesConfigurationNone:
      type: object
      description: The merge rules are disabled, change requests can be merged without review.
      properties:
        type:
          type: string
          enum:
          - none
      required:
      - type
    SpaceTitle:
      type: string
      description: Title of the space
      maxLength: 50
    URL:
      type: string
      format: uri
      maxLength: 2048
    ContentImportTarget:
      type: object
      properties:
        space:
          type: string
          description: ID of the space to import in
        changeRequest:
          type: string
          description: ID of the change request to import in
        page:
          type: string
          description: ID of the page to import in
      required:
      - space
    SpaceEditMode:
      type: string
      description: 'Determines how a Space can be edited.

        * `live`: Users can directly edit the space

        * `locked`: All edits are locked for this space.

        '
      enum:
      - live
      - locked
    GitSyncOperationState:
      type: string
      description: '* `running`: The operation is still running

        * `failure`: The operation failed

        * `success`: The operation was successful

        * `timeout`: The operation timed out

        '
      enum:
      - running
      - failure
      - success
      - timeout
    List:
      type: object
      properties:
        next:
          type: object
          properties:
            page:
              type: string
              description: Unique identifier to query the next results page
          required:
          - page
        count:
