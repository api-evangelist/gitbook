          description: The yearly AI credit allowance agreed in the organization's contract, or null when none is set.
          oneOf:
          - type: integer
          - type: 'null'
        aiCreditRollover:
          description: The percentage of unused paid bundle credits carried over to the next monthly AI billing period.
          type: integer
          minimum: 0
          maximum: 100
