openapi: 3.2.0
info:
  title: GitBook Critical API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: critical
paths:
  /user:
    get:
      operationId: getAuthenticatedUser
      summary: Get profile of authenticated user
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - user:read
      description: Returns details about the user associated with the authentication provided in the request's authorization header.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
  /users/{userId}:
    get:
      operationId: getUserById
      summary: Get a user by its ID
      tags:
      - critical
      security:
      - user: []
      description: Provides publicly available information about someone with a GitBook account.
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateUserById
      summary: Update a user by its ID
      tags:
      - critical
      security:
      - user: []
      description: Update a GitBook account's details.
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName:
                  type: string
                  description: Full name for the user
                  minLength: 1
                  maxLength: 64
                photoURL:
                  $ref: '#/components/schemas/URL'
      responses:
        '200':
          description: The user has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
  /spaces/{spaceId}:
    get:
      operationId: getSpaceById
      summary: Get full details of a space by its ID
      description: Returns the full metadata for a space. Use this to resolve a spaceId into a complete Space object. If you only need content, use the content endpoint instead.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/siteShareKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
  /spaces/{spaceId}/comments:
    get:
      operationId: listCommentsInSpace
      summary: List all top-level comments posted on a space
      description: Returns a paginated list of comments posted directly on the space (not inside a change request). To read replies to a specific comment, use the comment replies endpoint.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - $ref: '#/components/parameters/listOrder'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/documentFormat'
      - $ref: '#/components/parameters/targetPage'
      - $ref: '#/components/parameters/authors'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Comment'
  /spaces/{spaceId}/commenters:
    get:
      operationId: listCommentersInSpace
      summary: List all users who have posted comments in a space
      description: Returns a paginated list of organization members who have posted at least one comment in the space. Use this to identify participants in a space's review or annotation workflow. For the actual comment content, use the space comments endpoint.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrganizationMember'
  /spaces/{spaceId}/change-requests/{changeRequestId}/commenters:
    get:
      operationId: listCommentersInChangeRequest
      summary: List all users who have commented in a change request
      description: Returns a paginated list of organization members who have posted at least one comment in the change request. Use this to identify who is actively engaged in the review discussion before adding or directing comments.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - space:read
      parameters:
      - $ref: '#/components/parameters/spaceId'
      - $ref: '#/components/parameters/changeRequestId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrganizationMember'
  /orgs:
    get:
      operationId: listOrganizationsForAuthenticatedUser
      summary: Get the list of organizations for the currently authenticated user
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - organization:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
                  required:
                  - items
  /orgs/{organizationId}:
    get:
      operationId: getOrganizationById
      summary: Get an organization by its ID
      x-gitbook-mcp: true
      tags:
      - critical
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: No matching organization found for given id
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/members/{userId}:
    get:
      operationId: getMemberInOrganizationById
      x-gitbook-mcp: true
      summary: Get an organization member by its ID
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - organization:members:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
  /orgs/{organizationId}/integrations/installations-status:
    get:
      operationId: listOrganizationIntegrationsStatus
      summary: List all integration statuses
      description: Returns integration installations in the organization. Use site or space with the matching target to efficiently scope the result to one resource. The target of each installation says whether it is installed on the organization, a space or a site.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - integration: []
      - integration-installation: []
      - oauth:
        - integration:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: target
        in: query
        description: Filter installations by their target (organization, space, or site). When not provided, defaults to organization-level installations for backwards compatibility
        schema:
          type: string
          default: organization
          enum:
          - organization
          - space
          - site
      - name: site
        in: query
        description: Return installations for this site. Only valid when target is site.
        schema:
          type: string
      - name: space
        in: query
        description: Return installations for this space. Only valid when target is space.
        schema:
          type: string
      responses:
        '200':
          description: List of installed integrations and their statuses
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/InstalledIntegration'
  /orgs/{organizationId}/sites:
    get:
      operationId: listSites
      summary: List all documentation sites in an organization
      description: Returns a paginated list of all documentation sites belonging to the organization. Use this to discover available sites before fetching their content, settings, or structure. Members with access only to individual spaces receive the sites that use those spaces as site items, with site administration fields omitted.
      x-gitbook-mcp:
        curatedBy: list_sites
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: space
        in: query
        description: Identifier of the space to filter the sites by
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: Filter sites by their title
        required: false
        schema:
          type: string
      - name: published
        in: query
        description: Filter sites by their published status
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: Filter by site type
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SiteType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Site'
  /orgs/{organizationId}/sites/{siteId}/site-spaces:
    get:
      operationId: listSiteSpaces
      summary: List all spaces linked to a site as content sources
      description: Returns a paginated list of site spaces — the links between a site and its content source spaces. Each site space can be a language variant or content version within a section. Use the default filter to retrieve only the primary site space, or omit it to get all linked spaces including drafts. Members with access only to individual spaces receive only site-space links for those spaces.
      x-gitbook-mcp: true
      tags:
      - critical
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/siteId'
      - $ref: '#/components/parameters/siteShareKey'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      - name: default
        in: query
        description: If true, only the default site space will be returned. If false, only the non-default site spaces are returned. If undefined, all site spaces are returned.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteSpace'
components:
  schemas:
    BlockReason:
      type: string
      description: A short description giving context on the reason for the block.
      minLength: 1
      maxLength: 255
    IntegrationInstallationStatus:
      type: string
      enum:
      - active
      - pending
      - paused
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    BillingCreditsBundle:
      type: string
      description: The AI credit bundle to top up every month
      enum:
      - none
      - '4750_250'
      - '9000_1000'
      - '12750_2250'
      - '30000_10000'
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    BillingProduct:
      type: string
      description: Name of the product
      enum:
      - free_2024
      - plus_2024
      - pro_2024
      - enterprise_2024
      - community_2024
      - internal
    MarkdownDocument:
      type: object
      properties:
        markdown:
          type: string
          description: Content of the document formatted as markdown
          example: '# Hello World


            This is a markdown document linking to [another page](/pages/page_id).

            '
      required:
      - markdown
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    CustomizationThemedURL:
      type: object
      properties:
        light:
          $ref: '#/components/schemas/URL'
        dark:
          $ref: '#/components/schemas/URL'
      required:
      - light
      - dark
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    OrganizationSupportCost:
      description: What support costs the organization, per ticket or per hour of agent time, used to estimate how much AI answers save in site insights.
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          perTicket:
            type: number
            minimum: 0.01
            description: Cost of one support ticket, in `currency`.
          currency:
            type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 currency code.
        required:
        - perTicket
        - currency
      - type: object
        additionalProperties: false
        properties:
          perHour:
            type: number
            minimum: 0.01
            description: Cost of one hour of support agent time, in `currency`.
          currency:
            type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 currency code.
        required:
        - perHour
        - currency
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    BillingInterval:
      type: string
      description: Interval for a billing subscription
      enum:
      - monthly
      - yearly
    IntegrationExternalLinks:
      type: array
      description: External urls configured by the developer of the integration
      maxItems: 5
      items:
        type: object
        properties:
          url:
            $ref: '#/components/schemas/URL'
          label:
            type: string
        required:
        - url
        - label
    DocumentTableDefinitionUsers:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - users
          multiple:
            type: boolean
        required:
        - type
        - multiple
    DocumentBlockStepper:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - stepper
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlockStepperStep'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - nodes
    VisitorAuth:
      oneOf:
      - $ref: '#/components/schemas/VisitorAuthCustomBackend'
      - allOf:
        - $ref: '#/components/schemas/VisitorAuthIntegrationBackend'
        - type: object
          properties:
            integration:
              type: string
              description: Name of integration being used as the backend for authenticated access
          required:
          - integration
    ContentRef:
      description: A relative reference to content in GitBook.
      oneOf:
      - $ref: '#/components/schemas/ContentRefFile'
      - $ref: '#/components/schemas/ContentRefURL'
      - $ref: '#/components/schemas/ContentRefPage'
      - $ref: '#/components/schemas/ContentRefAnchor'
      - $ref: '#/components/schemas/ContentRefUser'
      - $ref: '#/components/schemas/ContentRefCollection'
      - $ref: '#/components/schemas/ContentRefSpace'
      - $ref: '#/components/schemas/ContentRefReusableContent'
      - $ref: '#/components/schemas/ContentRefTag'
      - $ref: '#/components/schemas/ContentRefOpenAPI'
    OrganizationPricePair:
      type: object
      description: Pricing pair for monthly and yearly intervals
      properties:
        monthly:
          type: number
          description: Monthly price in USD
          minimum: 0
        yearly:
          type: number
          description: Yearly price in USD (per month)
          minimum: 0
      required:
      - monthly
      - yearly
    DocumentText:
      type: object
      properties:
        object:
          type: string
          enum:
          - text
        key:
          type: string
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTextLeaf'
      required:
      - object
      - leaves
    GitSyncInstallationStatus:
      type: string
      enum:
      - unauthenticated
      - active
      - pending
    SiteTitle:
      type: string
      description: Title of the site
      minLength: 2
      maxLength: 128
    IntegrationConfigurations:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/IntegrationConfiguration'
        space:
          $ref: '#/components/schemas/IntegrationConfiguration'
        site:
          $ref: '#/components/schemas/IntegrationConfiguration'
    DocumentMarkBold:
      type: object
      properties:
        object:
          type: string
          enum:
          - mark
        type:
          type: string
          enum:
          - bold
      required:
      - object
      - type
    DocumentBlockHint:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - hint
        key:
          type: string
        data:
          type: object
          properties:
            style:
              type: string
              enum:
              - info
              - warning
              - danger
              - success
            icon:
              $ref: '#/components/schemas/Icon'
          required:
          - style
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentBlocksEssentials'
            - $ref: '#/components/schemas/DocumentBlockEmbed'
            - $ref: '#/components/schemas/DocumentBlockIntegration'
            - $ref: '#/components/schemas/DocumentBlockTable'
            - $ref: '#/components/schemas/DocumentBlockQuote'
            - $ref: '#/components/schemas/DocumentBlockCode'
            - $ref: '#/components/schemas/DocumentBlockDrawing'
            - $ref: '#/components/schemas/DocumentBlockExpandable'
            - $ref: '#/components/schemas/DocumentBlockFile'
            - $ref: '#/components/schemas/DocumentBlockHint'
            - $ref: '#/components/schemas/DocumentBlockIf'
            - $ref: '#/components/schemas/DocumentBlockMath'
            - $ref: '#/components/schemas/DocumentBlockPrompt'
            - $ref: '#/components/schemas/DocumentBlockStepper'
            - $ref: '#/components/schemas/DocumentBlockTabs'
        isVoid:
          type: boolean
          enum:
          - false
      required:
      - object
      - type
      - data
      - nodes
    ContentRefURL:
      type: object
      properties:
        kind:
          type: string
          enum:
          - url
        url:
          type: string
      required:
      - kind
      - url
    DocumentInlineIcon:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - icon
        key:
          type: string
        data:
          type: object
          properties:
            icon:
              type: string
            color:
              $ref: '#/components/schemas/DocumentTextColor'
          required:
          - icon
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    DocumentTableDefinitionSelect:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - select
          multiple:
            type: boolean
          options:
            type: array
            items:
              $ref: '#/components/schemas/DocumentTableSelectOption'
        required:
        - type
        - multiple
        - options
    EmojiReaction:
      type: object
      description: An emoji reaction by one or many users
      properties:
        emoji:
          type: string
          description: The Emoji of the reaction
        count:
          type: number
          description: The number of users who reacted with this emoji
        users:
          type: array
          description: The users who reacted with this emoji
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
              reactedAt:
                $ref: '#/components/schemas/Timestamp'
            required:
            - user
            - reactedAt
      required:
      - emoji
      - count
      - users
    InstalledIntegrationTarget:
