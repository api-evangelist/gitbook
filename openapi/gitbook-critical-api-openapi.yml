              type: boolean
              description: Can the user access the site in the application.
            edit:
              type: boolean
              description: Can the user edit content and create draft content in the site.
            create:
              type: boolean
              description: Can the user create draft content, publish content, and manage the site's content structure.
            admin:
              type: boolean
