openapi: 3.2.0
info:
  title: GitBook Organizations API
  description: The GitBook API
  termsOfService: https://policies.gitbook.com
  contact:
    name: API Support
    url: https://gitbook.com/support
    email: support@gitbook.com
  version: 0.0.1-beta
servers:
- url: '{host}/v1'
  variables:
    host:
      default: https://api.gitbook.com
security:
- user: []
- user-internal: []
- user-staff: []
- integration: []
- integration-installation: []
tags:
- name: Organizations
  x-page-icon: building
  x-page-title: Organizations
  x-page-description: Manage your organizations and group your members, spaces, and resources under one collaborative structure.
  description: 'The Organizations API provides a robust way to handle the administrative structure of your GitBook workspace. By creating and configuring organizations, you can group multiple users, spaces, and collections, simplifying your permission management and fostering efficient collaboration for teams of any size.


    {% openapi-schemas spec="gitbook" schemas="Organization" grouped="false" %}

    The Organization object

    {% endopenapi-schemas %}'
paths:
  /orgs:
    get:
      operationId: listOrganizationsForAuthenticatedUser
      summary: Get the list of organizations for the currently authenticated user
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:read
      parameters:
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
                  required:
                  - items
    post:
      operationId: createOrganization
      summary: Create an organization
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:write
      parameters:
      - name: withDefaultSite
        in: query
        description: If true, also creates a default documentation site for the organization.
        required: false
        schema:
          type: boolean
      - name: openapiUrl
        in: query
        description: URL of an OpenAPI/Swagger specification to import and attach to the default site as a reference. Only used when `withDefaultSite` is true.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Organization created
          headers:
            Location:
              description: API URL for the newly created organization
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Organization'
                - type: object
                  properties:
                    subscriptionNotice:
                      $ref: '#/components/schemas/SubscriptionNotice'
  /orgs/{organizationId}:
    get:
      operationId: getOrganizationById
      summary: Get an organization by its ID
      x-gitbook-mcp: true
      tags:
      - Organizations
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: No matching organization found for given id
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateOrganizationById
      summary: Update an organization
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/OrganizationTitle'
                emailDomains:
                  $ref: '#/components/schemas/OrganizationEmailDomains'
                hostname:
                  $ref: '#/components/schemas/OrganizationHostname'
                defaultRole:
                  $ref: '#/components/schemas/MemberRoleOrGuest'
                defaultContent:
                  oneOf:
                  - $ref: '#/components/schemas/OrganizationDefaultContent'
                  - type: 'null'
                logo:
                  oneOf:
                  - $ref: '#/components/schemas/URL'
                  - type: 'null'
                sso:
                  type: boolean
                ai:
                  type: boolean
                aiSettings:
                  $ref: '#/components/schemas/OrganizationAISettingsUpdate'
                inviteLinks:
                  type: boolean
                mergeRules:
                  $ref: '#/components/schemas/MergeRulesStandaloneConfiguration'
                supportCost:
                  oneOf:
                  - $ref: '#/components/schemas/OrganizationSupportCost'
                  - type: 'null'
      responses:
        '200':
          description: The organization has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid default content space or collection provided
          $ref: '#/components/responses/BadRequestError'
  /orgs/{organizationId}/audit-event-actions:
    get:
      operationId: listOrganizationAuditEventActions
      x-gitbook-mcp: true
      summary: List organization audit event actions
      description: Lists the supported audit event action identifiers and their display labels. Access is restricted to organization administrators and GitBook staff. The organization must be activated and on an active Enterprise plan, except for GitBook's own organization.
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: Supported audit event actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEventAction'
                required:
                - items
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/audit-events:
    get:
      operationId: listOrganizationAuditEvents
      x-gitbook-mcp: true
      summary: List organization audit events
      description: Lists recorded changes for an activated organization. Access is restricted to organization administrators and GitBook staff, and results are ordered by occurrence time, newest first. An active Enterprise plan is required except for GitBook's own organization.
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - name: limit
        in: query
        description: Number of events to return, up to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: from
        in: query
        description: Include events occurring at or after this time.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Include events occurring at or before this time.
        schema:
          type: string
          format: date-time
      - name: action
        in: query
        description: Filter by an exact audit action name.
        schema:
          type: string
      - name: actor
        in: query
        description: Filter by an exact stable actor identifier.
        schema:
          type: string
      - name: target
        in: query
        description: Filter by an exact stable target identifier.
        schema:
          type: string
      responses:
        '200':
          description: Paginated audit events.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditEvent'
                  required:
                  - items
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/audit-events/{auditEventId}:
    get:
      operationId: getOrganizationAuditEvent
      x-gitbook-mcp: true
      summary: Get an organization audit event
      description: Returns the full allowlisted payload for one recorded organization change. Access is restricted to organization administrators and GitBook staff. The organization must be activated and on an active Enterprise plan, except for GitBook's own organization.
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - name: auditEventId
        in: path
        required: true
        description: Unique identifier of the audit event.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/styleguides:
    get:
      operationId: listOrganizationStyleguides
      summary: List all style guides in an organization
      description: Lists every style guide (a space holding a team's writing style guide) in the organization, along with every site that references each one. Style guides that are not referenced by any site are still returned with an empty `sites` list.
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationStyleguides'
  /orgs/{organizationId}/styleguide-templates:
    get:
      operationId: listStyleguideTemplates
      summary: List all built-in style guide templates
      description: Lists the built-in style guide starter templates that can seed a new styleguide, including the markdown content used to render each template's preview.
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - site:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleguideTemplates'
  /orgs/{organizationId}/subscription:
    get:
      operationId: getOrganizationSubscription
      summary: Get an organization's subscription
      description: Returns whether the organization is on a trial, the free plan or a paid plan, when its trial ends, and where to upgrade. Use it to answer questions about the plan or the trial, or to find how to upgrade.
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSubscription'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/link-invites/{inviteId}:
    delete:
      operationId: deleteOrganizationInviteById
      summary: Deletes an organization invite
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:members:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/inviteId'
      responses:
        '204':
          description: Organization invite did not exist
        '205':
          description: The organization invite has been deleted
  /orgs/{organizationId}/join:
    post:
      operationId: joinOrganization
      summary: Join an organization
      x-gitbook-mcp: true
      description: 'Join an organization if the user''s verified email domain matches one of the organization''s allowed email domains.

        This endpoint allows existing users to join organizations they''re eligible for based on their email domain.'
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '204':
          description: Successfully joined the organization
        '400':
          description: User's email domain is not valid
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Organization not found
          $ref: '#/components/responses/NotFoundError'
  /orgs/{organizationId}/search:
    get:
      operationId: searchOrganizationContent
      summary: Search content in an organization
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:search
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SearchSpaceResult'
  /orgs/{organizationId}/agent-instructions:
    get:
      operationId: getOrganizationAgentInstructions
      summary: Get Docs agent instructions for an organization
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAgentInstructions'
    put:
      operationId: updateOrganizationAgentInstructions
      summary: Update Docs agent instructions for an organization
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - instructions
              properties:
                instructions:
                  $ref: '#/components/schemas/JSONDocument'
                  description: Document describing the Docs agent instructions.
      responses:
        '200':
          description: Updated instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAgentInstructions'
  /orgs/{organizationId}/agent/conversations:
    get:
      operationId: listOrganizationAgentConversations
      summary: List AI agent conversations in an organization
      description: 'Returns a paginated list of the calling user''s AI agent conversations with the organization agent. Unlike change request conversations, these are not tied to a single change request: the agent works across the organization and only attaches a change request when it needs to edit content. A conversation belongs to the user who started it and is never visible to anyone else.'
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:read
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/listPage'
      - $ref: '#/components/parameters/listLimit'
      responses:
        '200':
          description: A list of agent conversations
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/List'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AgentConversation'
  /orgs/{organizationId}/agent/conversations/{conversationId}:
    put:
      operationId: provisionOrganizationAgentConversation
      summary: Provision an AI agent conversation in an organization
      description: Prepares a conversation so the client can connect to it, giving the agent the credentials it acts with. Call this before opening a conversation; connecting to one that was never provisioned yields an agent whose tools all fail. The conversation itself is only recorded once the user sends a first message, so opening the agent and closing it again leaves nothing behind. Safe to call again to refresh an expiring session.
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/conversationId'
      responses:
        '204':
          description: The conversation is ready to be connected to.
    patch:
      operationId: updateOrganizationAgentConversation
      summary: Update an AI agent conversation in an organization
      description: Updates one of the calling user's conversations with the organization agent. Use this to rename it.
      x-gitbook-mcp: true
      tags:
      - Organizations
      security:
      - user: []
      - oauth:
        - organization:write
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                  description: The new title of the conversation.
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversation'
    delete:
      operationId: deleteOrganizationAgentConversation
      summary: Delete an agent conversation in an organization
      description: Deletes one of the calling user's conversations with the organization agent, destroying the messages it holds. This cannot be undone.
      tags:
      - Organizations
      security:
      - user: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/conversationId'
      responses:
        '205':
          description: The conversation has been deleted.
  /email-domains/{emailDomain}/orgs:
    get:
      operationId: getOrganizationsForEmailDomain
      summary: Get all organizations by email domain
      tags:
      - Organizations
      security:
      - user-internal: []
      parameters:
      - $ref: '#/components/parameters/emailDomain'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                required:
                - organizations
components:
  schemas:
    SearchPageResult:
      type: object
      description: Search result representing a page in a space.
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: Description of the page, suitable for presenting a page-root search destination.
        path:
          type: string
        score:
          $ref: '#/components/schemas/SearchResultScore'
        rank:
          type: integer
          minimum: 1
          description: One-based position in the globally ranked result set, preserved when results are paginated and grouped by space.
        resultType:
          type: string
          description: Whether the page matched on its own fields (title, description) or on the content of one of its sections.
          enum:
          - page
          - section
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SearchSectionResult'
        ancestors:
          type: array
          description: Data about the ancestors of the current page, from top-level to direct parent.
          items:
            type: object
            properties:
              title:
                type: string
            required:
            - title
        urls:
          type: object
          description: URLs associated with the object
          properties:
            app:
              type: string
              description: URL of the page in the application
              format: uri
          required:
          - app
      required:
      - id
      - title
      - description
      - path
      - score
      - rank
      - ancestors
      - urls
    BlockReason:
      type: string
      description: A short description giving context on the reason for the block.
      minLength: 1
      maxLength: 255
    Expression:
      type: string
      description: Expression to evaluate
      minLength: 0
      maxLength: 1024
    DocumentBlockDivider:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - divider
        key:
          type: string
        isVoid:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties: {}
          additionalProperties: false
      required:
      - object
      - type
      - isVoid
      - data
    BillingCreditsBundle:
      type: string
      description: The AI credit bundle to top up every month
      enum:
      - none
      - '4750_250'
      - '9000_1000'
      - '12750_2250'
      - '30000_10000'
    DocumentBlockIf:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - if
        key:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlocksTopLevels'
        isVoid:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
      required:
      - object
      - type
      - nodes
      - data
    BillingProduct:
      type: string
      description: Name of the product
      enum:
      - free_2024
      - plus_2024
      - pro_2024
      - enterprise_2024
      - community_2024
      - internal
    ContentRefPage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - page
        page:
          type: string
        space:
          description: ID of the space the page is in. The page is considered as in the current space if none is provided.
          type: string
      required:
      - kind
      - page
    DocumentBlockDrawing:
      type: object
      properties:
        object:
          type: string
          enum:
          - block
        type:
          type: string
          enum:
          - drawing
        key:
          type: string
        data:
          type: object
          properties:
            ref:
              oneOf:
              - $ref: '#/components/schemas/ContentRefFile'
        fragments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DocumentFragment'
            - type: object
              properties:
                fragment:
                  type: string
                  enum:
                  - caption
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentBlockParagraph'
              required:
              - nodes
              - fragment
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    MergeRulesConfigurationRules:
      type: object
      description: The merge rules are composed of individual rules that must all pass.
      properties:
        type:
          type: string
          enum:
          - rules
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MergeRule'
      required:
      - type
      - rules
    CustomizationThemedURL:
      type: object
      properties:
        light:
          $ref: '#/components/schemas/URL'
        dark:
          $ref: '#/components/schemas/URL'
      required:
      - light
      - dark
    CardsImageObjectFit:
      type: string
      description: Object fit for image display in card views
      enum:
      - contain
      - fill
      - cover
    DocumentBlocksEssentials:
      oneOf:
      - $ref: '#/components/schemas/DocumentBlockParagraph'
      - $ref: '#/components/schemas/DocumentBlockHeading'
      - $ref: '#/components/schemas/DocumentBlockListOrdered'
      - $ref: '#/components/schemas/DocumentBlockListUnordered'
      - $ref: '#/components/schemas/DocumentBlockListTasks'
      - $ref: '#/components/schemas/DocumentBlockDivider'
    OrganizationSupportCost:
      description: What support costs the organization, per ticket or per hour of agent time, used to estimate how much AI answers save in site insights.
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          perTicket:
            type: number
            minimum: 0.01
            description: Cost of one support ticket, in `currency`.
          currency:
            type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 currency code.
        required:
        - perTicket
        - currency
      - type: object
        additionalProperties: false
        properties:
          perHour:
            type: number
            minimum: 0.01
            description: Cost of one hour of support agent time, in `currency`.
          currency:
            type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 currency code.
        required:
        - perHour
        - currency
    DocumentTableDefinitionCheckbox:
      allOf:
      - $ref: '#/components/schemas/DocumentTableDefinitionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - checkbox
        required:
        - type
    DocumentFragment:
      type: object
      properties:
        object:
          type: string
          enum:
          - fragment
        key:
          type: string
        fragment:
          type: string
        type:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentBlock'
      required:
      - object
      - nodes
    DocumentInlineExpression:
      type: object
      properties:
        object:
          type: string
          enum:
          - inline
        type:
          type: string
          enum:
          - expression
        key:
          type: string
        data:
          type: object
          properties:
            expression:
              type: string
          required:
          - expression
        isVoid:
          type: boolean
          enum:
          - true
      required:
      - object
      - type
      - data
      - isVoid
    BillingInterval:
      type: string
      description: Interval for a billing subscription
      enum:
      - monthly
      - yearly
    SubscriptionTrial:
      type: object
      description: The current or last trial of an organization.
      properties:
        status:
