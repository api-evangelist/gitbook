          type: string
          description: Unique identifier of the site
        type:
          $ref: '#/components/schemas/SiteType'
        appliedType:
          $ref: '#/components/schemas/SiteType'
          description: The currently applied type of the site. For example, frozen sites will have this set to Basic.
        unpublishedBy:
          type: string
          enum:
          - user
          - system
          description: Who unpublished this site last. Cleared when the site is published again.
        title:
          $ref: '#/components/schemas/SiteTitle'
        icon:
          oneOf:
          - $ref: '#/components/schemas/CustomizationFavicon'
          - type: 'null'
        hostname:
          $ref: '#/components/schemas/SiteHostname'
        basename:
          $ref: '#/components/schemas/SiteBasename'
        proxy:
          $ref: '#/components/schemas/SiteProxy'
        visibility:
          $ref: '#/components/schemas/SiteVisibility'
        defaultLevel:
          $ref: '#/components/schemas/DefaultLevel'
        permissions:
          type: object
          description: The set of permissions for the site.
          properties:
            view:
              type: boolean
              description: Can the user view the site.
            access:
              type: boolean
              description: Can the user access the site in the application.
            edit:
              type: boolean
              description: Can the user edit content and create draft content in the site.
            create:
              type: boolean
              description: Can the user create draft content, publish content, and manage the site's content structure.
            admin:
              type: boolean
              description: Can the user manage the site content, settings and publish the site.
            installIntegration:
              type: boolean
              description: Can the user install integrations on the site.
            viewAdaptiveSchema:
              type: boolean
              description: Can the user view the adaptive schema of the site.
            editAdaptiveSchema:
              type: boolean
              description: Can the user edit the adaptive schema of the site.
          required:
          - view
          - access
          - edit
          - create
          - admin
          - installIntegration
          - viewAdaptiveSchema
          - editAdaptiveSchema
        published:
          type: boolean
          description: Whether the site is live or not. If true, the site is accessible to the audience defined by the visibility setting.
        siteSpaces:
          type: number
        gitSync:
          $ref: '#/components/schemas/GitSyncState'
        createdAt:
          type: string
          format: date-time
        lastScanAt:
          type: string
          format: date-time
          description: 'When GitBook last completed a scan of the site''s content

            gaps. Absent until the site has been scanned at least once.

            '
        adaptiveContent:
          $ref: '#/components/schemas/SiteAdaptiveContent'
        ads:
          $ref: '#/components/schemas/SiteAds'
        styleguide:
          $ref: '#/components/schemas/ContentRefSpace'
          description: 'Reference to a GitBook space holding the team''s writing style guide.

            When present on a site, the editing agent receives the style guide

            table of contents in its system prompt and can fetch sections on

            demand to check edits against the rules.

            '
        features:
          description: 'A list of all premium features enabled on this site. For each feature we list the plan they belong to and whether the feature is frozen. A frozen feature is still enabled but cannot be changed or modified.

            '
          type: array
          items:
            $ref: '#/components/schemas/SiteFeature'
        urls:
          type: object
          description: URLs associated with the object
          properties:
            location:
              type: string
              description: URL of the site in the API
              format: uri
            app:
              type: string
              description: URL of the site in the application
              format: uri
            published:
              type: string
              description: URL of the published version of the site. Only defined when site is published.
              format: uri
            preview:
              type: string
              description: URL of the preview version of the site.
              format: uri
            login:
              type: string
              description: 'URL of the login endpoint for visitors to authenticate with the site auth backend.

                '
              format: uri
            logout:
              type: string
              description: 'URL of the logout endpoint for visitors to sign out from the site auth backend.

                '
              format: uri
          required:
          - app
          - location
          - preview
      required:
      - object
      - id
      - type
      - appliedType
      - title
      - visibility
      - defaultLevel
      - permissions
      - published
      - createdAt
      - siteSpaces
      - features
      - urls
